<style>
:root{
  --purple-deep:#3B1F7A;
  --purple:#4B2E92;
  --purple-soft:#6B4FB8;
  --blue:#2AA9E0;
  --blue-deep:#1E7BB8;
  --ink:#181233;
  --muted:#6B7280;
  --muted-2:#94A0B4;
  --bg-top:#EAF6FB;
  --bg-bottom:#FFFFFF;
  --surface:#FFFFFF;
  --surface-2:#F6F9FC;
  --border:#E4E9F2;
  --border-soft:#EDF1F6;
  --success:#15A36E;
  --success-bg:#E7F8F1;
  --warning:#E08E1A;
  --warning-bg:#FCF1DF;
  --danger:#DC3545;
  --danger-bg:#FCE8EA;
  --shadow-sm:0 1px 2px rgba(24,18,51,.06), 0 1px 1px rgba(24,18,51,.04);
  --shadow-md:0 4px 16px rgba(59,31,122,.08), 0 2px 6px rgba(59,31,122,.06);
  --shadow-lg:0 12px 40px rgba(59,31,122,.14), 0 4px 12px rgba(59,31,122,.08);
  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:22px;
  --grad-brand: linear-gradient(120deg, var(--purple-deep) 0%, var(--purple) 45%, var(--blue) 100%);
  --grad-bg: radial-gradient(ellipse 1200px 600px at 15% -10%, #DFF3FB 0%, transparent 55%), radial-gradient(ellipse 1000px 700px at 100% 0%, #EFEAFB 0%, transparent 50%), linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 380px);
  --font-display:'Sora', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
  --scale:1;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--grad-bg);
  background-attachment:fixed;
  min-height:100vh;
  font-size:calc(15px * var(--scale));
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); letter-spacing:-0.01em; color:var(--ink);}
button{font-family:var(--font-body); cursor:pointer;}
a{color:inherit;}
svg{display:block;}
.btn svg, .tab-btn svg, .client-menu-btn svg, .modal-close svg{width:16px; height:16px; flex-shrink:0;}
.btn-icon svg{width:18px; height:18px;}
.add-card-icon svg{width:18px; height:18px;}
.client-badge svg{width:20px; height:20px;}
.info-panel-icon svg{width:17px; height:17px;}
.doc-icon svg{width:18px; height:18px;}
.feed-avatar svg{width:16px; height:16px;}
.empty-state svg{width:40px; height:40px;}
.etapa-check svg{width:15px; height:15px;}
.cable-node svg{width:17px; height:17px;}
::selection{background:var(--blue); color:#fff;}
:focus-visible{outline:2.5px solid var(--blue); outline-offset:2px; border-radius:6px;}

.hidden{display:none !important;}
.mono{font-family:var(--font-mono);}

/* ============ SCROLLBAR ============ */
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#D3DCE8; border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:#B7C4D6;}

/* ============ LOGIN SCREEN ============ */
#screen-welcome {
  min-height:100vh; position:relative; overflow:hidden;
  background: #0b0b14;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}
#screen-welcome.fade-out { opacity: 0; visibility: hidden; }
#vinheta-video{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:contain; z-index:1;
}
.btn-som-vinheta{
  position:absolute; z-index:3; bottom:36px; right:24px;
  width:46px; height:46px; border-radius:50%; border:none;
  background:rgba(255,255,255,.14); backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:center;
  color:#fff; cursor:pointer; transition:background .15s;
}
.btn-som-vinheta:hover{ background:rgba(255,255,255,.24); }
.btn-som-vinheta svg{ width:22px; height:22px; }

.splash-glow-fx {
  position: absolute; width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(42,169,224,0.25) 0%, transparent 70%);
  border-radius: 50%;
  animation: pulseGlow 5s infinite ease-in-out;
  z-index: 1;
}
.splash-content {
  position: relative; z-index: 2; text-align: center; color: #fff;
  display: flex; flex-direction: column; align-items: center;
  animation: carLaunch 5s cubic-bezier(0.1, 1, 0.3, 1) forwards;
}
.splash-logo {
  font-family: var(--font-display); font-size: 46px; font-weight: 800; letter-spacing: -0.03em;
  margin-bottom: 8px; display: flex; align-items: center; gap: 2px;
}
.l-1 { animation: flyFromTopLeft 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
.l-2 { animation: flyFromBottomLeft 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards; opacity: 0; }
.l-3 { animation: flyFromTopRight 1.3s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; opacity: 0; }
.l-4 { animation: flyFromBottomRight 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards; opacity: 0; color: var(--blue); text-shadow: 0 0 20px rgba(42,169,224,0.6); }
.l-5 { animation: flyFromTopLeft 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards; opacity: 0; color: var(--blue); text-shadow: 0 0 20px rgba(42,169,224,0.6); }
.l-6 { animation: flyFromBottomRight 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards; opacity: 0; color: var(--blue); text-shadow: 0 0 20px rgba(42,169,224,0.6); }
.l-7 { animation: flyFromTopRight 1.25s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards; opacity: 0; color: var(--blue); text-shadow: 0 0 20px rgba(42,169,224,0.6); }
.splash-tagline {
  font-size: 13.5px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase;
  color: rgba(255,255,255,0.8); opacity: 0; animation: fadeInTag 1s ease 1s forwards;
}
.splash-loader-track {
  width: 180px; height: 3px; background: rgba(255,255,255,0.15); border-radius: 4px;
  margin-top: 45px; overflow: hidden; opacity: 0; animation: fadeInTag 0.8s ease 1.2s forwards;
}
.splash-loader-bar {
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, #fff, var(--blue));
  transform: translateX(-100%);
  animation: fillProgress 3.5s cubic-bezier(0.25, 1, 0.5, 1) 1.2s forwards;
}
@keyframes flyFromTopLeft{0%{transform:translate(-180px,-150px) rotate(-25deg) scale(.4); opacity:0;} 100%{transform:translate(0,0) rotate(0) scale(1); opacity:1;}}
@keyframes flyFromBottomLeft{0%{transform:translate(-150px,180px) rotate(30deg) scale(.4); opacity:0;} 100%{transform:translate(0,0) rotate(0) scale(1); opacity:1;}}
@keyframes flyFromTopRight{0%{transform:translate(180px,-180px) rotate(20deg) scale(.4); opacity:0;} 100%{transform:translate(0,0) rotate(0) scale(1); opacity:1;}}
@keyframes flyFromBottomRight{0%{transform:translate(150px,150px) rotate(-30deg) scale(.4); opacity:0;} 100%{transform:translate(0,0) rotate(0) scale(1); opacity:1;}}
@keyframes fadeInTag{to{opacity:1;}}
@keyframes fillProgress{to{transform:translateX(0);}}
@keyframes pulseGlow{0%,100%{transform:scale(.9); opacity:.6;} 50%{transform:scale(1.2); opacity:1;}}
@keyframes carLaunch{
  0%,78%{transform:translateX(0) scale(1); filter:blur(0); opacity:1;}
  83%{transform:translateX(-30px) scale(.98); filter:blur(0); opacity:1;}
  100%{transform:translateX(120vw) scale(1.1); filter:blur(4px); opacity:0;}
}

#screen-login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  position:relative;
  overflow:hidden;
}
.login-glow{
  position:absolute; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(600px 400px at 20% 20%, rgba(75,46,146,.08), transparent 60%),
    radial-gradient(700px 500px at 85% 80%, rgba(42,169,224,.10), transparent 60%);
}
.login-card{
  position:relative; z-index:1;
  width:100%; max-width:428px;
  background:var(--surface);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);
  padding:44px 40px 36px;
  border:1px solid var(--border-soft);
}
.login-logo{display:flex; justify-content:center; margin-bottom:8px;}
.login-logo img{height:52px; width:auto;}
.login-tagline{
  text-align:center; color:var(--muted); font-size:13.5px; letter-spacing:.02em;
  margin-bottom:30px; margin-top:2px;
}
.login-title{text-align:center; font-size:20px; font-weight:700; margin-bottom:4px;}
.field{margin-bottom:16px;}
.field label{
  display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:6px;
  text-transform:uppercase; letter-spacing:.05em;
}
.field input, .field select, .field textarea{
  width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm);
  font-size:14.5px; font-family:var(--font-body); color:var(--ink); background:var(--surface-2);
  transition:border-color .15s, background .15s;
}
.field input:focus, .field select:focus, .field textarea:focus{
  border-color:var(--blue); background:#fff;
}
.field textarea{resize:vertical; min-height:76px;}

.pass-field-wrap{position:relative; display:flex; align-items:center;}
.pass-field-wrap input{padding-right:46px;}
.pass-toggle-btn{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  width:34px; height:34px; border:none; background:transparent; border-radius:9px;
  display:flex; align-items:center; justify-content:center; color:var(--muted-2);
  cursor:pointer; transition:color .15s, background .15s;
}
.pass-toggle-btn:hover{background:var(--surface-2); color:var(--purple);}
.pass-toggle-btn:focus-visible{color:var(--blue);}
.pass-toggle-btn svg{display:block;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:none; border-radius:12px; font-weight:600; font-size:14.5px;
  padding:12px 20px; transition:transform .12s, box-shadow .12s, opacity .12s, background .15s;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--grad-brand); color:#fff; box-shadow:0 6px 18px rgba(59,31,122,.28);}
.btn-primary:hover{box-shadow:0 8px 22px rgba(59,31,122,.36); filter:brightness(1.04);}
.btn-block{width:100%;}
.btn-ghost{background:transparent; color:var(--purple); border:1.5px solid var(--border);}
.btn-ghost:hover{border-color:var(--purple-soft); background:var(--surface-2);}
.btn-secondary{background:var(--surface-2); color:var(--ink); border:1.5px solid var(--border);}
.btn-secondary:hover{background:#EEF2F7;}
.btn-danger-ghost{background:transparent; color:var(--danger); border:1.5px solid #F3D2D6;}
.btn-danger-ghost:hover{background:var(--danger-bg);}
.btn-sm{padding:8px 14px; font-size:13px; border-radius:9px;}
.btn-icon{padding:9px; border-radius:9px;}
.login-error{
  background:var(--danger-bg); color:#B4232F; font-size:13px; padding:10px 14px;
  border-radius:9px; margin-bottom:14px; display:flex; gap:8px; align-items:center;
}
.login-hint{
  text-align:center; margin-top:22px; font-size:12px; color:var(--muted-2);
  padding-top:18px; border-top:1px solid var(--border-soft);
}
.field-hint{font-size:11px; color:var(--muted-2); margin-top:5px; line-height:1.4;}
.login-forgot{text-align:right; margin-top:8px;}
.login-forgot a{font-size:12.5px; color:var(--purple); text-decoration:none; font-weight:600;}
.login-forgot a:hover{text-decoration:underline;}

/* ============ APP SHELL ============ */
#app-shell{min-height:100vh; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:40;
  background:rgba(255,255,255,.85); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-soft);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 28px; height:68px;
}
.topbar-left{display:flex; align-items:center; gap:18px; min-width:0;}
.topbar-logo{display:flex; align-items:center; gap:10px; cursor:pointer; flex-shrink:0;}
.topbar-logo img{height:30px; width:auto;}
.crumb{display:flex; align-items:center; gap:7px; font-size:13.5px; color:var(--muted); min-width:0; overflow:hidden;}
.crumb-item{white-space:nowrap; cursor:pointer; transition:color .12s;}
.crumb-item:hover{color:var(--purple);}
.crumb-item.current{color:var(--ink); font-weight:600; cursor:default; overflow:hidden; text-overflow:ellipsis;}
.crumb-sep{color:var(--muted-2); flex-shrink:0;}
.topbar-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.user-pill{
  display:flex; align-items:center; gap:9px; background:var(--surface-2); border:1px solid var(--border);
  padding:6px 12px 6px 6px; border-radius:100px; font-size:13px; cursor:pointer; transition:background .15s;
}
.user-pill:hover{background:#EEF2F7;}
.user-avatar{
  width:28px; height:28px; border-radius:50%; background:var(--grad-brand); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;
}
.user-pill-name{font-weight:600; color:var(--ink);}
.user-pill-role{color:var(--muted-2); font-size:11px;}

.main-view{flex:1; padding:32px 28px 80px; max-width:1360px; margin:0 auto; width:100%;}
.view-header{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:26px; flex-wrap:wrap;}
.view-eyebrow{font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--blue-deep); margin-bottom:6px;}
.view-title{font-size:28px; font-weight:800;}
.section-subtitle{font-size:14px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:0 0 14px;}
.view-sub{color:var(--muted); font-size:14px; margin-top:5px;}
.view-actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}

.search-box{
  display:flex; align-items:center; gap:9px; background:var(--surface); border:1.5px solid var(--border);
  border-radius:11px; padding:9px 14px; min-width:220px;
}
.search-box input{border:none; outline:none; background:transparent; font-size:13.5px; width:100%; font-family:var(--font-body);}
.search-box svg{flex-shrink:0; color:var(--muted-2); width:16px; height:16px;}

/* ============ GRID / CARDS ============ */
.grid{display:grid; gap:18px;}
.grid-clients{grid-template-columns:repeat(3, 1fr);}
@media (max-width:900px){ .grid-clients{grid-template-columns:repeat(auto-fill, minmax(280px,1fr));} }
.grid-obras{grid-template-columns:repeat(auto-fill, minmax(320px,1fr));}

.card{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm); transition:transform .16s cubic-bezier(.2,.7,.3,1), box-shadow .16s;
  cursor:pointer; overflow:hidden; position:relative;
}
.card:hover{transform:translateY(-3px); box-shadow:var(--shadow-md);}
.card:active{transform:translateY(-1px);}

.client-card-v3{padding:0; overflow:hidden; position:relative; border:1.5px solid var(--purple-soft); box-shadow:0 2px 10px rgba(75,46,146,.08); background:linear-gradient(180deg, #F9F7FE 74px, #FFFFFF 220px);}
.client-card-v3:hover{border-color:var(--purple); box-shadow:0 8px 24px rgba(75,46,146,.16);}
.ccv3-banner{height:74px; background:var(--grad-brand); position:relative; overflow:hidden;}
.ccv3-banner-pattern{
  position:absolute; inset:0; opacity:.18; pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px);
  background-size:16px 16px;
  mask-image:radial-gradient(circle at 85% 0%, #000 0%, transparent 75%);
}
.ccv3-menu{
  position:absolute; top:12px; right:12px; z-index:3;
  width:28px; height:28px; border-radius:8px; border:none; background:rgba(255,255,255,.16); color:#fff;
  display:flex; align-items:center; justify-content:center; transition:background .12s;
}
.ccv3-menu:hover{background:rgba(255,255,255,.32);}
.ccv3-menu svg{width:16px; height:16px;}
.ccv3-banner-name{
  position:absolute; left:96px; right:44px; bottom:12px; z-index:2;
  font-family:var(--font-display); font-weight:800; font-size:16.5px; color:#fff; letter-spacing:-.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 3px rgba(0,0,0,.15);
}
.ccv3-body{padding:0 24px 24px; position:relative;}
.ccv3-badge{
  width:66px; height:66px; border-radius:18px; margin-top:-33px; margin-bottom:16px; position:relative; z-index:2;
  background:linear-gradient(145deg,#fff,#F1ECFB); border:3px solid var(--surface); box-shadow:var(--shadow-md);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:23px;
  color:var(--purple-deep);
}
.ccv3-cta{
  display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--purple);
  margin-top:16px; padding-top:14px; border-top:1px solid var(--border-soft);
}
.ccv3-cta svg{width:14px; height:14px;}
.ccv3-stats{
  display:grid; grid-template-columns:repeat(4,1fr); margin-top:16px; padding-top:14px; border-top:1px solid var(--border-soft);
}
.ccv3-stat{text-align:center; padding:0 6px; border-left:1px solid var(--border-soft);}
.ccv3-stat:first-child{border-left:none;}
.ccv3-stat b{display:block; font-family:var(--font-display); font-size:20px; font-weight:800; color:var(--ink);}
.ccv3-stat span{display:block; font-size:10px; color:var(--muted-2); text-transform:uppercase; letter-spacing:.02em; margin-top:3px; white-space:nowrap;}
.ccv3-empty{font-size:12px; color:var(--muted-2); margin-top:16px; padding-top:14px; border-top:1px solid var(--border-soft); font-style:italic;}
.client-card-name{font-size:17px; font-weight:800; letter-spacing:-.01em; margin-bottom:8px; color:var(--ink);}
.client-card-meta-row{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); line-height:1.6;}
  width:28px; height:28px; border-radius:8px; border:none; background:transparent; color:var(--muted-2);
  display:flex; align-items:center; justify-content:center; transition:background .12s, color .12s; flex-shrink:0;
}
.obra-menu-btn:hover{background:var(--surface-2); color:var(--ink);}
.obra-menu-btn svg{width:16px; height:16px;}
.client-card-meta-row{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); line-height:1.6;}
.client-card-meta-row svg{width:13px; height:13px; flex-shrink:0; color:var(--muted-2); display:inline-block;}
.client-card-foot{display:flex; align-items:center; gap:16px; padding-top:16px; border-top:1px solid var(--border-soft);}
.client-card-stats-v2{flex:1; min-width:0; display:flex; flex-direction:column; gap:9px;}
.client-card-count{font-size:13px; color:var(--muted);}
.client-card-count b{color:var(--ink); font-family:var(--font-display); font-size:15px;}

.status-dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0;}
.status-dot.ok{background:var(--success);}
.status-dot.warn{background:var(--warning);}
.status-dot.late{background:var(--danger);}
.status-dot.done{background:var(--purple);}
.status-dot.none{background:var(--muted-2);}
.status-dot.noprazo{background:var(--muted-2);}
.status-pill{
  display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:5px 10px 5px 8px;
  border-radius:100px; text-transform:uppercase; letter-spacing:.03em;
}
.status-pill.ok{background:var(--success-bg); color:var(--success);}
.status-pill.warn{background:var(--warning-bg); color:var(--warning);}
.status-pill.late{background:var(--danger-bg); color:var(--danger);}
.prio-pill, .proc-pill{
  appearance:none; -webkit-appearance:none; border:none; border-radius:100px; font-size:11.5px; font-weight:700;
  padding:7px 26px 7px 12px; cursor:pointer; text-transform:uppercase; letter-spacing:.03em;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="%236B7280" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg>');
  background-repeat:no-repeat; background-position:right 8px center;
}
.proc-pill{background-color:var(--surface-2); color:var(--ink);}
.status-pill.done{background:#F1ECFB; color:var(--purple);}
.status-pill.none{background:var(--surface-2); color:var(--muted-2);}
.status-pill.noprazo{background:var(--surface-2); color:var(--muted-2);}

/* Obra Card with cable progress */
.obra-card{padding:22px 22px 20px;}
.obra-card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:4px;}
.obra-card-type{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--blue-deep); margin-bottom:5px;}
.obra-card-name{font-size:16.5px; font-weight:700; margin-bottom:14px; line-height:1.3;}
.obra-progress-row{display:flex; align-items:center; gap:12px; margin:14px 0 6px;}
.obra-progress-track{
  flex:1; height:8px; background:var(--surface-2); border-radius:100px; overflow:hidden; position:relative;
  border:1px solid var(--border-soft);
}
.obra-progress-fill{
  height:100%; border-radius:100px; background:var(--grad-brand); position:relative;
}
.obra-progress-fill::after{
  content:''; position:absolute; right:0; top:0; bottom:0; width:10px; border-radius:50%;
  background:radial-gradient(circle, #fff 0%, transparent 70%); opacity:.5;
}
.obra-progress-pct{font-family:var(--font-mono); font-weight:600; font-size:13.5px; min-width:38px; text-align:right;}
.obra-card-meta{display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding-top:14px; border-top:1px solid var(--border-soft); font-size:12.5px; color:var(--muted);}
.obra-card-deadline{display:flex; align-items:center; gap:6px;}
.obra-card-deadline svg{width:14px; height:14px; flex-shrink:0; display:inline-block;}
.obra-card-deadline b{color:var(--ink); font-family:var(--font-mono); font-weight:600;}
.obra-card-daysleft{font-weight:600; color:var(--muted);}
.obra-card-daysleft.is-warn{color:var(--warning);}
.obra-card-daysleft.is-late{color:var(--danger);}

/* Portal do cliente — hero de boas-vindas */
.client-hero{
  background:var(--grad-brand); border-radius:var(--radius-lg); padding:36px 38px 30px; color:#fff;
  margin-bottom:30px; position:relative; overflow:hidden;
}
.client-hero::before{
  content:''; position:absolute; inset:0; opacity:.12; pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);
  background-size:34px 34px;
  mask-image:radial-gradient(circle at 88% 12%, #000 0%, transparent 65%);
}
.client-hero-top{position:relative;}
.client-hero-eyebrow{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; opacity:.85; margin-bottom:8px;}
.client-hero-title{font-size:27px; font-weight:800; margin-bottom:8px; letter-spacing:-.01em; color:#fff;}
.client-hero-sub{font-size:14px; opacity:.88; max-width:480px; line-height:1.5;}
.client-hero-stats{position:relative; display:flex; gap:12px; margin-top:26px; flex-wrap:wrap;}
.client-stat{
  background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.2); border-radius:14px;
  padding:14px 20px; flex:1; min-width:130px; backdrop-filter:none;
}
.client-stat.is-alert{background:rgba(220,53,69,.25); border-color:rgba(255,255,255,.3);}
.cs-num{font-size:24px; font-weight:800; font-family:var(--font-mono); line-height:1.1;}
.cs-lbl{font-size:12px; opacity:.85; margin-top:3px;}

/* Portal do cliente — cards de serviço */
.client-obra-list{display:flex; flex-direction:column; gap:12px;}
.client-obra-card{
  display:flex; align-items:center; gap:20px; background:var(--surface); border:1.5px solid var(--border-soft);
  border-left:5px solid var(--blue); border-radius:var(--radius-md); padding:16px 20px 16px 18px; cursor:pointer;
  transition:border-color .12s, box-shadow .12s;
}
.client-obra-card:hover{border-color:var(--purple-soft); border-left-color:var(--blue); box-shadow:var(--shadow-md);}
.client-obra-card.status-ok{border-left-color:var(--blue);}
.client-obra-card.status-warn{border-left-color:var(--warning);}
.client-obra-card.status-late{border-left-color:var(--danger);}
.client-obra-card.status-done{border-left-color:var(--purple); background:var(--surface-2);}
.coc-ring-wrap{
  position:relative; width:60px; height:60px; flex-shrink:0; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
}
.coc-ring-wrap.status-ok{background:var(--blue-soft, #E4F4FC);}
.coc-ring-wrap.status-warn{background:#FDF3E2;}
.coc-ring-wrap.status-late{background:var(--danger-bg);}
.coc-ring-wrap.status-done{background:#F1ECFB;}
.coc-body{flex:1; min-width:0;}
.coc-top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:5px;}
.coc-type{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--purple);}
.coc-name{font-size:16.5px; font-weight:700; color:var(--ink); margin-bottom:9px;}
.coc-meta{display:flex; align-items:center; gap:16px; font-size:12.5px; color:var(--muted); flex-wrap:wrap;}
.coc-meta svg{width:13px; height:13px; flex-shrink:0; vertical-align:-2px; display:inline-block;}
.coc-meta b{color:var(--ink); font-family:var(--font-mono); font-weight:600;}
.coc-days{font-weight:600;}
.coc-days.is-warn{color:var(--warning);}
.coc-days.is-late{color:var(--danger);}
.coc-chevron{color:var(--muted-2); flex-shrink:0;}
.coc-chevron svg{width:18px; height:18px;}

.empty-state{
  grid-column:1/-1; text-align:center; padding:70px 20px; color:var(--muted);
  background:var(--surface); border:1.5px dashed var(--border); border-radius:var(--radius-md);
}
.empty-state svg{margin-bottom:14px; opacity:.5;}
.empty-state h3{font-size:16px; color:var(--ink); margin-bottom:6px;}
.empty-state p{font-size:13.5px; max-width:360px; margin:0 auto;}

/* ============ PORTAL ACCESS CARD (cliente) ============ */
.portal-access-card{
  display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  background:linear-gradient(120deg, #F8F6FF 0%, #EAF6FB 100%); border:1px solid #E3DCF9; border-radius:var(--radius-md);
  padding:18px 22px; margin-bottom:22px;
}
.portal-access-card.portal-access-empty{background:var(--surface-2); border-style:dashed; border-color:var(--border);}
.portal-access-info{display:flex; align-items:center; gap:14px;}
.portal-access-icon{
  width:42px; height:42px; border-radius:12px; background:var(--grad-brand); color:#fff; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.portal-access-icon svg{width:19px; height:19px;}
.portal-access-icon.muted{background:var(--surface); color:var(--muted-2); border:1.5px solid var(--border);}
.portal-access-title{font-size:13.5px; font-weight:700; color:var(--ink); margin-bottom:3px;}
.portal-access-sub{font-size:12px; color:var(--muted);}
.portal-access-creds{display:flex; gap:18px; font-size:12.5px; color:var(--muted); flex-wrap:wrap;}
.portal-access-creds b{color:var(--purple); font-weight:700;}
.portal-access-creds b.mono{font-family:var(--font-mono);}
.portal-access-actions{display:flex; gap:8px; flex-wrap:wrap;}

/* ============ ADD CARD (dashed CTA tile) ============ */
.add-card{
  border:1.5px dashed var(--border); background:transparent; border-radius:var(--radius-md);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  padding:22px; min-height:150px; color:var(--muted); transition:border-color .15s, background .15s, color .15s;
}
.add-card:hover{border-color:var(--purple-soft); background:#FAF9FF; color:var(--purple);}
.add-card-icon{
  width:38px; height:38px; border-radius:11px; background:var(--surface-2); display:flex; align-items:center; justify-content:center;
  transition:background .15s;
}
.add-card:hover .add-card-icon{background:#F1ECFB;}
.add-card span{font-size:13px; font-weight:600;}

/* ============ OBRA DETAIL ============ */
.obra-header{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-lg);
  padding:26px 28px; margin-bottom:20px; box-shadow:var(--shadow-sm);
}
.obra-header-top{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:22px;}
.obra-header-titles .obra-card-type{margin-bottom:6px;}
.obra-header-titles h1{font-size:25px; font-weight:800; margin-bottom:6px;}
.obra-header-titles .obra-client-name{color:var(--muted); font-size:14px;}
.obra-header-actions{display:flex; gap:9px; flex-wrap:wrap;}

/* Cable-route stepper (signature element) */
.cable-stepper{position:relative; padding:6px 6px 0;}
.cable-track-wrap{position:relative; padding:0 6px;}
.cable-line-bg{
  position:absolute; top:19px; left:24px; right:24px; height:4px; background:var(--border); border-radius:4px; z-index:0;
}
.cable-line-fill{
  position:absolute; top:19px; left:24px; height:4px; background:var(--grad-brand); border-radius:4px; z-index:1;
}
.cable-steps{display:flex; justify-content:space-between; position:relative; z-index:2;}
.cable-step{display:flex; flex-direction:column; align-items:center; gap:9px; flex:1; min-width:0; padding:0 3px;}
.cable-node{
  width:40px; height:40px; border-radius:11px; background:#fff; border:2.5px solid var(--border);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .25s;
  box-shadow:0 2px 6px rgba(24,18,51,.05);
}
.cable-node svg{width:17px; height:17px;}
.cable-step.is-done .cable-node{border-color:var(--etapa-color, var(--purple)); background:var(--etapa-color, var(--purple)); color:#fff;}
.cable-step.is-current .cable-node{border-color:var(--blue); background:#fff; color:var(--blue-deep); box-shadow:0 0 0 5px rgba(42,169,224,.15);}
.cable-step.is-pending .cable-node{color:var(--muted-2);}
.cable-step-label{font-size:11.5px; font-weight:600; text-align:center; color:var(--muted); line-height:1.25; max-width:88px;}
.cable-step.is-done .cable-step-label{color:var(--ink);}
.cable-step.is-current .cable-step-label{color:var(--blue-deep);}
.cable-step-date{font-size:10px; color:var(--muted-2); font-family:var(--font-mono);}

.obra-progress-hero{display:flex; align-items:center; gap:22px; margin-top:20px; padding-top:20px; border-top:1px solid var(--border-soft);}
.progress-ring-mini{position:relative; width:64px; height:64px; flex-shrink:0;}
.progress-ring-mini svg{transform:rotate(-90deg);}
.progress-ring-mini-label{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-weight:700; font-size:14px;
}
.progress-hero-info{flex:1;}
.progress-hero-info .label{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; font-weight:700; margin-bottom:3px;}
.progress-hero-info .val{font-size:15px; font-weight:600;}
.progress-hero-info .val-sub{font-size:12.5px; color:var(--muted); margin-top:4px;}
.progress-hero-info .val-sub.is-warn{color:var(--danger); font-weight:600;}

/* Tabs */
.tabs{display:flex; gap:4px; border-bottom:1.5px solid var(--border-soft); margin-bottom:24px; overflow-x:auto;}
.tab-btn{
  padding:12px 18px; background:transparent; border:none; font-size:14px; font-weight:600; color:var(--muted);
  border-bottom:2.5px solid transparent; margin-bottom:-1.5px; white-space:nowrap; transition:color .15s, border-color .15s;
  display:flex; align-items:center; gap:7px;
}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--purple); border-color:var(--purple);}
.tab-btn.tab-btn-cal{color:var(--purple);}
.tab-btn.tab-btn-cal svg{width:15px; height:15px;}
.tab-btn.tab-btn-cal:hover{border-color:var(--purple-soft);}
.tab-badge{background:var(--surface-2); color:var(--muted); font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:100px;}
.tab-btn.active .tab-badge{background:#F1ECFB; color:var(--purple);}

.tab-panel{}
@keyframes fadeUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* Info grid (Visão Geral) */
.info-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:18px;}
.info-panel{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:22px; box-shadow:var(--shadow-sm);}
.info-panel-head{display:flex; align-items:center; gap:10px; margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid var(--border-soft);}
.info-panel-icon{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.info-panel-icon.contratante{background:#EAF6FB; color:var(--blue-deep);}
.info-panel-icon.executora{background:#F1ECFB; color:var(--purple);}
.info-panel-head h3{font-size:14.5px; font-weight:700;}
.info-row{display:flex; justify-content:space-between; gap:14px; padding:9px 0; font-size:13.5px; border-bottom:1px solid var(--border-soft);}
.info-row:last-child{border-bottom:none;}
.info-row .k{color:var(--muted); flex-shrink:0;}
.info-row .v{font-weight:600; text-align:right;}
.info-panel-full{grid-column:1/-1;}
.escopo-tags{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;}
.escopo-tag{background:var(--surface-2); border:1px solid var(--border); padding:8px 14px; border-radius:10px; font-size:13px;}
.escopo-editable{
  width:100%; min-height:90px; border:1.5px solid var(--border); background:var(--surface-2); border-radius:11px;
  padding:12px 14px; font-family:var(--font-body); font-size:13.75px; color:var(--ink); resize:vertical; line-height:1.55;
  transition:border-color .15s, background .15s;
}
.escopo-editable::placeholder{color:var(--muted-2);}
.escopo-editable:hover{border-color:var(--purple-soft);}
.escopo-editable:focus{background:#fff; border-color:var(--blue); outline:none;}
.escopo-tag b{font-family:var(--font-mono); color:var(--purple);}

/* Timeline feed (updates / comments) */
.feed-composer{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:18px; margin-bottom:20px; box-shadow:var(--shadow-sm);}
.feed-composer-row{display:flex; gap:12px; align-items:flex-start;}
.feed-composer textarea{flex:1;}
.feed-composer-footer{display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:12px; flex-wrap:wrap;}
.feed-composer-opts{display:flex; gap:8px; align-items:center;}
.pct-input-wrap{display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1.5px solid var(--border); border-radius:9px; padding:6px 10px;}
.pct-input-wrap input{width:52px; border:none; background:transparent; font-family:var(--font-mono); font-weight:600; text-align:center; outline:none;}
.chip-select{display:flex; gap:6px;}
.chip-opt{padding:7px 13px; border-radius:100px; font-size:12.5px; font-weight:600; border:1.5px solid var(--border); background:var(--surface-2); color:var(--muted); transition:all .15s;}
.chip-opt.active{background:#F1ECFB; border-color:var(--purple-soft); color:var(--purple);}
.chip-opt.active[data-tag="atencao"]{background:var(--warning-bg); border-color:#F0D19E; color:var(--warning);}
.chip-opt.active[data-tag="sugestao"]{background:#EAF6FB; border-color:#BEE4F5; color:var(--blue-deep);}
.chip-opt.active[data-tag="info"]{background:var(--surface-2); border-color:var(--border); color:var(--ink);}

.feed-days-wrap{padding-top:6px; padding-bottom:6px;}
.feed-day{border-bottom:1px solid var(--border-soft);}
.feed-day:last-of-type{border-bottom:none;}
.feed-day-summary{
  list-style:none; display:flex; align-items:center; gap:10px; padding:14px 4px; cursor:pointer; user-select:none;
}
.feed-day-summary::-webkit-details-marker{display:none;}
.feed-day-caret{display:flex; color:var(--muted-2); transition:transform .18s; flex-shrink:0;}
.feed-day-caret svg{width:13px; height:13px;}
.feed-day[open] .feed-day-caret{transform:rotate(180deg);}
.feed-day-date{font-size:13.5px; font-weight:700; color:var(--ink);}
.feed-day-count{font-size:11.5px; color:var(--muted-2); background:var(--surface-2); padding:3px 9px; border-radius:100px; margin-left:auto;}
.feed-day-body{padding:0 4px 4px 27px;}
.feed-item{
  display:flex; gap:11px; padding:12px 14px; border-radius:12px; background:var(--surface-2); margin-bottom:8px;
}
.feed-item:last-child{margin-bottom:0;}
.feed-avatar{
  width:30px; height:30px; border-radius:50%; background:var(--grad-brand); color:#fff; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;
}
.feed-body{flex:1; min-width:0;}
.feed-meta{display:flex; align-items:center; gap:8px; margin-bottom:3px; flex-wrap:wrap;}
.feed-author{font-weight:700; font-size:13px;}
.feed-date{color:var(--muted-2); font-size:12px; font-family:var(--font-mono);}
.feed-text{font-size:13.25px; color:var(--ink); line-height:1.5; white-space:pre-wrap;}
.feed-pct-badge{
  display:inline-flex; align-items:center; gap:5px; background:#fff; font-family:var(--font-mono);
  font-size:11px; font-weight:700; padding:3px 9px; border-radius:100px; margin-top:6px; color:var(--purple);
  border:1px solid var(--border-soft);
}
.feed-pct-badge svg{width:11px; height:11px; flex-shrink:0;}
.feed-item.tag-atencao{border-left:3px solid var(--warning); background:var(--warning-bg);}
.feed-item.tag-sugestao{border-left:3px solid var(--blue); background:#EAF6FB;}
.feed-item.tag-concluido{border-left:3px solid var(--success); background:var(--success-bg);}
.feed-item.tag-progresso{border-left:3px solid var(--purple-soft); background:#F5F2FC;}
.feed-body-full{flex:1; min-width:0;}
.feed-item-top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px;}
.feed-item-etapa{font-size:12.5px; font-weight:700; color:var(--purple);}
.feed-item-date{font-size:11px; color:var(--muted-2); font-family:var(--font-mono); flex-shrink:0;}
.feed-tag-label{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:2px 8px; border-radius:100px; flex-shrink:0;}
.feed-tag-label.atencao{background:#fff; color:var(--warning);}
.feed-tag-label.sugestao{background:#fff; color:var(--blue-deep);}
.feed-tag-label.info{background:#fff; color:var(--muted);}

.panel-card{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:22px; box-shadow:var(--shadow-sm); margin-bottom:18px;}
.panel-card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.panel-card-head h3{font-size:15px; font-weight:700;}

/* Etapas list (cronograma tab) */
.etapa-row{
  display:flex; flex-direction:column; gap:10px; padding:16px 4px; border-bottom:1px solid var(--border-soft);
}
.etapa-row:last-child{border-bottom:none;}
.etapa-row-top{display:flex; align-items:center; gap:12px;}
.etapa-row-bottom{display:flex; align-items:center; gap:16px; padding-left:42px; flex-wrap:wrap;}
.etapa-check{
  width:30px; height:30px; border-radius:9px; border:2px solid var(--border); flex-shrink:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:all .15s; background:#fff;
}
.etapa-check.checked{background:var(--success); border-color:var(--success); color:#fff;}
.etapa-check.current{border-color:var(--blue);}
.etapa-name-row{display:flex; align-items:center; gap:6px; flex:1; min-width:0;}
.etapa-num{font-weight:600; font-size:13.75px; color:var(--muted-2); flex-shrink:0;}
.etapa-name-input{
  border:1.5px solid transparent; background:transparent; font-weight:600; font-size:13.75px; color:var(--ink);
  padding:4px 8px; border-radius:7px; font-family:var(--font-body); width:100%; max-width:360px; transition:all .15s;
}
.etapa-name-input:hover{background:var(--surface-2);}
.etapa-name-input:focus{background:#fff; border-color:var(--blue); outline:none;}
.etapa-row-actions{display:flex; gap:4px; flex-shrink:0; margin-left:auto;}
.etapa-mini-btn{
  width:28px; height:28px; border-radius:7px; border:1.5px solid var(--border); background:#fff; color:var(--muted);
  display:flex; align-items:center; justify-content:center; transition:all .12s;
}
.etapa-mini-btn svg{width:13px; height:13px;}
.etapa-mini-btn:hover:not(:disabled){background:var(--surface-2); color:var(--ink); border-color:var(--purple-soft);}
.etapa-mini-btn:disabled{opacity:.3; cursor:default;}
.etapa-mini-btn.danger:hover{background:var(--danger-bg); color:var(--danger); border-color:#F3D2D6;}
.tcal-nav-btn{
  width:28px; height:28px; border-radius:7px; border:1.5px solid var(--border); background:#fff; color:var(--muted);
  display:flex; align-items:center; justify-content:center; transition:all .12s; cursor:pointer;
}
.tcal-nav-btn svg{width:13px; height:13px;}
.tcal-nav-btn:hover{background:var(--surface-2); color:var(--ink); border-color:var(--purple-soft);}
.etapa-pct-wrap{width:120px; flex-shrink:0;}
.etapa-track{height:6px; background:var(--surface-2); border-radius:100px; overflow:hidden; border:1px solid var(--border-soft);}
.etapa-fill{height:100%; background:var(--grad-brand); border-radius:100px;}
.etapa-dates{font-size:12px; color:var(--muted-2); font-family:var(--font-mono); display:flex; align-items:center; gap:4px; flex-wrap:wrap;}
.etapa-dates input[type="date"]{
  border:1.5px solid transparent; background:transparent; font-family:inherit; font-size:inherit; color:inherit;
  width:118px; padding:3px 4px; border-radius:6px; transition:background .12s, border-color .12s;
}
.etapa-dates input[type="date"]:hover{background:var(--surface-2);}
.etapa-dates input[type="date"]:focus{background:#fff; border-color:var(--blue); outline:none;}
.etapa-dates .real-date{color:var(--success);}
.etapa-mark-real{cursor:pointer; text-decoration:underline; text-decoration-style:dotted; white-space:nowrap;}
.etapa-slider-group{display:flex; align-items:center; gap:10px; margin-left:auto;}
.etapa-slider-group input[type="range"]{width:120px; accent-color:var(--purple);}
.etapa-pct-num{font-size:12.5px; font-family:var(--font-mono); font-weight:700; color:var(--purple); min-width:34px; text-align:right;}

/* Etapas agrupando tarefas (novo modelo) */
.etapa-group{border:1.5px solid var(--border-soft); border-radius:var(--radius-md); padding:16px 18px; margin-bottom:16px; background:var(--surface-2);}
.etapa-group.is-collapsed{padding-bottom:14px;}
.etapa-group.is-collapsed .etapa-group-track{margin-bottom:0;}
.etapa-group-head{display:flex; align-items:center; gap:10px;}
.etapa-collapse-btn{
  width:24px; height:24px; border-radius:6px; border:none; background:transparent; color:var(--muted); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; transition:transform .18s, background .12s; cursor:pointer;
}
.etapa-collapse-btn svg{width:14px; height:14px;}
.etapa-collapse-btn:hover{background:var(--border-soft); color:var(--ink);}
.etapa-group:not(.is-collapsed) .etapa-collapse-btn{transform:rotate(90deg);}
.etapa-collapsed-count{font-size:11.5px; color:var(--muted-2); font-weight:500; margin-left:10px;}
.etapa-color-swatch{width:22px; height:22px; border-radius:7px; border:2px solid #fff; box-shadow:0 0 0 1.5px var(--border); flex-shrink:0; cursor:pointer; transition:transform .12s;}
.etapa-color-swatch:hover{transform:scale(1.1);}
.etapa-title-input{font-size:14.5px;}
.etapa-group-pct{font-family:var(--font-mono); font-weight:700; font-size:14px; flex-shrink:0; margin-left:8px;}
.etapa-group-track{height:6px; background:var(--border-soft); border-radius:100px; overflow:hidden; margin:10px 0 4px;}
.etapa-group-fill{height:100%; border-radius:100px;}
.tarefas-list{margin-top:6px;}
.tarefa-row{display:flex; align-items:center; gap:10px; padding:10px 4px; border-top:1px dashed var(--border);}
.tarefa-name-input{max-width:220px; background:#fff;}
.tarefa-dates-btn{
  display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); background:#fff;
  border:1.5px solid var(--border); border-radius:8px; padding:6px 10px; flex-shrink:0; transition:all .12s;
}
.tarefa-dates-btn svg{width:13px; height:13px;}
.tarefa-dates-btn:hover{border-color:var(--purple-soft); color:var(--ink);}
.tarefa-empty{font-size:12.5px; color:var(--muted-2); padding:10px 4px;}
.foto-list{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:14px;}
.foto-item{position:relative; border:1px solid var(--border-soft); border-radius:12px; overflow:hidden; background:var(--surface-2);}
.foto-thumb{width:100%; height:120px; object-fit:cover; display:block; cursor:pointer;}
.foto-meta{padding:8px 10px;}
.foto-legenda{font-size:12px; font-weight:600; color:var(--ink); margin-bottom:2px;}
.foto-legenda-input{
  width:100%; border:none; background:transparent; font-size:12px; font-weight:600; color:var(--ink);
  padding:0 0 3px; margin-bottom:2px; font-family:var(--font-body);
}
.foto-legenda-input::placeholder{color:var(--muted-2); font-weight:400;}
.foto-legenda-input:focus{outline:none; border-bottom:1.5px solid var(--purple-soft);}
.foto-autor{font-size:11px; color:var(--muted-2);}
.foto-remove{
  position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:8px; border:none;
  background:rgba(24,18,51,.55); color:#fff; display:flex; align-items:center; justify-content:center;
}
.foto-remove svg{width:14px; height:14px;}
.foto-remove:hover{background:var(--danger);}
.foto-empty{font-size:13px; color:var(--muted-2); text-align:center; padding:30px 0;}

/* Seletor de cor */
.color-swatch-grid{display:flex; flex-wrap:wrap; gap:10px;}
.color-swatch-opt{width:34px; height:34px; border-radius:9px; border:2px solid #fff; box-shadow:0 0 0 1.5px var(--border); cursor:pointer; transition:transform .12s;}
.color-swatch-opt:hover{transform:scale(1.12);}
.color-swatch-opt.active{box-shadow:0 0 0 2.5px var(--ink);}
.color-picker-free{display:flex; align-items:center; gap:10px;}

}

/* Mini calendário (datas de tarefa / calendário geral da obra) */
.tcal-nav{display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:12px;}
.tcal-month-label{font-weight:700; font-size:14px; text-transform:capitalize; min-width:150px; text-align:center;}

.tcal-day{

.tcal-mini-dot{position:absolute; bottom:5px; width:5px; height:5px; border-radius:50%;}

/* ============ MODAL ============ */
.modal-overlay{

}
.modal{

}
.modal.modal-wide{max-width:720px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:22px 24px 18px; border-bottom:1px solid var(--border-soft); position:sticky; top:0; background:#fff; z-index:2;}
.modal-head h2{font-size:18px; font-weight:800;}
.modal-close{width:32px; height:32px; border-radius:9px; border:none; background:var(--surface-2); color:var(--muted); display:flex; align-items:center; justify-content:center; transition:background .12s;}

.form-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.field-full{grid-column:1/-1;}

/* Etapas builder in modal */
.etapa-builder-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.etapa-builder-row input{flex:1;}
.etapa-builder-remove{width:30px; height:30px; border-radius:8px; border:1.5px solid var(--border); background:#fff; color:var(--muted); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.etapa-builder-remove svg{width:14px; height:14px;}
.etapa-builder-remove:hover{border-color:var(--danger); color:var(--danger); background:var(--danger-bg);}

/* Botão de ícone (dispara o seletor) */
.etapa-icon-btn{
  width:30px; height:30px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface-2);
  color:var(--purple); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .15s;
}
.etapa-icon-btn svg{width:15px; height:15px;}
.etapa-icon-btn:hover{border-color:var(--purple-soft); background:#F1ECFB;}

/* Seletor de ícones — grade por categoria com busca */
.icon-picker-group{margin-bottom:20px;}
.icon-picker-group:last-child{margin-bottom:0;}
.icon-picker-group-title{
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--blue-deep);
  margin-bottom:10px;
}
.icon-picker-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:8px;}
.icon-picker-item{
  display:flex; flex-direction:column; align-items:center; gap:7px; padding:12px 6px; border-radius:11px;
  border:1.5px solid var(--border); background:#fff; transition:all .15s; text-align:center;
}
.icon-picker-item:hover{border-color:var(--purple-soft); background:#FAF9FF; transform:translateY(-1px);}
.icon-picker-swatch{
  width:36px; height:36px; border-radius:10px; background:var(--grad-brand); color:#fff;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.icon-picker-swatch svg{width:17px; height:17px;}
.icon-picker-label{font-size:10.5px; color:var(--muted); line-height:1.25;}

/* Toast */
.toast-wrap{position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{
  background:var(--ink); color:#fff; padding:13px 18px; border-radius:11px; font-size:13.5px; font-weight:500;
  box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:10px;
  max-width:340px;
}
.toast svg{flex-shrink:0; color:var(--success); width:18px; height:18px;}

/* Confirm dialog reuse of modal but small */
.modal.modal-sm{max-width:400px;}

<!-- ============ BOAS-VINDAS (vinheta em vídeo) ============ -->
<div id="screen-welcome">
  <video id="vinheta-video" src="assets/vinheta.mp4" muted autoplay playsinline preload="auto"></video>
  <button type="button" class="btn-som-vinheta" id="btn-toggle-som" aria-label="Ativar som" title="Ativar som">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
  </button>
</div>
<!-- Trava de segurança independente: garante que o login apareça no máximo em 9s, mesmo que o
     vídeo não dispare o evento de término (ex: autoplay bloqueado), mas só se o usuário ainda
     não tiver entrado no sistema por outro caminho (ex: sessão já salva). -->
<script>
  setTimeout(function(){
    try{
      var shell = document.getElementById('app-shell');
      if(shell && !shell.classList.contains('hidden')) return; // já está logado, não mexe em nada
      var w = document.getElementById('screen-welcome');
      var l = document.getElementById('screen-login');
      if(w) w.classList.add('hidden');
      if(l) l.classList.remove('hidden');
    }catch(e){}
  }, 10000);
</script>

<!-- ============ LOGIN ============ -->
<div id="screen-login" class="hidden">

            <span class="icon-picker-swatch">${ICONS[key]||ICONS.step}</span>
            <span class="icon-picker-label">${escapeHTML(label)}</span>
          </button>`).join('')}

    </div>`).join('');
  const html = `
    <div class="modal-head"><h2>Escolher Ícone da Etapa</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="search-box" style="width:100%; margin-bottom:16px;">
        ${ICONS.search}

      </div>
      <div id="icon-picker-sections">${sections}</div>
      <div id="icon-picker-empty" class="hidden" style="text-align:center; padding:30px 0; color:var(--muted-2); font-size:13px;">Nenhum ícone encontrado.</div>
    </div>`;
  openModal(html, {wide:true});
  setTimeout(()=>document.getElementById('icon-search-input').focus(), 60);
}
function filterIconPicker(q){
  q = q.trim().toLowerCase();
  let anyAtAll = false;
  document.querySelectorAll('.icon-picker-group').forEach(group=>{
    let anyVisible = false;
    group.querySelectorAll('.icon-picker-item').forEach(btn=>{
      const match = !q || btn.dataset.label.includes(q) || btn.dataset.key.includes(q);
      btn.style.display = match ? '' : 'none';
      if(match) anyVisible = true;
    });
    group.style.display = anyVisible ? '' : 'none';
    if(anyVisible) anyAtAll = true;
  });
  document.getElementById('icon-picker-empty').classList.toggle('hidden', anyAtAll);
}
function selectIcon(key){
  if(blockIfClient()) return;
  if(!iconPickerTarget){ closeModal(); return; }
  if(iconPickerTarget.type === 'builder'){
    builderEtapas[iconPickerTarget.index].icon = key;
    renderBuilderEtapas();
  } else if(iconPickerTarget.type === 'etapa'){
    const obra = DB.obras.find(o=>o.id===iconPickerTarget.obraId);
    const et = obra.etapas.find(e=>e.id===iconPickerTarget.etapaId);
    et.icon = key;
    saveDB(DB);
    Router.render(true);
  }
  iconPickerTarget = null;
  closeModal();
}

/* ---------------- DB helpers ---------------- */
function seedDB(){
  return {
    users: [
      {id:'u1', username:'admin', password:'admin123', nome:'Administrador', role:'responsavel'},

}
function loadDB(){

    const db = JSON.parse(raw);

  }catch(e){ const seeded = seedDB(); saveDB(seeded); return seeded; }
}
function saveDB(db){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }

/* Migração: formato antigo tinha etapa = {nome, percentual, dataPrevista, dataReal}.
   Formato novo: etapa = {nome, color, tarefas:[{nome, dates:[], percentual}]}.
   Etapas antigas viram tarefas agrupadas numa etapa "Geral" (sem perder nenhum dado). */
function migrateEtapasParaTarefas(db){
  let changed = false;
  (db.obras||[]).forEach(obra=>{
    const precisaMigrar = (obra.etapas||[]).some(e=>!e.tarefas);
    if(!precisaMigrar) return;
    changed = true;
    const tarefas = obra.etapas.map(e=>({
      id: e.id || uid('tar'),
      nome: e.nome,
      dates: e.dataReal ? [e.dataReal] : [],
      percentual: e.percentual || 0,
    }));
    obra.etapas = [{
      id: uid('et'),
      nome: 'Geral',
      icon: 'step',
      color: colorForIndex(0),
      tarefas,
    }];
  });
  if(changed) saveDB(db);
}
let DB = loadDB();

function etapaProgress(etapa){
  if(!etapa.tarefas || !etapa.tarefas.length) return 0;
  const sum = etapa.tarefas.reduce((a,t)=>a+(t.percentual||0),0);
  return Math.round(sum / etapa.tarefas.length);
}

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }

/* ---------------- Session ---------------- */
function getSession(){ try{ return JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){ return null; } }
function setSession(user){ localStorage.setItem(SESSION_KEY, JSON.stringify(user)); }
function clearSession(){ localStorage.removeItem(SESSION_KEY); }
function isClientSession(){ const s = getSession(); return !!s && s.role === 'cliente'; }
function blockIfClient(){

function blockIfNotResponsavel(){

  // tanto Cliente quanto Equipe de Campo (diferente de blockIfClient, que só barra Cliente).
  const session = getSession();

/* ---------------- Utils ---------------- */
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return '—';
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function fmtDateShort(iso){
  if(!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return '—';
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
}
function todayISO(){
  // Usa data LOCAL do navegador (não UTC) — toISOString() converte pra UTC,
  // o que faz "hoje" virar o dia seguinte cedo demais em fusos negativos (ex: Brasil, UTC-3,
  // qualquer horário depois das 21h já vira o próximo dia em UTC).
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function daysUntil(iso){
  if(!iso) return null;
  const d = new Date(iso+'T00:00:00'), now = new Date(todayISO()+'T00:00:00');
  return Math.round((d-now)/86400000);
}
function initials(name){
  if(!name) return '--';
  const parts = name.trim().split(/\s+/);
  return ((parts[0]?.[0]||'') + (parts[1]?.[0]||'')).toUpperCase();
}
function escapeHTML(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHTML(str).replace(/\n/g,' '); }

function obraScheduleRange(obra){
  // Data mais cedo e mais tarde entre TODAS as datas marcadas nas tarefas da obra
  // (o cronograma real, tarefa por tarefa — diferente do campo "Prazo final" digitado à mão).
  const todasDatas = (obra.etapas||[]).flatMap(e => (e.tarefas||[]).flatMap(t => t.dates || []));
  if(!todasDatas.length) return null;
  todasDatas.sort();
  return { inicio: todasDatas[0], fim: todasDatas[todasDatas.length-1] };
}

function obraProgress(obra){
  // Média direta de todas as tarefas de todas as etapas — cada tarefa pesa igual.
  // Etapas sem nenhuma tarefa não entram na conta (evitam puxar o total pra baixo à toa).
  const todasTarefas = (obra.etapas||[]).flatMap(e => e.tarefas || []);
  if(!todasTarefas.length) return 0;
  const sum = todasTarefas.reduce((a,t)=>a+(t.percentual||0),0);
  return Math.round(sum / todasTarefas.length);
}
function obraStatus(obra){
  const pct = obraProgress(obra);
  if(pct >= 100) return 'done';
  if(!obra.prazoFinal) return 'noprazo';
  const d = daysUntil(obra.prazoFinal);
  if(d !== null && d < 0) return 'late';
  if(d !== null && d <= 7) return 'warn';
  return 'ok';
}
function statusLabel(s){
  return {ok:'No prazo', warn:'Atenção', late:'Atrasado', done:'Concluído', none:'Sem serviços', noprazo:'Sem prazo definido'}[s] || s;
}
function clientObras(clientId){ return DB.obras.filter(o=>o.clientId===clientId); }
function clientOverallStatus(clientId){
  const todasObras = clientObras(clientId);
  if(!todasObras.length) return 'none';
  const obras = todasObras.filter(o=>obraStatus(o)!=='done');
  if(!obras.length) return 'done';
  if(obras.some(o=>obraStatus(o)==='late')) return 'late';
  if(obras.some(o=>obraStatus(o)==='warn')) return 'warn';
  if(obras.some(o=>obraStatus(o)==='noprazo')) return 'warn';
  return 'ok';
}
function progressRingSVG(pct, status, size=52, stroke=5){
  const r = (size-stroke)/2;
  const c = 2*Math.PI*r;
  const off = c - (pct/100)*c;
  const color = status==='late' ? 'var(--danger)' : status==='warn' ? 'var(--warning)' : status==='done' ? 'var(--purple)' : (status==='none'||status==='noprazo') ? 'var(--muted-2)' : 'var(--blue)';
  return `
    <div class="progress-ring-mini" style="width:${size}px; height:${size}px;">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${stroke}"/>
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
          stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
      </svg>
      <div class="progress-ring-mini-label" style="font-size:${size<56?'12px':'14px'};">${status==='none'?'—':pct+'%'}</div>
    </div>`;
}

/* ---------------- Toast ---------------- */
function toast(msg){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${ICONS.check}<span></span>`;
  el.querySelector('span').textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(20px)'; el.style.transition='all .25s'; setTimeout(()=>el.remove(),260); }, 3200);
}

/* ---------------- Modal (empilhável — permite abrir um modal sobre outro) ---------------- */
let modalStack = [];
function openModal(html, opts={}){
  const root = document.getElementById('modal-root');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.style.zIndex = 100 + modalStack.length;
  overlay.innerHTML = `<div class="modal ${opts.wide?'modal-wide':''} ${opts.sm?'modal-sm':''}">${html}</div>`;
  // Clique fora do modal NÃO fecha — evita perda acidental de dados preenchidos.
  // Fechamento só pelo botão X, "Cancelar" ou ao concluir a ação (salvar/excluir).
  root.appendChild(overlay);
  modalStack.push(overlay);
  return overlay;
}
function updateTopModalContent(html, opts={}){
  // Atualiza a tela de modal que já está aberta no topo da pilha, no lugar dela mesma —
  // usado quando uma ação (excluir, adicionar) precisa "refrescar" a própria tela atual
  // sem empilhar uma segunda por cima (o que deixava uma versão antiga escondida atrás).
  const top = modalStack[modalStack.length-1];
  if(!top){ openModal(html, opts); return; }
  top.innerHTML = `<div class="modal ${opts.wide?'modal-wide':''} ${opts.sm?'modal-sm':''}">${html}</div>`;
}
function closeModal(){
  const el = modalStack.pop();
  if(el) el.remove();
}
function confirmDialog(title, msg, onConfirm, confirmLabel='Excluir'){
  const html = `
    <div class="modal-head"><h2>${escapeHTML(title)}</h2>
      <button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body"><p style="color:var(--muted); font-size:14px; line-height:1.6;">${escapeHTML(msg)}</p></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn" style="background:var(--danger); color:#fff;" id="confirm-danger-btn">${escapeHTML(confirmLabel)}</button>
    </div>`;
  openModal(html, {sm:true});
  document.getElementById('confirm-danger-btn').onclick = ()=>{ closeModal(); onConfirm(); };
}

const Router = {
  state: { view:'clients', clientId:null, obraId:null, tab:'geral' },
  goHome(){
    const session = getSession();
    if(session && session.role==='cliente'){
      this.state = {view:'client-obras', clientId:session.clientId, obraId:null, tab:'geral'};
    } else {
      this.state = {view:'clients', clientId:null, obraId:null, tab:'geral'};
    }
    this.render();
  },
  goClient(clientId){ this.state = {view:'obras', clientId, obraId:null, tab:'geral'}; this.render(); },
  goObra(clientId, obraId){ this.state = {view:'obra-detail', clientId, obraId, tab:'geral'}; this.render(); },
  setTab(tab){
    this.state.tab = tab;
    this.render(true);
    const tabsEl = document.querySelector('.tabs');
    if(tabsEl) tabsEl.scrollIntoView({block:'start', behavior:'instant'});
  },
  render(preserveScroll){
    const scrollY = window.scrollY;
    renderCrumb();
    const main = document.getElementById('main-view');
    if(this.state.view==='clients') main.innerHTML = ViewClients();
    else if(this.state.view==='client-obras') main.innerHTML = ViewClientObras(this.state.clientId);
    else if(this.state.view==='obras') main.innerHTML = ViewObras(this.state.clientId);
    else if(this.state.view==='obra-detail') main.innerHTML = ViewObraDetail(this.state.clientId, this.state.obraId, this.state.tab);
    window.scrollTo({top: preserveScroll ? scrollY : 0, behavior:'instant'});
  }
};

function renderCrumb(){
  const bar = document.getElementById('crumb-bar');
  const s = Router.state;
  const session = getSession();
  if(session && session.role==='cliente'){
    let html = `<span class="crumb-item ${s.view==='client-obras'?'current':''}" onclick="Router.goHome()">Meus Serviços</span>`;
    if(s.obraId){
      const o = DB.obras.find(o=>o.id===s.obraId);
      html += `<span class="crumb-sep">/</span><span class="crumb-item current">${escapeHTML(o?o.nome:'')}</span>`;
    }
    bar.innerHTML = html;
    return;
  }
  let html = `<span class="crumb-item ${s.view==='clients'?'current':''}" onclick="Router.goHome()">Clientes</span>`;
  if(s.clientId){
    const c = DB.clients.find(c=>c.id===s.clientId);
    html += `<span class="crumb-sep">/</span><span class="crumb-item ${s.view==='obras'?'current':''}" onclick="Router.goClient('${s.clientId}')">${escapeHTML(c?c.nome:'')}</span>`;
  }
  if(s.obraId){
    const o = DB.obras.find(o=>o.id===s.obraId);
    html += `<span class="crumb-sep">/</span><span class="crumb-item current">${escapeHTML(o?o.nome:'')}</span>`;
  }
  bar.innerHTML = html;
}

function isEmExecucao(obra){
  const pct = obraProgress(obra);
  return pct > 0 && pct < 100;
}

function ViewClientObras(clientId){
  const client = DB.clients.find(c=>c.id===clientId);
  if(!client) return '';
  const todasObras = clientObras(clientId);
  const emAndamento = todasObras.filter(o=>obraProgress(o) < 100);
  const concluidas = todasObras.filter(o=>obraProgress(o) >= 100);

  const cardHTML = (o) => {
    const pct = obraProgress(o);
    const status = obraStatus(o);
    const scheduleRange = obraScheduleRange(o);
    const d = daysUntil(o.prazoFinal);
    let prazoText = '—', prazoClass = '';
    if(pct>=100){ prazoText = scheduleRange ? `Concluído em ${fmtDateShort(scheduleRange.fim)}` : 'Concluído'; }
    else if(d===null){ prazoText = 'Sem prazo definido'; }
    else if(d<0){ prazoText = `${Math.abs(d)} dia${Math.abs(d)!==1?'s':''} em atraso`; prazoClass='is-late'; }
    else if(d===0){ prazoText = 'Vence hoje'; prazoClass='is-warn'; }
    else { prazoText = `${d} dia${d!==1?'s':''} restante${d!==1?'s':''}`; if(d<=5) prazoClass='is-warn'; }
    return `
    <div class="client-obra-card status-${status}" onclick="Router.goObra('${clientId}','${o.id}')">
      <div class="coc-ring-wrap status-${status}">${progressRingSVG(pct, status, 46, 5)}</div>
      <div class="coc-body">
        <div class="coc-top">
          <span class="coc-type">${escapeHTML(o.tipo)}</span>
          <span class="status-pill ${status}"><span class="status-dot ${status}"></span>${statusLabel(status)}</span>
        </div>
        <div class="coc-name">${escapeHTML(o.nome)}</div>
        <div class="coc-meta">
          <span>${ICONS.calendar} Início: <b>${o.dataInicio ? fmtDateShort(o.dataInicio) : '—'}</b> → Prazo: <b>${fmtDateShort(o.prazoFinal)}</b></span>
          <span class="coc-days ${prazoClass}">${escapeHTML(prazoText)}</span>
        </div>
      </div>
      <div class="coc-chevron">${ICONS.forward}</div>
    </div>`;
  };

  const empty = todasObras.length===0 ? `
    <div class="empty-state">
      ${ICONS.calendar}
      <h3>Nenhum serviço cadastrado no momento</h3>
      <p>Assim que um serviço seu for cadastrado, ele aparecerá aqui com o andamento atualizado.</p>
    </div>` : '';

  const secaoAndamento = emAndamento.length ? `
    <h3 class="section-subtitle">Em Andamento</h3>
    <div class="client-obra-list" style="margin-bottom:28px;">${emAndamento.map(cardHTML).join('')}</div>
  ` : '';
  const secaoConcluidas = concluidas.length ? `
    <h3 class="section-subtitle">Concluídos</h3>
    <div class="client-obra-list">${concluidas.map(cardHTML).join('')}</div>
  ` : '';

  // Estatísticas do topo
  const prazosAbertos = emAndamento.map(o=>daysUntil(o.prazoFinal)).filter(d=>d!==null);
  const proximoPrazo = prazosAbertos.length ? Math.min(...prazosAbertos) : null;
  const temAtraso = emAndamento.some(o=>obraStatus(o)==='late');
  const proximoPrazoTexto = proximoPrazo===null ? '—' : (proximoPrazo<0 ? `${Math.abs(proximoPrazo)}d em atraso` : proximoPrazo===0 ? 'Hoje' : `${proximoPrazo} dias`);

  return `
    <div class="client-hero">
      <div class="client-hero-top">
        <div class="client-hero-eyebrow">${escapeHTML(client.nome)}</div>
        <h1 class="client-hero-title">Seus serviços com a AgaSense</h1>
        <p class="client-hero-sub">Acompanhamento em tempo real de cada etapa da sua obra, do planejamento à entrega.</p>
      </div>
      <div class="client-hero-stats">
        <div class="client-stat">
          <div class="cs-num">${todasObras.length}</div>
          <div class="cs-lbl">Serviço${todasObras.length!==1?'s':''} no total</div>
        </div>
        <div class="client-stat">
          <div class="cs-num">${emAndamento.length}</div>
          <div class="cs-lbl">Em andamento</div>
        </div>
        <div class="client-stat">
          <div class="cs-num">${concluidas.length}</div>
          <div class="cs-lbl">Concluído${concluidas.length!==1?'s':''}</div>
        </div>
        <div class="client-stat ${temAtraso?'is-alert':''}">
          <div class="cs-num">${proximoPrazoTexto}</div>
          <div class="cs-lbl">${temAtraso?'Prazo em atraso':'Próximo prazo'}</div>
        </div>
      </div>
    </div>
    ${secaoAndamento}${secaoConcluidas}${empty}
  `;
}

function checkPasswordStrength(pw){
  return {
    len: pw.length >= 8,
    upper: /[A-Z]/.test(pw),
    lower: /[a-z]/.test(pw),
    special: /[^A-Za-z0-9]/.test(pw),
  };
}
function pwStrengthOk(pw){
  const c = checkPasswordStrength(pw);
  return c.len && c.upper && c.lower && c.special;
}
function renderPwStrength(pw){
  const el = document.getElementById('pw-strength-card');
  if(!el) return;
  const c = checkPasswordStrength(pw||'');
  const item = (ok, label) => `<div style="display:flex; align-items:center; gap:8px; font-size:12.5px; color:${ok?'var(--success)':'var(--muted)'};">
    <span style="width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:${ok?'var(--success)':'var(--border)'}; color:#fff; flex-shrink:0;">${ok?'✓':''}</span>
    ${label}
  </div>`;
  el.innerHTML = `
    <div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted-2); margin-bottom:8px;">Senha forte precisa ter:</div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:7px;">
      ${item(c.len, '8+ caracteres')}
      ${item(c.upper, 'Letra maiúscula')}
      ${item(c.lower, 'Letra minúscula')}
      ${item(c.special, 'Caractere especial')}
    </div>`;
}
function gerarSenhaForte(){
  const maiusc = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  const minusc = 'abcdefghijkmnpqrstuvwxyz';
  const num = '23456789';
  const esp = '!@#$%&*';
  const todos = maiusc+minusc+num+esp;
  let pw = [
    maiusc[Math.floor(Math.random()*maiusc.length)],
    minusc[Math.floor(Math.random()*minusc.length)],
    num[Math.floor(Math.random()*num.length)],
    esp[Math.floor(Math.random()*esp.length)],
  ];
  for(let i=0; i<6; i++) pw.push(todos[Math.floor(Math.random()*todos.length)]);
  // embaralha
  for(let i=pw.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [pw[i],pw[j]]=[pw[j],pw[i]]; }
  return pw.join('');
}
function slugifyLite(str){ return (str||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'').slice(0,12); }
function submitPortalAccess(clientId){

  const client = DB.clients.find(c=>c.id===clientId);
  client.portalUsuario = u;
