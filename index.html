      <button type="button" class="etapa-mini-btn" onclick="moveBuilderEtapa(${i},-1)" ${i===0?'disabled':''} title="Mover para cima">${ICONS.up}</button>
      <button type="button" class="etapa-mini-btn" onclick="moveBuilderEtapa(${i},1)" ${i===builderEtapas.length-1?'disabled':''} title="Mover para baixo">${ICONS.down}</button>
      <button type="button" class="etapa-builder-remove" onclick="removeBuilderEtapa(${i})" title="Remover etapa">${ICONS.trash}</button>
    </div>`).join('');
}
function addBuilderEtapa(){ builderEtapas.push({nome:'', icon:'step'}); renderBuilderEtapas(); const inputs=document.querySelectorAll('#etapa-builder-list input'); if(inputs.length) inputs[inputs.length-1].focus(); }
function removeBuilderEtapa(i){ builderEtapas.splice(i,1); renderBuilderEtapas(); }
function moveBuilderEtapa(i, dir){
  const newIdx = i + dir;
  if(newIdx < 0 || newIdx >= builderEtapas.length) return;
  const [item] = builderEtapas.splice(i,1);
  builderEtapas.splice(newIdx, 0, item);
  renderBuilderEtapas();
}
function submitObraForm(clientId, obraId){
  if(blockIfNotResponsavel()) return;
  const editing = !!obraId;
  const nome = document.getElementById('f-onome').value.trim();
  if(!nome){ toast('Informe o nome do serviço'); return; }
  const enderecoRua = document.getElementById('f-oendereco').value.trim();
  const numero = document.getElementById('f-onumero').value.trim();
  const session = getSession();

  if(editing){
    const obra = DB.obras.find(o=>o.id===obraId);
    Object.assign(obra, {
      nome,
      tipo: document.getElementById('f-otipo').value.trim() || 'Serviço de Cabeamento',
      endereco: enderecoRua,
      numero: numero,
      dataInicio: document.getElementById('f-oinicio').value,
      prazoFinal: document.getElementById('f-oprazo').value,
      responsavelTecnico: document.getElementById('f-oresp').value.trim(),
      prioridade: document.getElementById('f-oprioridade').value,
      statusProcesso: document.getElementById('f-ostatusproc').value,
      escopo: document.getElementById('f-oescopo').value.trim(),
    });
    saveDB(DB);
    closeModal(); toast('Serviço atualizado');
    Router.goObra(clientId, obraId);
    return;
  }

  const obra = {
    id: uid('obra'),
    clientId,
    nome,
    tipo: document.getElementById('f-otipo').value.trim() || 'Serviço de Cabeamento',
    escopo: document.getElementById('f-oescopo').value.trim(),
    endereco: enderecoRua,
    numero: numero,
    dataInicio: document.getElementById('f-oinicio').value,
    prazoFinal: document.getElementById('f-oprazo').value,
    responsavelTecnico: document.getElementById('f-oresp').value.trim(),
    prioridade: document.getElementById('f-oprioridade').value,
    statusProcesso: document.getElementById('f-ostatusproc').value,
    criadoPor: session ? session.nome : '—',
    criadoEm: todayISO(),
    reagendamentos: [],
    etapas: [],
    updates: [],
    comments: [],
    createdAt: todayISO(),
  };
  DB.obras.push(obra); saveDB(DB);
  closeModal(); toast('Serviço criado com sucesso');
  Router.goObra(clientId, obra.id);
}

function deleteObra(clientId, obraId){
  if(blockIfNotResponsavel()) return;
  const o = DB.obras.find(o=>o.id===obraId);
  confirmDialog('Excluir serviço?', `Isso removerá "${o.nome}" e todo o histórico de atualizações. Esta ação não pode ser desfeita.`, ()=>{
    DB.obras = DB.obras.filter(o=>o.id!==obraId);
    saveDB(DB); toast('Serviço removido'); Router.goClient(clientId);
  });
}

/* ============================================================
   VIEW: OBRA DETAIL
   ============================================================ */
function ViewObraDetail(clientId, obraId, tab){
  const client = DB.clients.find(c=>c.id===clientId);
  const obra = DB.obras.find(o=>o.id===obraId);
  if(!client || !obra){ Router.goHome(); return ''; }
  const session = getSession();
  const isClientMode = session && session.role === 'cliente';

  const pct = obraProgress(obra);
  const status = obraStatus(obra);
  const scheduleRange = obraScheduleRange(obra);
  const etapaPcts = obra.etapas.map(e=>etapaProgress(e));
  const currentIdx = etapaPcts.findIndex(p=>p < 100);
  const effectiveCurrentIdx = currentIdx === -1 ? obra.etapas.length-1 : currentIdx;

  const stepsHTML = obra.etapas.map((e,i)=>{
    const ep = etapaPcts[i];
    const cls = ep>=100 ? 'is-done' : (i===effectiveCurrentIdx ? 'is-current' : 'is-pending');
    const node = ep>=100 ? ICONS.check : ICONS.step;
    const color = e.color || colorForIndex(i);
    return `
    <div class="cable-step ${cls}" style="--etapa-color:${color};">
      <div class="cable-node">${node}</div>
      <div class="cable-step-label">${escapeHTML(e.nome)}</div>
    </div>`;
  }).join('');

  const fillWidth = obra.etapas.length>1 ? (effectiveCurrentIdx/(obra.etapas.length-1))*100 * (pct>=100?1: (effectiveCurrentIdx/(obra.etapas.length-1)>0?1:0)) : 0;
  const cableFillPct = obra.etapas.length>1 ? (etapaPcts.filter(p=>p>=100).length / (obra.etapas.length-1)) * 100 : 0;

  const circumference = 2*Math.PI*26;
  const dashOffset = circumference - (pct/100)*circumference;
  const ringColor = status==='late' ? 'var(--danger)' : status==='warn' ? 'var(--warning)' : status==='done' ? 'var(--purple)' : 'var(--blue)';

  let tabs = [
    {id:'geral', label:'Visão Geral'},
    {id:'cronograma', label:'Cronograma'},
    {id:'campo', label:'Atualizações de Campo', badge:obra.updates.length},
    {id:'comentarios', label:'Comentários do Gestor', badge:obra.comments.length},
    {id:'documentos', label:'Documentos'},
  ];
  if(isClientMode){
    tabs = tabs.filter(t=>t.id!=='comentarios' && t.id!=='documentos');
    if(tab==='comentarios' || tab==='documentos') tab = 'geral';
  }

  let tabContent = '';
  if(tab==='geral') tabContent = TabGeral(obra);
  else if(tab==='cronograma') tabContent = TabCronograma(obra);
  else if(tab==='campo') tabContent = TabAtualizacoes(obra);
  else if(tab==='comentarios') tabContent = TabComentarios(obra);
  else if(tab==='documentos') tabContent = TabDocumentos(obra);

  setTimeout(()=>{
    const av1 = document.getElementById('composer-avatar');
    const av2 = document.getElementById('composer-avatar-c');
    if(session){
      if(av1) av1.textContent = initials(session.nome);
      if(av2) av2.textContent = initials(session.nome);
    }
  }, 0);

  const tabsHTML = tabs.map(t=>{
    const btn = `
    <button class="tab-btn ${tab===t.id?'active':''}" onclick="Router.setTab('${t.id}')">
      ${escapeHTML(t.label)} ${t.badge?`<span class="tab-badge">${t.badge}</span>`:''}
    </button>`;
    const calBtn = t.id==='cronograma' ? `
    <button class="tab-btn tab-btn-cal" onclick="openObraCalendario('${obra.id}')">
      ${ICONS.calendar} Calendário
    </button>` : '';
    return btn + calBtn;
  }).join('');

  const prio = prioridadeInfo(obra.prioridade || 'normal');
  const statusProc = obra.statusProcesso || 'Solicitado';

  return `
    <div class="view-actions" style="margin-bottom:14px;">
      <button class="btn btn-ghost btn-sm" onclick="${isClientMode ? 'Router.goHome()' : `Router.goClient('${clientId}')`}">${ICONS.back} ${isClientMode ? 'Meus Serviços' : escapeHTML(client.nome)}</button>
    </div>
    <div class="obra-header">
      <div class="obra-header-top">
        <div class="obra-header-titles">
          <div class="obra-card-type">${escapeHTML(obra.tipo)}</div>
          <h1>${escapeHTML(obra.nome)}</h1>
          <div class="obra-client-name">${escapeHTML(client.nome)} ${obra.endereco?('· '+escapeHTML(obra.endereco)+(obra.numero?(', nº '+escapeHTML(obra.numero)):'')):''}</div>
        </div>
        <div class="obra-header-actions">
          <span class="status-pill ${status}" style="align-self:center;"><span class="status-dot ${status}"></span>${statusLabel(status)}</span>
          <select class="prio-pill" style="color:${prio.color}; background:${prio.bg};" onchange="updatePrioridade('${obra.id}', this.value)" title="Prioridade">
            ${PRIORIDADES.map(p=>`<option value="${p.v}" ${p.v===prio.v?'selected':''}>${p.label}</option>`).join('')}
          </select>
          <select class="proc-pill" onchange="updateStatusProcesso('${obra.id}', this.value)" title="Status do processo">
            ${STATUS_PROCESSO.map(s=>`<option value="${escapeAttr(s)}" ${s===statusProc?'selected':''}>${escapeHTML(s)}</option>`).join('')}
          </select>
          <button class="btn btn-secondary btn-sm" onclick="openReagendarForm('${obra.id}')">${ICONS.calendar} Reagendar</button>
          <button class="btn btn-secondary btn-sm" onclick="exportExcel('${obra.id}')">${ICONS.file} Exportar Excel</button>
          <button class="btn btn-danger-ghost btn-sm" onclick="deleteObra('${clientId}','${obraId}')">${ICONS.trash}</button>
        </div>
      </div>

      <div class="cable-stepper">
        <div class="cable-track-wrap">
          <div class="cable-line-bg"></div>
          <div class="cable-line-fill" style="width:calc(${cableFillPct}% - ${cableFillPct>0?0:0}px); max-width:calc(100% - 48px);"></div>
          <div class="cable-steps">${stepsHTML}</div>
        </div>
      </div>

      <div class="obra-progress-hero">
        <div class="progress-ring-mini">
          <svg width="64" height="64" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="26" fill="none" stroke="var(--border)" stroke-width="6"/>
            <circle cx="32" cy="32" r="26" fill="none" stroke="${ringColor}" stroke-width="6" stroke-linecap="round"
              stroke-dasharray="${circumference}" stroke-dashoffset="${dashOffset}"/>
          </svg>
          <div class="progress-ring-mini-label">${pct}%</div>
        </div>
        <div class="progress-hero-info">
          <div class="label">Progresso Geral da Obra</div>
          <div class="val">${
            pct>=100
              ? `100% concluído${scheduleRange ? ' em '+fmtDate(scheduleRange.fim) : ''} · Prazo combinado era ${fmtDate(obra.prazoFinal)}${scheduleRange && obra.prazoFinal ? (scheduleRange.fim<=obra.prazoFinal ? ' — entregue dentro do prazo' : ' — entregue com atraso') : ''}`
              : `${pct}% concluído · Prazo final em ${fmtDate(obra.prazoFinal)} ${daysUntil(obra.prazoFinal)!==null ? `(${daysUntil(obra.prazoFinal)>=0? daysUntil(obra.prazoFinal)+' dias restantes' : Math.abs(daysUntil(obra.prazoFinal))+' dias em atraso'})` : ''}`
          }</div>
          ${pct<100 && scheduleRange ? `<div class="val-sub ${obra.prazoFinal && scheduleRange.fim > obra.prazoFinal ? 'is-warn' : ''}">Cronograma real (tarefas marcadas): ${fmtDate(scheduleRange.inicio)} → ${fmtDate(scheduleRange.fim)}${obra.prazoFinal && scheduleRange.fim > obra.prazoFinal ? ' — passa do prazo final combinado' : ''}</div>` : ''}
        </div>
      </div>
    </div>

    <div class="tabs">${tabsHTML}</div>
    <div class="tab-panel">${tabContent}</div>
  `;
}

function TabGeral(obra){
  const client = DB.clients.find(c=>c.id===obra.clientId);

  const reagHTML = reagendamentos.length ? `
      <div class="info-panel info-panel-full">
        <div class="info-panel-head"><h3 style="margin:0;">Histórico de Reagendamentos</h3></div>
        ${[...reagendamentos].reverse().map(r=>`
          <div class="info-row" style="align-items:flex-start;">
            <span class="k">${fmtDate(r.data)} · ${escapeHTML(r.autor)}</span>
            <span class="v" style="text-align:right;">${fmtDate(r.dataAnterior)} → <b>${fmtDate(r.dataNova)}</b><br>
              <span style="font-weight:400; color:var(--muted); font-size:12px;">${escapeHTML(r.motivo)}${r.obs?(' — '+escapeHTML(r.obs)):''}</span>

      ${reagHTML}

  `;
}

  const html = `

function submitReagendar(obraId){
  if(blockIfNotResponsavel()) return;
  const novoPrazo = document.getElementById('f-novoprazo').value;
  if(!novoPrazo){ toast('Escolha a nova data'); return; }
  const obra = DB.obras.find(o=>o.id===obraId);
  const motivo = document.getElementById('f-motivo-reag').value;
  const obs = document.getElementById('f-obs-reag').value.trim();
  const session = getSession();
  if(!obra.reagendamentos) obra.reagendamentos = [];
  obra.reagendamentos.push({
    dataAnterior: obra.prazoFinal, dataNova: novoPrazo, motivo, obs,
    autor: session ? session.nome : '—', data: todayISO()
  });
  obra.prazoFinal = novoPrazo;
  obra.statusProcesso = 'Reagendado';
  saveDB(DB); closeModal(); toast('Serviço reagendado'); Router.render();
}

function TabCronograma(obra){
  const etapasHTML = obra.etapas.map((e,i)=>{
    const color = e.color || colorForIndex(i);
    const ep = etapaProgress(e);
    const expanded = expandedEtapas.has(e.id);
    const nTarefas = (e.tarefas||[]).length;
    const tarefasHTML = (e.tarefas||[]).map((t,ti)=>{
      const checked = t.percentual>=100;
      const nDatas = (t.dates||[]).length;
      const datasLabel = nDatas===0 ? 'Definir datas' : `${nDatas} data${nDatas!==1?'s':''}`;
      return `
      <div class="tarefa-row">
        <div class="etapa-check ${checked?'checked':''}" style="${checked?`border-color:${color}; background:${color};`:''}" onclick="toggleTarefa('${obra.id}','${e.id}','${t.id}')">${checked?ICONS.check:''}</div>
        <input class="etapa-name-input tarefa-name-input" value="${escapeAttr(t.nome)}" onchange="renameTarefa('${obra.id}','${e.id}','${t.id}', this.value)">
        <button type="button" class="tarefa-dates-btn" onclick="openTarefaCalendar('${obra.id}','${e.id}','${t.id}')" title="Definir datas desta tarefa">${ICONS.calendar} ${datasLabel}</button>
        <button type="button" class="tarefa-dates-btn tarefa-fotos-btn" onclick="openTarefaFotos('${obra.id}','${e.id}','${t.id}')" title="Fotos desta tarefa">${ICONS.camera} ${(t.fotos&&t.fotos.length) ? `Fotos (${t.fotos.length})` : 'Fotos'}</button>
        <div class="etapa-slider-group">
          <input type="range" min="0" max="100" step="5" value="${t.percentual}" oninput="this.nextElementSibling.textContent = this.value + '%'" onchange="updateTarefaPct('${obra.id}','${e.id}','${t.id}', this.value)">
          <span class="etapa-pct-num">${t.percentual}%</span>
        </div>
        <div class="etapa-row-actions">
          <button class="etapa-mini-btn" onclick="moveTarefa('${obra.id}','${e.id}','${t.id}',-1)" ${ti===0?'disabled':''} title="Mover para cima">${ICONS.up}</button>
          <button class="etapa-mini-btn" onclick="moveTarefa('${obra.id}','${e.id}','${t.id}',1)" ${ti===e.tarefas.length-1?'disabled':''} title="Mover para baixo">${ICONS.down}</button>
          <button class="etapa-mini-btn danger" onclick="removeTarefa('${obra.id}','${e.id}','${t.id}')" title="Remover tarefa">${ICONS.trash}</button>
        </div>
      </div>`;
    }).join('') || `<div class="tarefa-empty">Nenhuma tarefa ainda — adicione a primeira abaixo.</div>`;

    return `
    <div class="etapa-group ${expanded?'':'is-collapsed'}" style="--etapa-color:${color};">
      <div class="etapa-group-head">
        <button type="button" class="etapa-collapse-btn" onclick="toggleEtapaCollapse('${e.id}')" title="${expanded?'Recolher':'Expandir'}">${ICONS.forward}</button>
        <button type="button" class="etapa-color-swatch" style="background:${color};" onclick="openEtapaColorPicker('${obra.id}','${e.id}')" title="Cor da etapa"></button>
        <div class="etapa-name-row" style="flex:1;">
          <span class="etapa-num">${i+1}.</span>
          <input class="etapa-name-input etapa-title-input" value="${escapeAttr(e.nome)}" onchange="renameEtapa('${obra.id}','${e.id}', this.value)">
          ${!expanded ? `<span class="etapa-collapsed-count">${nTarefas} tarefa${nTarefas!==1?'s':''}</span>` : ''}
        </div>
        <div class="etapa-group-pct" style="color:${color};">${ep}%</div>
        <div class="etapa-row-actions">
          <button class="etapa-mini-btn" onclick="moveEtapa('${obra.id}','${e.id}',-1)" ${i===0?'disabled':''} title="Mover para cima">${ICONS.up}</button>

          <button class="etapa-mini-btn danger" onclick="removeEtapaRow('${obra.id}','${e.id}')" title="Remover etapa">${ICONS.trash}</button>
        </div>
      </div>
      <div class="etapa-group-track"><div class="etapa-group-fill" style="width:${ep}%; background:${color};"></div></div>
      ${expanded ? `
      <div class="tarefas-list">${tarefasHTML}</div>
      <button class="btn btn-secondary btn-sm" style="margin-top:10px;" onclick="addTarefa('${obra.id}','${e.id}')">${ICONS.plus} Adicionar Tarefa</button>
      ` : ''}
    </div>`;
  }).join('');

  const session = getSession();
  const isCampo = session && session.role === 'usuario';
  const helperText = isCampo

  return `

    </div>
  `;
}

/* ---------------- Etapa: nome / cor / ordem / remover ---------------- */
function renameEtapa(obraId, etapaId, val){
  if(blockIfClient()) return;
  const obra = DB.obras.find(o=>o.id===obraId);
  const et = obra.etapas.find(e=>e.id===etapaId);
  et.nome = val.trim() || et.nome;
  saveDB(DB); Router.render(true);
}
function moveEtapa(obraId, etapaId, dir){
  if(blockIfClient()) return;
  const obra = DB.obras.find(o=>o.id===obraId);
  const idx = obra.etapas.findIndex(e=>e.id===etapaId);
  const newIdx = idx + dir;
  if(newIdx < 0 || newIdx >= obra.etapas.length) return;
  const [item] = obra.etapas.splice(idx, 1);
  obra.etapas.splice(newIdx, 0, item);
  saveDB(DB); Router.render(true);
}
function removeEtapaRow(obraId, etapaId){
  if(blockIfNotResponsavel()) return;
  const obra = DB.obras.find(o=>o.id===obraId);
  if(obra.etapas.length <= 1){ toast('O cronograma precisa ter ao menos uma etapa'); return; }
  const etapa = obra.etapas.find(e=>e.id===etapaId);
  confirmDialog('Remover etapa?', `Isso vai remover "${etapa?etapa.nome:'esta etapa'}" e todas as suas tarefas do cronograma. Esta ação não pode ser desfeita.`, ()=>{
    obra.etapas = obra.etapas.filter(e=>e.id!==etapaId);
    saveDB(DB); toast('Etapa removida'); Router.render(true);
  });
}
function addEtapaRow(obraId){
  if(blockIfNotResponsavel()) return;
  const obra = DB.obras.find(o=>o.id===obraId);
  obra.etapas.push({ id: uid('et'), nome:'Nova etapa', icon:'step', color: colorForIndex(obra.etapas.length), tarefas: [] });
  saveDB(DB); Router.render(true);
}
function openEtapaColorPicker(obraId, etapaId){
  if(blockIfClient()) return;

  const currentColor = et.color || '#4B2E92';
  const swatches = COLOR_PALETTE.map(c=>`
    <button type="button" class="color-swatch-opt ${et.color===c?'active':''}" style="background:${c};" onclick="pickEtapaColor('${obraId}','${etapaId}','${c}')" title="${c}"></button>

  const html = `
    <div class="modal-head"><h2>Cor da Etapa</h2><button class="modal-close" onclick="closeModal()">✕</button></div>

      <div class="color-picker-free">

          oninput="if(/^#[0-9A-Fa-f]{6}$/.test(this.value)){ document.getElementById('etapa-color-native').value = this.value; document.getElementById('etapa-color-preview').style.background = this.value; }">

      <div class="color-swatch-grid">${swatches}</div>
    </div>`;

function pickEtapaColor(obraId, etapaId, color){
  if(blockIfClient()) return;
  if(!/^#[0-9A-Fa-f]{6}$/.test(color)){ toast('Cor inválida — use o seletor ou um hex válido (#RRGGBB)'); return; }
  const obra = DB.obras.find(o=>o.id===obraId);
  const et = obra.etapas.find(e=>e.id===etapaId);
  et.color = color;
  saveDB(DB); closeModal(); Router.render(true);
}

/* ---------------- Tarefa: nome / % / datas / ordem / remover ---------------- */
function findTarefa(obraId, etapaId, tarefaId){
  const obra = DB.obras.find(o=>o.id===obraId);
  const et = obra.etapas.find(e=>e.id===etapaId);
  const t = et.tarefas.find(t=>t.id===tarefaId);
  return {obra, et, t};
}
function logTarefaProgressFromCronograma(obra, et, t, percentual){
  const session = getSession();
  obra.updates.push({
    id: uid('upd'), autor: session ? session.nome : '—', data: todayISO(),
    texto: `Progresso atualizado pelo Cronograma: ${percentual}%`,
    etapaId: t.id, etapaNome: et.nome+' — '+t.nome, percentual
  });
}
function toggleTarefa(obraId, etapaId, tarefaId){
  if(blockIfClient()) return;
  const {obra, et, t} = findTarefa(obraId, etapaId, tarefaId);
  t.percentual = t.percentual>=100 ? 0 : 100;
  logTarefaProgressFromCronograma(obra, et, t, t.percentual);
  saveDB(DB); Router.render(true);
}
function updateTarefaPct(obraId, etapaId, tarefaId, val){
  if(blockIfClient()) return;
  const {obra, et, t} = findTarefa(obraId, etapaId, tarefaId);
  t.percentual = parseInt(val,10);
  logTarefaProgressFromCronograma(obra, et, t, t.percentual);
  saveDB(DB); Router.render(true);
}
function renameTarefa(obraId, etapaId, tarefaId, val){
  if(blockIfClient()) return;
  const {t} = findTarefa(obraId, etapaId, tarefaId);
  t.nome = val.trim() || t.nome;
  saveDB(DB); Router.render(true);
}
function moveTarefa(obraId, etapaId, tarefaId, dir){
  if(blockIfClient()) return;
  const {et} = findTarefa(obraId, etapaId, tarefaId);
  const idx = et.tarefas.findIndex(t=>t.id===tarefaId);
  const newIdx = idx + dir;
  if(newIdx < 0 || newIdx >= et.tarefas.length) return;
  const [item] = et.tarefas.splice(idx, 1);
  et.tarefas.splice(newIdx, 0, item);
  saveDB(DB); Router.render(true);
}
function removeTarefa(obraId, etapaId, tarefaId){
  if(blockIfNotResponsavel()) return;
  const {et, t} = findTarefa(obraId, etapaId, tarefaId);
  confirmDialog('Remover tarefa?', `Isso vai remover "${t?t.nome:'esta tarefa'}" e as datas marcadas para ela. Esta ação não pode ser desfeita.`, ()=>{
    et.tarefas = et.tarefas.filter(t=>t.id!==tarefaId);
    saveDB(DB); toast('Tarefa removida'); Router.render(true);
  });
}
function addTarefa(obraId, etapaId){
  if(blockIfNotResponsavel()) return;
  const obra = DB.obras.find(o=>o.id===obraId);
  const et = obra.etapas.find(e=>e.id===etapaId);
  if(!et.tarefas) et.tarefas = [];
  et.tarefas.push({ id: uid('tar'), nome:'Nova tarefa', dates: [], percentual: 0 });
  saveDB(DB); Router.render(true);
}

function buildTarefaFotosHTML(obraId, etapaId, tarefaId){
  const {t} = findTarefa(obraId, etapaId, tarefaId);
  const session = getSession();
  const isClient = session && session.role === 'cliente';
  const fotos = [...(t.fotos||[])].sort((a,b)=> (a.data+a.id) < (b.data+b.id) ? -1 : 1); // mais antiga primeiro — conta a história em ordem
  const itemsHTML = fotos.length ? `<div class="foto-list">${fotos.map(f => `
    <div class="foto-item">
      <img src="${f.dataUrl}" class="foto-thumb" onclick="window.open('${f.dataUrl}','_blank')">
      ${!isClient ? `<button class="foto-remove" onclick="removeFoto('${obraId}','${etapaId}','${tarefaId}','${f.id}')" title="Remover foto">${ICONS.trash}</button>` : ''}
      <div class="foto-meta">
        ${isClient
          ? (f.legenda ? `<div class="foto-legenda">${escapeHTML(f.legenda)}</div>` : '')
          : `<input class="foto-legenda-input" type="text" placeholder="Adicionar legenda (opcional)" value="${escapeAttr(f.legenda||'')}" onchange="updateFotoLegenda('${obraId}','${etapaId}','${tarefaId}','${f.id}', this.value)">`
        }
        <div class="foto-autor">${escapeHTML(f.autor)} · ${fmtDateShort(f.data)}</div>
      </div>
    </div>`).join('')}</div>` : `<div class="foto-empty">Nenhuma foto ainda${isClient?'.':' — adicione a primeira abaixo.'}</div>`;

  return `
    <div class="modal-head"><h2>Fotos — ${escapeHTML(t.nome)}</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      ${!isClient ? `
      <div style="display:flex; gap:10px; margin-bottom:16px;">
        <button class="btn btn-secondary btn-sm" style="flex:1;" onclick="triggerFotoPicker(true,'${obraId}','${etapaId}','${tarefaId}')">${ICONS.camera} Tirar Foto</button>
        <button class="btn btn-secondary btn-sm" style="flex:1;" onclick="triggerFotoPicker(false,'${obraId}','${etapaId}','${tarefaId}')">${ICONS.file} Escolher da Galeria</button>
      </div>
      ` : ''}
      ${itemsHTML}
    </div>`;
}
function triggerFotoPicker(useCamera, obraId, etapaId, tarefaId){
  if(blockIfClient()) return;
  // Cria um <input type=file> novo do zero a cada clique (nunca reaproveita o mesmo elemento).
  // Alguns navegadores Android têm um bug conhecido de "cache" no seletor de arquivos: se você
  // reaproveita o mesmo <input>, às vezes ele devolve os bytes de uma foto escolhida antes,
  // mesmo clicando na foto certa na galeria. Criar um elemento novinho a cada vez evita isso.
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  if(useCamera) input.capture = 'environment';
  input.style.position = 'fixed';
  input.style.left = '-9999px';
  input.addEventListener('change', function(){
    handleFotoFile(input, obraId, etapaId, tarefaId);
    setTimeout(()=>{ if(input.parentNode) input.parentNode.removeChild(input); }, 500);
  });
  document.body.appendChild(input);
  input.click();
}
function handleFotoFile(input, obraId, etapaId, tarefaId){
  if(blockIfClient()) return;
  const file = input.files && input.files[0];
  if(!file) return;
  toast('Processando foto...');
  const reader = new FileReader();
  reader.onerror = () => {
    toast('Não consegui ler essa foto. Tenta de novo ou escolhe outra.');
    console.error('FileReader falhou ao ler o arquivo da foto', reader.error);
  };
  reader.onload = (ev) => {
    const rawDataUrl = ev.target.result;
    const img = new Image();
    img.onerror = () => {
      // Não deu pra processar/redimensionar — salva a foto original sem redimensionar,
      // em vez de perder ela.
      console.error('Falha ao carregar a imagem pra redimensionar — salvando original sem cortar.');
      saveFotoToTarefa(obraId, etapaId, tarefaId, rawDataUrl);
    };
    img.onload = () => {
      if(!img.naturalWidth || !img.naturalHeight){
        // A imagem "carregou" tecnicamente, mas veio vazia — normalmente é um formato
        // que esse navegador não sabe abrir (ex: fotos .HEIC de iPhone). Avisa em vez
        // de salvar uma foto em branco.
        toast('Essa foto não pôde ser aberta — formato não suportado por este navegador (comum em fotos .HEIC). Tente converter pra JPEG ou tirar a foto direto pelo app.');
        console.error('Imagem carregou com dimensões zero — formato provavelmente não suportado.');
        return;
      }
      try{
        const maxSize = 1000;
        let w = img.width, h = img.height;
        if(w >= h && w > maxSize){ h = Math.round(h*maxSize/w); w = maxSize; }
        else if(h > w && h > maxSize){ w = Math.round(w*maxSize/h); h = maxSize; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        saveFotoToTarefa(obraId, etapaId, tarefaId, dataUrl);
      }catch(err){
        // Redimensionar falhou (memória, canvas travado, etc.) — salva a foto original
        // em vez de perder ela silenciosamente.
        console.error('Falha ao redimensionar a foto — salvando original sem cortar.', err);
        saveFotoToTarefa(obraId, etapaId, tarefaId, rawDataUrl);
      }
    };
    img.src = rawDataUrl;
  };
  reader.readAsDataURL(file);
  input.value = '';
}
function saveFotoToTarefa(obraId, etapaId, tarefaId, dataUrl){
  const {t} = findTarefa(obraId, etapaId, tarefaId);
  const session = getSession();
  if(!t.fotos) t.fotos = [];
  const foto = { id: uid('foto'), dataUrl, legenda:'', autor: session?session.nome:'—', data: todayISO() };
  t.fotos.push(foto);
  try{
    saveDB(DB);
    toast('Foto adicionada');
  }catch(err){
    t.fotos.pop();
    console.error('saveDB falhou ao salvar a foto (provável limite de espaço do navegador)', err);
    toast('Essa foto não coube no espaço do navegador — tente uma foto ou aguarde a versão com armazenamento real');
    return;
  }
  refreshTarefaFotosModal(obraId, etapaId, tarefaId);
  Router.render(true);
}
function updateFotoLegenda(obraId, etapaId, tarefaId, fotoId, valor){
  if(blockIfClient()) return;
  const {t} = findTarefa(obraId, etapaId, tarefaId);
  const foto = (t.fotos||[]).find(f=>f.id===fotoId);
  if(!foto) return;
  foto.legenda = valor.trim();
  saveDB(DB);
}
function removeFoto(obraId, etapaId, tarefaId, fotoId){

function openTarefaCalendar(obraId, etapaId, tarefaId){
  if(blockIfClient()) return;
  const {t} = findTarefa(obraId, etapaId, tarefaId);
  let startMonth;
  if(t.dates && t.dates.length){
    const [y,m] = [...t.dates].sort()[0].split('-').map(Number);
    startMonth = new Date(y, m-1, 1);
  } else {
    const now = new Date();
    startMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  }
  calState = { obraId, etapaId, tarefaId, month: startMonth };
  openModal(`<div id="tarefa-cal-root"></div>`, {sm:true});
  renderTarefaCalendar();
}
function shiftTarefaCalMonth(dir){
  calState.month = new Date(calState.month.getFullYear(), calState.month.getMonth()+dir, 1);
  renderTarefaCalendar();
}
function toggleTarefaCalDate(iso){
  if(blockIfClient()) return;
  const {t} = findTarefa(calState.obraId, calState.etapaId, calState.tarefaId);
  if(!t.dates) t.dates = [];
  const idx = t.dates.indexOf(iso);
  if(idx===-1) t.dates.push(iso); else t.dates.splice(idx,1);
  saveDB(DB);
  renderTarefaCalendar();
}
function renderTarefaCalendar(){
  const root = document.getElementById('tarefa-cal-root');
  if(!root) return;
  const obra = DB.obras.find(o=>o.id===calState.obraId);
  const {et, t} = findTarefa(calState.obraId, calState.etapaId, calState.tarefaId);
  const color = et.color || '#4B2E92';
  const year = calState.month.getFullYear(), month = calState.month.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthLabel = calState.month.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
  const dowLabels = ['D','S','T','Q','Q','S','S'];

  // Mapa data -> cores de OUTRAS tarefas da obra (para o usuário saber o que já está ocupado,
  // sem impedir repetir a data nesta tarefa).
  const outrasPorData = {};
  obra.etapas.forEach((e,i)=>{
    const c = e.color || colorForIndex(i);
    (e.tarefas||[]).forEach(ot=>{
      if(ot.id===t.id) return;
      (ot.dates||[]).forEach(iso=>{
        if(!outrasPorData[iso]) outrasPorData[iso] = [];
        outrasPorData[iso].push(c);
      });
    });
  });

  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="tcal-day tcal-empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const active = (t.dates||[]).includes(iso);
    const outras = outrasPorData[iso] || [];
    if(active){
      const fillStyle = cellFillStyle([color, ...outras]);
      cells += `<div class="tcal-day active" style="${fillStyle}" onclick="toggleTarefaCalDate('${iso}')" title="${outras.length ? 'Também usada por outra tarefa' : ''}">${d}</div>`;
    } else if(outras.length){
      cells += `<div class="tcal-day tcal-has-others" onclick="toggleTarefaCalDate('${iso}')" title="Já usada por outra tarefa — clique para marcar também nesta">${d}<span class="tcal-mini-dot" style="background:${outras[0]};"></span></div>`;
    } else {
      cells += `<div class="tcal-day" onclick="toggleTarefaCalDate('${iso}')">${d}</div>`;
    }
  }
  root.innerHTML = `
    <div class="modal-head"><h2>Datas — ${escapeHTML(t.nome)}</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="tcal-nav">
        <button type="button" class="tcal-nav-btn" onclick="shiftTarefaCalMonth(-1)">${ICONS.back}</button>
        <span class="tcal-month-label">${escapeHTML(monthLabel)}</span>
        <button type="button" class="tcal-nav-btn" onclick="shiftTarefaCalMonth(1)">${ICONS.forward}</button>
      </div>
      <div class="tcal-grid tcal-dow">${dowLabels.map(l=>`<div class="tcal-dow-label">${l}</div>`).join('')}</div>
      <div class="tcal-grid">${cells}</div>
      <div style="font-size:11.5px; color:var(--muted-2); margin-top:10px;">${(t.dates||[]).length} data${(t.dates||[]).length!==1?'s':''} selecionada${(t.dates||[]).length!==1?'s':''} · pontinho = já usada por outra tarefa</div>
    </div>
    <div class="modal-footer"><button class="btn btn-primary" onclick="closeModal(); Router.render(true);">Concluir</button></div>`;
}

/* ---------------- Calendário geral da obra (todas as tarefas, somente leitura) ---------------- */
let obraCalState = { obraId:null, month:null };
function openObraCalendario(obraId){
  const obra = DB.obras.find(o=>o.id===obraId);
  const todasDatas = (obra.etapas||[]).flatMap(e => (e.tarefas||[]).flatMap(t => t.dates || []));
  let startMonth;
  if(todasDatas.length){
    todasDatas.sort();
    const hojeIso = todayISO();
    // Prioriza o mês da próxima data agendada a partir de hoje; se já passou tudo, usa a última data marcada.
    const proxima = todasDatas.find(d => d >= hojeIso) || todasDatas[todasDatas.length-1];
    const [y,m] = proxima.split('-').map(Number);
    startMonth = new Date(y, m-1, 1);
  } else {
    const now = new Date();
    startMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  }
  obraCalState = { obraId, month: startMonth };
  openModal(`<div id="obra-cal-root"></div>`, {wide:true});
  renderObraCalendario();
}
function shiftObraCalMonth(dir){
  obraCalState.month = new Date(obraCalState.month.getFullYear(), obraCalState.month.getMonth()+dir, 1);
  renderObraCalendario();
}
function cellFillStyle(colors){
  const uniq = [...new Set(colors)];
  if(uniq.length===0) return '';
  if(uniq.length===1) return `background:${uniq[0]};`;
  const slice = 360/uniq.length;
  const stops = uniq.map((c,i)=>`${c} ${i*slice}deg ${(i+1)*slice}deg`).join(', ');
  return `background:conic-gradient(${stops});`;
}
function renderObraCalendario(){
  const root = document.getElementById('obra-cal-root');
  if(!root) return;
  const obra = DB.obras.find(o=>o.id===obraCalState.obraId);
  const year = obraCalState.month.getFullYear(), month = obraCalState.month.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthLabel = obraCalState.month.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
  const dowLabels = ['D','S','T','Q','Q','S','S'];

  // Mapa data -> lista de {nome tarefa, cor da etapa}
  const byDate = {};
  obra.etapas.forEach((e,i)=>{
    const color = e.color || colorForIndex(i);
    (e.tarefas||[]).forEach(t=>{
      (t.dates||[]).forEach(iso=>{
        if(!byDate[iso]) byDate[iso] = [];
        byDate[iso].push({nome:t.nome, etapaNome:e.nome, color});
      });
    });
  });

  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="tcal-day tcal-empty"></div>`;
  const etapasNesteMes = new Set();
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const items = byDate[iso] || [];
    items.forEach(it=>etapasNesteMes.add(it.etapaNome));
    const fillStyle = cellFillStyle(items.map(it=>it.color));
    const filledClass = items.length ? 'ocal-filled' : '';
    cells += `<div class="tcal-day ocal-day ${filledClass}" style="${fillStyle}" title="${items.map(it=>it.etapaNome+' — '+it.nome).join(', ')}">${d}</div>`;
  }

  root.innerHTML = `
    <div class="modal-head"><h2>Calendário — ${escapeHTML(obra.nome)}</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="tcal-nav">
        <button type="button" class="tcal-nav-btn" onclick="shiftObraCalMonth(-1)">${ICONS.back}</button>
        <span class="tcal-month-label">${escapeHTML(monthLabel)}</span>
        <button type="button" class="tcal-nav-btn" onclick="shiftObraCalMonth(1)">${ICONS.forward}</button>
      </div>
      <div class="tcal-grid tcal-dow">${dowLabels.map(l=>`<div class="tcal-dow-label">${l}</div>`).join('')}</div>
      <div class="tcal-grid ocal-grid">${cells}</div>
      <div class="ocal-legend">
        ${obra.etapas.map((e,i)=>({e,i})).filter(({e})=>etapasNesteMes.has(e.nome))
          .map(({e,i})=>`<span class="ocal-legend-item"><span class="ocal-dot" style="background:${e.color||colorForIndex(i)};"></span>${escapeHTML(e.nome)}</span>`).join('') || `<span style="font-size:12px; color:var(--muted-2);">Nenhuma tarefa marcada neste mês.</span>`}
      </div>
    </div>`;
}


function TabAtualizacoes(obra){
  const grouped = {};
  obra.updates.forEach(u=>{
    const key = u.data || 'sem-data';
    if(!grouped[key]) grouped[key] = [];
    grouped[key].push(u);
  });
  const days = Object.keys(grouped).sort((a,b)=> b.localeCompare(a));
  const todayIso = todayISO();

  const daysHTML = days.map((day, idx)=>{
    const entries = [...grouped[day]].reverse();
    const entriesHTML = entries.map(u=>{
      const hasPct = u.percentual!==null && u.percentual!==undefined;
      const cardClass = hasPct ? (u.percentual>=100 ? 'tag-concluido' : 'tag-progresso') : '';
      return `
      <div class="feed-item ${cardClass}">
        <div class="feed-body-full">
          <div class="feed-item-top">
            <span class="feed-item-etapa">${u.etapaNome ? escapeHTML(u.etapaNome) : 'Atualização geral'}</span>
            <span class="feed-item-date">${fmtDate(u.data)}</span>
          </div>
          <div class="feed-text">${escapeHTML(u.texto)}</div>
          ${hasPct ? `<div class="feed-pct-badge">${ICONS.check.replace('width="24" height="24"','width="12" height="12"')} ${u.percentual}% concluído</div>` : ''}
        </div>
      </div>`;
    }).join('');
    const dayLabel = day===todayIso ? `Hoje · ${fmtDate(day)}` : (day==='sem-data' ? 'Sem data' : fmtDate(day));
    return `
      <details class="feed-day" ${idx<2?'open':''}>
        <summary class="feed-day-summary">
          <span class="feed-day-caret">${ICONS.down}</span>
          <span class="feed-day-date">${escapeHTML(dayLabel)}</span>
          <span class="feed-day-count">${entries.length} atualização${entries.length!==1?'ões':''}</span>
        </summary>
        <div class="feed-day-body">${entriesHTML}</div>
      </details>`;
  }).join('') || `<div style="padding:30px 0; text-align:center; color:var(--muted-2); font-size:13.5px;">Nenhuma atualização registrada ainda. A equipe de campo pode postar o andamento aqui.</div>`;

  const tarefaOpts = obra.etapas.flatMap(e=>(e.tarefas||[]).map(t=>
    `<option value="${escapeAttr(t.id)}">${escapeHTML(e.nome)} — ${escapeHTML(t.nome)}</option>`
  )).join('');

  return `
    <div class="feed-composer feed-composer-updates">
      <div class="feed-composer-row">
        <div class="feed-avatar" id="composer-avatar">--</div>
        <textarea id="update-text" placeholder="Descreva o que foi feito em campo hoje..."></textarea>
      </div>
      <div class="feed-composer-footer">
        <div class="feed-composer-opts">
          <input type="date" id="update-data" value="${todayISO()}" max="${todayISO()}" title="Data em que a tarefa foi realizada" style="padding:8px 10px; border-radius:9px; border:1.5px solid var(--border); font-size:12.5px; background:var(--surface-2); font-family:var(--font-body); color:var(--ink);">
          <select id="update-etapa" style="padding:8px 10px; border-radius:9px; border:1.5px solid var(--border); font-size:12.5px; background:var(--surface-2);">
            <option value="">Sem tarefa vinculada</option>
            ${tarefaOpts}
          </select>
          <div class="pct-input-wrap">% <input type="number" id="update-pct" min="0" max="100" placeholder="—"></div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="submitUpdate('${obra.id}')">Publicar Atualização</button>
      </div>
    </div>
    <div class="panel-card feed-days-wrap">${daysHTML}</div>
  `;
}
function recalcTarefaFromUpdates(obra, tarefaId){
  let tarefa = null;
  obra.etapas.forEach(e=>{ const f = (e.tarefas||[]).find(t=>t.id===tarefaId); if(f) tarefa = f; });
  if(!tarefa) return;
  const relevant = obra.updates.filter(u =>
    u.etapaId === tarefaId && u.percentual !== null && u.percentual !== undefined
  );
  if(relevant.length === 0) return;
  // Ordena por data (o array já preserva a ordem de publicação — sort é estável,
  // então em caso de empate na data, vale a atualização publicada por último).
  const sorted = [...relevant].sort((a,b) => (a.data < b.data ? -1 : (a.data > b.data ? 1 : 0)));
  const winner = sorted[sorted.length - 1];
  tarefa.percentual = winner.percentual;
}

function submitUpdate(obraId){
  if(blockIfClient()) return;
  const texto = document.getElementById('update-text').value.trim();
  if(!texto){ toast('Escreva uma atualização antes de publicar'); return; }
  const obra = DB.obras.find(o=>o.id===obraId);
  const tarefaId = document.getElementById('update-etapa').value;
  const pctVal = document.getElementById('update-pct').value;
  const dataTarefa = document.getElementById('update-data').value || todayISO();
  const session = getSession();
  let tarefa = null, etapaNome = null;
  obra.etapas.forEach(e=>{ const f = (e.tarefas||[]).find(t=>t.id===tarefaId); if(f){ tarefa = f; etapaNome = e.nome; } });
  const percentual = (tarefa && pctVal!=='') ? Math.max(0, Math.min(100, parseInt(pctVal,10))) : null;
  obra.updates.push({
    id: uid('upd'), autor: session.nome, data: dataTarefa, texto,
    etapaId: tarefa ? tarefa.id : null, etapaNome: tarefa ? (etapaNome+' — '+tarefa.nome) : null, percentual
  });
  if(tarefa && percentual !== null){ recalcTarefaFromUpdates(obra, tarefa.id); }
  saveDB(DB); toast('Atualização publicada'); Router.render(true);
}

function submitDoc(obraId){
  if(blockIfClient()) return;

function removeDoc(obraId, idx){
  if(blockIfClient()) return;
  const obra = DB.obras.find(o=>o.id===obraId);

  confirmDialog('Remover documento?', `Isso vai remover "${doc?doc.nome:'este documento'}" da lista. Esta ação não pode ser desfeita.`, ()=>{
    obra.documentos.splice(idx,1); saveDB(DB); toast('Documento removido'); Router.render(true);
  });
}

/* ============================================================
   EXCEL EXPORT (via ExcelJS — gera .xlsx com Gantt colorido por
   etapa, logo da AgaSense, aba Resumo com fórmulas, Atualizações
   de Campo e Documentos. Roda inteiramente no navegador.
   ============================================================ */
function slugify(str){
  return (str||'obra').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase().slice(0,60) || 'obra';
}
async function exportExcel(obraId){
  if(typeof ExcelJS === 'undefined'){ toast('Não foi possível carregar o módulo de Excel (sem conexão?)'); return; }
  const obra = DB.obras.find(o=>o.id===obraId);
  const client = DB.clients.find(c=>c.id===obra.clientId);
  toast('Gerando Excel...');

  const wb = new ExcelJS.Workbook();
  const PURPLE_DEEP = '3B1F7A', PURPLE = '4B2E92', BLUE = '2AA9E0', INK = '181233', MUTED = '6B7280';
  const argb = (hex) => 'FF' + hex.toUpperCase().replace('#','');
  const fill = (hex) => ({type:'pattern', pattern:'solid', fgColor:{argb: argb(hex)}});
  const tint = (hex, amt=0.85) => {
    hex = hex.replace('#','');
    const r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);
    const nr = Math.round(r + (255-r)*amt), ng = Math.round(g + (255-g)*amt), nb = Math.round(b + (255-b)*amt);
    return [nr,ng,nb].map(v=>v.toString(16).padStart(2,'0')).join('');
  };
  const isoAdd = (iso,n) => { const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
  const THIN = {style:'thin', color:{argb:argb('D9DEE8')}};
  const BORDER = {top:THIN, bottom:THIN, left:THIN, right:THIN};

  // Coleta todas as datas marcadas pra definir o período do Gantt
  const todasDatas = obra.etapas.flatMap(e => (e.tarefas||[]).flatMap(t => t.dates || []));
  let periodoIni = obra.dataInicio, periodoFim = obra.prazoFinal;
  if(todasDatas.length){
    const sorted = [...todasDatas].sort();
    if(!periodoIni || sorted[0] < periodoIni) periodoIni = sorted[0];
    if(!periodoFim || sorted[sorted.length-1] > periodoFim) periodoFim = sorted[sorted.length-1];
  }
  if(!periodoIni) periodoIni = todayISO();
  if(!periodoFim) periodoFim = isoAdd(periodoIni, 30);
  const dias = [];
  for(let d=periodoIni; d<=periodoFim; d=isoAdd(d,1)) dias.push(d);

  const FIRST_DAY_COL = 8;
  const lastDayCol = FIRST_DAY_COL + dias.length - 1;
  const HEADER_ROW = 8;
  const FIRST_DATA_ROW = HEADER_ROW + 1;
  const nTarefas = obra.etapas.reduce((a,e)=>a+(e.tarefas||[]).length, 0);
  const lastDataRow = FIRST_DATA_ROW + Math.max(nTarefas,1) - 1;

  // ================= ABA CRONOGRAMA (Gantt) =================
  const ws = wb.addWorksheet('Cronograma', {views:[{showGridLines:false, state:'frozen', xSplit:6, ySplit:FIRST_DATA_ROW-1}]});

  ws.mergeCells(1,1,4,6);
  for(let r=1;r<=4;r++) for(let c=1;c<=6;c++) ws.getCell(r,c).fill = fill('FFFFFF');
  if(typeof AGASENSE_LOGO_B64 !== 'undefined' && AGASENSE_LOGO_B64){
    try{
      const imgId = wb.addImage({base64: AGASENSE_LOGO_B64, extension:'png'});
      const logoW = 230, logoH = 230*(318/1113);
      // Centraliza a logo de verdade dentro da área branca (colunas A–F, linhas 1–4),
      // calculando a posição a partir da largura real de cada coluna e altura real de cada linha.
      const headerColsPx = [16,28,11,11,12,10].map(w => w * 7); // precisa bater com as larguras reais das colunas A–F definidas mais abaixo
      const totalW = headerColsPx.reduce((a,b)=>a+b,0);
      const leftPx = Math.max(0, (totalW - logoW) / 2);
      let cum = 0, colOffset = 0;
      for(let i=0; i<headerColsPx.length; i++){
        if(cum + headerColsPx[i] >= leftPx){ colOffset = i + (leftPx-cum)/headerColsPx[i]; break; }
        cum += headerColsPx[i];
      }
      const headerRowsPt = [8,30,30,8];
      const totalHpx = headerRowsPt.reduce((a,b)=>a+b,0) * 1.333;
      const topPx = Math.max(0, (totalHpx - logoH) / 2);
      const topPt = topPx / 1.333;
      let cumR = 0, rowOffset = 0;
      for(let i=0; i<headerRowsPt.length; i++){
        if(cumR + headerRowsPt[i] >= topPt){ rowOffset = i + (topPt-cumR)/headerRowsPt[i]; break; }
        cumR += headerRowsPt[i];
      }
      ws.addImage(imgId, {tl:{col:colOffset, row:rowOffset}, ext:{width:logoW, height:logoH}});
    }catch(e){ /* segue sem logo se algo falhar */ }
  }
  // Preenche o roxo em toda a largura dos dias (visual contínuo)...
  for(let r=1;r<=4;r++) for(let c=7;c<=lastDayCol;c++) ws.getCell(r,c).fill = fill(PURPLE);
  // ...mas mescla o TÍTULO só numa faixa fixa e pequena logo no início, pra ele
  // aparecer inteiro e centralizado sem precisar rolar a tela pros lados (o período
  // de dias pode ser bem mais largo que isso, e centralizar em tudo cortava o texto).
  const titleEndCol = Math.min(lastDayCol, 7 + 11); // até 12 colunas de largura
  ws.mergeCells(2,7,3,titleEndCol);
  const titleCell = ws.getCell(2,7);
  titleCell.value = 'CRONOGRAMA DE EXECUÇÃO';
  titleCell.font = {name:'Arial', size:16, bold:true, color:{argb:argb('FFFFFF')}};
  titleCell.alignment = {vertical:'middle', horizontal:'center', wrapText:true};
  // Separador vertical bem visível entre a área da logo (branca) e a do título (roxa)
  for(let r=1;r<=4;r++) ws.getCell(r,6).border = {right:{style:'medium', color:{argb:argb(PURPLE_DEEP)}}};
  ws.getRow(1).height = 8; ws.getRow(2).height = 30; ws.getRow(3).height = 30; ws.getRow(4).height = 8;

  ws.mergeCells(5,1,5,lastDayCol);
  const infoCell = ws.getCell(5,1);
  infoCell.value = `Cliente: ${(client.nome||'').toUpperCase()}   ·   Serviço: ${obra.nome}   ·   Endereço: ${obra.endereco||''}${obra.numero?(', nº '+obra.numero):''}`;
  infoCell.font = {name:'Arial', size:10.5, color:{argb:argb(MUTED)}};
  ws.getRow(5).height = 18;

  ws.getCell(6,1).value = 'PERÍODO';
  ws.getCell(6,1).font = {name:'Arial', size:10, bold:true, color:{argb:argb(PURPLE)}};
  ws.mergeCells(6,2,6,4);
  const perCell = ws.getCell(6,2);
  perCell.value = `${fmtDate(periodoIni)}  A  ${fmtDate(periodoFim)}`;
  perCell.font = {name:'Arial', size:10.5, bold:true, color:{argb:argb(INK)}};
  ws.getCell(6,5).value = 'PROGRESSO';
  ws.getCell(6,5).font = {name:'Arial', size:9.5, bold:true, color:{argb:argb(PURPLE)}};
  const progCell = ws.getCell(6,6);
  progCell.value = { formula: `AVERAGE(F${FIRST_DATA_ROW}:F${lastDataRow})` };
  progCell.numFmt = '0%';
  progCell.font = {name:'Arial', size:12, bold:true, color:{argb:argb(PURPLE_DEEP)}};
  ws.getRow(6).height = 18;

  const headers = ['Etapa','Tarefa','Início','Término','Dias Marcados','% Concluído','Status'];
  headers.forEach((h,i)=>{
    const c = ws.getCell(HEADER_ROW, i+1);
    c.value = h; c.font = {name:'Arial', size:10, bold:true, color:{argb:argb('FFFFFF')}};
    c.fill = fill(PURPLE_DEEP);
    c.alignment = {vertical:'middle', horizontal:'center', wrapText:true};
  });
  dias.forEach((d,i)=>{
    const col = FIRST_DAY_COL+i;
    const dow = new Date(d+'T00:00:00').getDay();
    const c = ws.getCell(HEADER_ROW, col);
    const [,m,dd] = d.split('-');
    c.value = `${dd}/${m}`;
    c.font = {name:'Arial', size:8, bold:true, color:{argb:argb('FFFFFF')}};
    c.fill = fill(dow>=1 && dow<=5 ? PURPLE_DEEP : PURPLE);
    c.alignment = {vertical:'middle', horizontal:'center', textRotation:90};
  });
  ws.getRow(HEADER_ROW).height = 46;

  let row = FIRST_DATA_ROW;
  if(nTarefas === 0){
    ws.getCell(row,1).value = 'Nenhuma etapa/tarefa cadastrada ainda';
    ws.getCell(row,1).font = {name:'Arial', size:10, italic:true, color:{argb:argb(MUTED)}};
  }
  for(const e of obra.etapas){
    const cor = (e.color || '#4B2E92').replace('#','');
    const areaFill = fill(tint(cor, 0.82));
    for(const t of (e.tarefas||[])){
      const marcadas = [...(t.dates||[])].sort();
      ws.getCell(row,1).value = e.nome; ws.getCell(row,1).fill = areaFill;
      ws.getCell(row,2).value = t.nome;
      ws.getCell(row,3).value = marcadas.length ? new Date(marcadas[0]+'T00:00:00') : null;
      ws.getCell(row,3).numFmt = 'dd/mm/yyyy';
      ws.getCell(row,4).value = marcadas.length ? new Date(marcadas[marcadas.length-1]+'T00:00:00') : null;
      ws.getCell(row,4).numFmt = 'dd/mm/yyyy';
      const colLetraIni = ws.getColumn(FIRST_DAY_COL).letter;
      const colLetraFim = ws.getColumn(lastDayCol).letter;
      ws.getCell(row,5).value = dias.length ? { formula: `COUNTIF(${colLetraIni}${row}:${colLetraFim}${row},"●")` } : 0;
      const pctCell = ws.getCell(row,6);
      pctCell.value = (t.percentual||0)/100; pctCell.numFmt = '0%';
      const statusCell = ws.getCell(row,7);
      statusCell.value = { formula: `IF(F${row}>=1,"Concluído",IF(F${row}>0,"Em andamento","Pendente"))` };
      statusCell.alignment = {horizontal:'center'};

      dias.forEach((d,i)=>{
        const col = FIRST_DAY_COL+i;
        const c = ws.getCell(row,col);
        const dow = new Date(d+'T00:00:00').getDay();
        if(marcadas.includes(d)){
          c.value = '●';
          c.fill = fill(cor);
          c.font = {name:'Calibri', size:9, bold:true, color:{argb:argb(cor)}};
        } else {
          c.fill = fill(dow>=1 && dow<=5 ? 'FAFBFC' : 'F0F2F6');
        }
        c.alignment = {horizontal:'center'};
      });
      for(let col=1; col<=7; col++){
        const c = ws.getCell(row,col);
        if(col!==1) c.font = c.font || {name:'Arial', size:10, color:{argb:argb(INK)}};
        c.border = BORDER;
      }
      row++;
    }
  }

  if(nTarefas > 0){
    ws.addConditionalFormatting({
      ref: `G${FIRST_DATA_ROW}:G${lastDataRow}`,
      rules: [
        {type:'expression', formulae:[`$G${FIRST_DATA_ROW}="Concluído"`], style:{fill:fill('E7F8F1'), font:{color:{argb:argb('0F8A5F')}, bold:true}}, priority:1},
        {type:'expression', formulae:[`$G${FIRST_DATA_ROW}="Em andamento"`], style:{fill:fill('FCF1DF'), font:{color:{argb:argb('B5730D')}, bold:true}}, priority:2},
        {type:'expression', formulae:[`$G${FIRST_DATA_ROW}="Pendente"`], style:{fill:fill('F1F3F6'), font:{color:{argb:argb('6B7280')}}}, priority:3},
      ]
    });
  }

  let legRow = lastDataRow + 3;
  ws.getCell(legRow,1).value = 'Legenda das etapas';
  ws.getCell(legRow,1).font = {name:'Arial', size:10.5, bold:true, color:{argb:argb(INK)}};
  obra.etapas.forEach((e,i)=>{
    const r = legRow+1+i;
    ws.getCell(r,1).fill = fill((e.color||'#4B2E92').replace('#',''));
    ws.getCell(r,2).value = e.nome;
    ws.getCell(r,2).font = {name:'Arial', size:9.5, color:{argb:argb(INK)}};
  });

  ws.getColumn(1).width = 16; ws.getColumn(2).width = 28;
  ws.getColumn(3).width = 11; ws.getColumn(4).width = 11;
  ws.getColumn(5).width = 12; ws.getColumn(6).width = 10; ws.getColumn(7).width = 13;
  for(let i=0;i<dias.length;i++) ws.getColumn(FIRST_DAY_COL+i).width = 3.4;

  // ================= ABA RESUMO =================
  const ws2 = wb.addWorksheet('Resumo', {views:[{showGridLines:false}]});
  ws2.mergeCells(1,1,1,6);
  const t1 = ws2.getCell(1,1);
  t1.value = `${(client.nome||'').toUpperCase()} · ${obra.nome.toUpperCase()} — PAINEL DE ACOMPANHAMENTO`;
  t1.font = {name:'Arial', size:13, bold:true, color:{argb:argb('FFFFFF')}};
  t1.alignment = {vertical:'middle'};
  for(let c=1;c<=6;c++) ws2.getCell(1,c).fill = fill(PURPLE_DEEP);
  ws2.getRow(1).height = 26;

  const headers2 = ['Início do Projeto','Término do Projeto','Total de Tarefas','Tarefas Executadas','Progresso Geral'];
  headers2.forEach((h,i)=>{
    const col = i+1;
    if(col===5) ws2.mergeCells(3,5,3,6); // "Progresso Geral" ocupa as 2 últimas colunas, pra fechar rente à borda da tabela de baixo
    const c = ws2.getCell(3,col);
    c.value = h; c.font = {name:'Arial', size:9.5, bold:true, color:{argb:argb('FFFFFF')}};
    c.fill = fill(PURPLE); c.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
    if(col===5) ws2.getCell(3,6).fill = fill(PURPLE);
  });
  ws2.getRow(3).height = 28;
  if(nTarefas > 0){
    ws2.getCell(4,1).value = { formula: `MIN(Cronograma!C${FIRST_DATA_ROW}:C${lastDataRow})` }; ws2.getCell(4,1).numFmt = 'dd/mm/yyyy';
    ws2.getCell(4,2).value = { formula: `MAX(Cronograma!D${FIRST_DATA_ROW}:D${lastDataRow})` }; ws2.getCell(4,2).numFmt = 'dd/mm/yyyy';
    ws2.getCell(4,3).value = { formula: `COUNTA(Cronograma!B${FIRST_DATA_ROW}:B${lastDataRow})` };
    ws2.getCell(4,4).value = { formula: `COUNTIF(Cronograma!F${FIRST_DATA_ROW}:F${lastDataRow},">=1")` };
    ws2.mergeCells(4,5,4,6);
    const pg = ws2.getCell(4,5); pg.value = { formula: `AVERAGE(Cronograma!F${FIRST_DATA_ROW}:F${lastDataRow})` }; pg.numFmt = '0%';
  }
  for(let c=1;c<=6;c++){ const cc = ws2.getCell(4,c); cc.font = {name:'Arial', size:12, bold:true, color:{argb:argb(PURPLE_DEEP)}}; cc.alignment = {horizontal:'center', vertical:'middle'}; }
  ws2.getRow(4).height = 24;

  const HR2 = 6;
  ['Etapa','Tarefas','Início','Término','Progresso','Status'].forEach((h,i)=>{
    const c = ws2.getCell(HR2,i+1);
    c.value = h; c.font = {name:'Arial', size:10, bold:true, color:{argb:argb('FFFFFF')}};
    c.fill = fill(PURPLE_DEEP); c.alignment = {horizontal:'center', vertical:'middle'};
  });
  let r2 = HR2+1;
  row = FIRST_DATA_ROW;
  for(const e of obra.etapas){
    const n = (e.tarefas||[]).length;
    if(n===0) continue;
    const rIni = row, rFim = row + n - 1;
    ws2.getCell(r2,1).value = e.nome; ws2.getCell(r2,1).fill = fill(tint((e.color||'#4B2E92').replace('#',''),0.82));
    ws2.getCell(r2,2).value = { formula: `COUNTA(Cronograma!B${rIni}:B${rFim})` };
    ws2.getCell(r2,3).value = { formula: `MIN(Cronograma!C${rIni}:C${rFim})` }; ws2.getCell(r2,3).numFmt='dd/mm/yyyy';
    ws2.getCell(r2,4).value = { formula: `MAX(Cronograma!D${rIni}:D${rFim})` }; ws2.getCell(r2,4).numFmt='dd/mm/yyyy';
    const pc = ws2.getCell(r2,5); pc.value = { formula: `AVERAGE(Cronograma!F${rIni}:F${rFim})` }; pc.numFmt='0%';
    ws2.getCell(r2,6).value = { formula: `IF(E${r2}>=1,"Concluído",IF(E${r2}>0,"Em andamento","Pendente"))` };
    for(let c=1;c<=6;c++){ ws2.getCell(r2,c).font = {name:'Arial', size:10, color:{argb:argb(INK)}}; ws2.getCell(r2,c).alignment = {horizontal: c===1?'left':'center'}; }
    r2++; row = rFim+1;
  }
  const lastResumoRow = r2 - 1;
  if(lastResumoRow >= HR2+1){
    ws2.addConditionalFormatting({
      ref: `F${HR2+1}:F${lastResumoRow}`,
      rules: [
        {type:'expression', formulae:[`$F${HR2+1}="Concluído"`], style:{fill:fill('E7F8F1'), font:{color:{argb:argb('0F8A5F')}, bold:true}}, priority:1},
        {type:'expression', formulae:[`$F${HR2+1}="Em andamento"`], style:{fill:fill('FCF1DF'), font:{color:{argb:argb('B5730D')}, bold:true}}, priority:2},
        {type:'expression', formulae:[`$F${HR2+1}="Pendente"`], style:{fill:fill('F1F3F6'), font:{color:{argb:argb('6B7280')}}}, priority:3},
      ]
    });
  }
  ws2.getColumn(1).width = 20;
  for(const col of [2,3,4,5,6]) ws2.getColumn(col).width = 15;
  wb.views = [{firstSheet:0, activeTab:1}]; // abre direto na aba Resumo

  // ================= ABA ATUALIZAÇÕES DE CAMPO (mantida do export anterior) =================
  const ws3 = wb.addWorksheet('Atualizações de Campo');
  const updHeader = ["Data","Autor","Tarefa Vinculada","% Tarefa","Descrição da Atualização"];
  updHeader.forEach((h,i)=>{ const c = ws3.getCell(1,i+1); c.value=h; c.font={bold:true, color:{argb:argb('FFFFFF')}}; c.fill=fill(PURPLE_DEEP); });
  let ur = 2;
  [...obra.updates].reverse().forEach(u=>{
    ws3.getCell(ur,1).value = u.data?fmtDate(u.data):""; 
    ws3.getCell(ur,2).value = u.autor||"";
    ws3.getCell(ur,3).value = u.etapaNome||"";
    const pc = ws3.getCell(ur,4); if(u.percentual!=null){ pc.value = u.percentual/100; pc.numFmt='0%'; }
    ws3.getCell(ur,5).value = u.texto||"";
    ur++;
  });
  ws3.getColumn(1).width=12; ws3.getColumn(2).width=20; ws3.getColumn(3).width=40; ws3.getColumn(4).width=10; ws3.getColumn(5).width=60;
  ws3.getColumn(3).alignment = {wrapText:false};

  // Comentários do Gestor propositalmente NÃO entram no Excel — são conversa interna
  // (gestor ↔ equipe), e o arquivo pode circular até o cliente. Fica só dentro do sistema.

  // ================= ABA DOCUMENTOS (mantida) =================
  const ws5 = wb.addWorksheet('Documentos');
  ["Nome do Documento","Link / Referência","Data"].forEach((h,i)=>{ const c=ws5.getCell(1,i+1); c.value=h; c.font={bold:true, color:{argb:argb('FFFFFF')}}; c.fill=fill(PURPLE_DEEP); });
  let dr = 2;
  (obra.documentos||[]).forEach(d=>{
    ws5.getCell(dr,1).value = d.nome||"";
    ws5.getCell(dr,2).value = d.url||"";
    ws5.getCell(dr,3).value = d.data?fmtDate(d.data):"";
    dr++;
  });
  ws5.getColumn(1).width=30; ws5.getColumn(2).width=46; ws5.getColumn(3).width=14;

  // ================= GERA E BAIXA O ARQUIVO =================
  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const filename = `${slugify(client.nome)}-${slugify(obra.nome)}.xlsx`;
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Excel exportado');
}

/* Quando a pessoa clica no link do e-mail de recuperação, o Supabase volta pra cá
   com um token especial no endereço. Detectamos isso e pedimos a senha nova. */
function abrirDefinirNovaSenhaSeNecessario(){
  const hash = window.location.hash || '';
  if(!hash.includes('type=recovery')) return;
  const html = `
    <div class="modal-head"><h2>Criar nova senha</h2></div>
    <div class="modal-body">
      <p style="font-size:13.5px; line-height:1.6; color:var(--ink); margin-bottom:14px;">
        Digite sua nova senha de acesso.
      </p>
      <div class="field">
        <label>Nova senha</label>
        <input type="password" id="nova-senha-input" placeholder="Mínimo 6 caracteres">
      </div>
      <div id="nova-senha-msg" class="hidden" style="font-size:12.5px; margin-top:-8px;"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary btn-block" id="nova-senha-btn">Salvar nova senha</button>
    </div>`;
  openModal(html);
  document.getElementById('nova-senha-btn').addEventListener('click', async ()=>{
    const novaSenha = document.getElementById('nova-senha-input').value;
    const msgEl = document.getElementById('nova-senha-msg');
    const btn = document.getElementById('nova-senha-btn');
    if(!novaSenha || novaSenha.length < 6){
      msgEl.textContent = 'A senha precisa ter pelo menos 6 caracteres.';
      msgEl.style.color = 'var(--danger)';
      msgEl.classList.remove('hidden');
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Salvando...';
    try{
      const { error } = await supabaseClient.auth.updateUser({ password: novaSenha });
      if(error) throw error;
      history.replaceState(null, '', window.location.pathname);
      closeModal();
      toast('Senha atualizada! Faça login com a senha nova.');
      await supabaseClient.auth.signOut();
    } catch(err){
      console.error(err);
      msgEl.textContent = 'Não foi possível salvar. O link pode ter expirado — solicite outro em "Esqueci minha senha".';
      msgEl.style.color = 'var(--danger)';
      msgEl.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Salvar nova senha';
    }
  });
}
abrirDefinirNovaSenhaSeNecessario();

document.getElementById('login-form').addEventListener('submit', async function(e){
  e.preventDefault();
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  const btnEntrar = document.getElementById('login-form').querySelector('button[type="submit"]');
  errEl.classList.add('hidden');
  if(btnEntrar){ btnEntrar.disabled = true; btnEntrar.textContent = 'Entrando...'; }

  try{
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email: user, password: pass });
    if(error || !data.user){
      errEl.textContent = 'E-mail ou senha inválidos.';
      errEl.classList.remove('hidden');
      return;
    }

    const { data: perfil, error: erroPerfil } = await supabaseClient
      .from('profiles')
      .select('*, empresas(nome)')
      .eq('id', data.user.id)
      .single();

    if(erroPerfil || !perfil){
      errEl.textContent = 'Login ok, mas não encontramos seu perfil vinculado a uma empresa. Fale com o suporte.';
      errEl.classList.remove('hidden');
      await supabaseClient.auth.signOut();
      return;
    }

    // Mapeia o "papel" do banco novo para o "role" que o resto do sistema já usa
    const MAPA_PAPEL_PARA_ROLE = { administrador:'responsavel', campo:'usuario', cliente:'cliente' };
    const roleInterno = MAPA_PAPEL_PARA_ROLE[perfil.papel] || perfil.papel;

    if(perfil.papel === 'cliente'){
      const { data: clienteRow } = await supabaseClient
        .from('clientes')
        .select('*')
        .eq('profile_id', data.user.id)
        .single();
      const clientSession = {
        id: 'client_' + (clienteRow ? clienteRow.id : perfil.id),
        nome: perfil.nome,
        role: 'cliente',
        clientId: clienteRow ? clienteRow.id : null,
        empresaId: perfil.empresa_id
      };
      setSession(clientSession);
      enterApp(clientSession);
      return;
    }

    const found = { id: perfil.id, nome: perfil.nome, role: roleInterno, empresaId: perfil.empresa_id };
    if(roleInterno === 'usuario'){
      // Só pergunta "Quem é você?" pra Equipe de Campo — é a única conta usada por várias pessoas diferentes.
      openWhoAreYouModal(found);
    } else {
      setSession(found);
      enterApp(found);
    }
  } catch(err){
    console.error(err);
    errEl.textContent = 'Não foi possível conectar. Verifique sua internet e tente de novo.';
    errEl.classList.remove('hidden');
  } finally {
    if(btnEntrar){ btnEntrar.disabled = false; btnEntrar.textContent = 'Entrar'; }
  }
});

// Pergunta "Quem é você?" só depois de já saber que a conta é compartilhada
// (Administrador ou Equipe de Campo) — nunca aparece pro cliente.
function openWhoAreYouModal(found){
  let lastName = '';
  try{ lastName = localStorage.getItem('agasense_last_name') || ''; }catch(e){}
  const html = `
    <div class="modal-head"><h2>Quem é você?</h2></div>
    <div class="modal-body">
      <p style="font-size:13.5px; color:var(--muted); margin-bottom:16px;">
        Você entrou como <b style="color:var(--ink);">Equipe de Campo</b> — conta compartilhada entre os técnicos.
        Digite seu nome pra ele aparecer nas atualizações de campo e nas exportações.
      </p>
      <div class="field">
        <label>Seu nome</label>
        <input type="text" id="whoami-nome" placeholder="Ex: Marcos" autocomplete="name" value="${escapeAttr(lastName)}">
      </div>
      <div id="whoami-erro" class="hidden" style="font-size:12.5px; color:var(--danger); margin-top:-8px;">Digite seu nome pra continuar — é assim que a gente sabe quem fez cada atualização.</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary btn-block" id="whoami-continuar">Continuar</button>
    </div>`;
  openModal(html);
  setTimeout(()=>{
    const input = document.getElementById('whoami-nome');
    if(input){ input.focus(); input.select(); }
  }, 60);
  const finish = () => {
    const nomeDigitado = (document.getElementById('whoami-nome').value || '').trim();
    if(!nomeDigitado){
      document.getElementById('whoami-erro').classList.remove('hidden');
      document.getElementById('whoami-nome').focus();
      return;
    }
    const sessionUser = {...found, nome: nomeDigitado};
    try{ localStorage.setItem('agasense_last_name', nomeDigitado); }catch(e){}
    closeModal();
    setSession(sessionUser);
    enterApp(sessionUser);
  };
  document.getElementById('whoami-continuar').addEventListener('click', finish);
  document.getElementById('whoami-nome').addEventListener('keydown', (ev)=>{ if(ev.key==='Enter'){ ev.preventDefault(); finish(); } });
}

function enterApp(user){
  document.getElementById('screen-welcome').classList.add('hidden');
  document.getElementById('screen-login').classList.add('hidden');
  document.getElementById('app-shell').classList.remove('hidden');
  document.getElementById('user-avatar').textContent = initials(user.nome);
  document.getElementById('user-pill-name').textContent = user.nome;
  const isClient = user.role === 'cliente';
  const isCampo = user.role === 'usuario';
  document.getElementById('user-pill-role').textContent = isClient ? 'Cliente' : (user.role==='responsavel' ? 'Responsável' : 'Usuário de Campo');
  document.body.classList.toggle('client-mode', isClient);
  document.body.classList.toggle('campo-mode', isCampo);
  Router.goHome();
}

/* ---------------- Vinheta: liga/desliga fácil ----------------
   Por enquanto desativada — o sistema abre direto na tela de login/cadastro,
   como um software comum. Pra reativar a vinheta em vídeo no futuro, troque
   para true: nada mais precisa ser alterado. */
const VINHETA_ATIVADA = false;

function playIntroThenLogin(){
  const introEl = document.getElementById('screen-welcome');
  const loginScreen = document.getElementById('screen-login');
  if(!VINHETA_ATIVADA || !introEl){
    if(introEl) introEl.classList.add('hidden');
    if(loginScreen) loginScreen.classList.remove('hidden');
    return;
  }
  loginScreen.classList.add('hidden');
  introEl.classList.remove('hidden', 'fade-out');
  const video = document.getElementById('vinheta-video');
  if(video){
    video.currentTime = 0;
    video.muted = true;
    const btnSom = document.getElementById('btn-toggle-som');
    if(btnSom){ btnSom.innerHTML = ICONE_SOM_MUDO; btnSom.title = 'Ativar som'; }
    video.play().catch(()=>{});
  }
  irParaLoginQuandoVinhetaTerminar(introEl, loginScreen);
}

const ICONE_SOM_MUDO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';
const ICONE_SOM_LIGADO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>';
(function(){

/* Vinheta: o vídeo dura 8s e depois segura mais 2s no último frame antes de ir
   pro login (total 10s). Tem um tempo máximo de segurança, caso o autoplay
   seja bloqueado pelo navegador. */
function irParaLoginQuandoVinhetaTerminar(introEl, loginScreen){
  const video = document.getElementById('vinheta-video');
  let jaFoi = false;
  function goToLogin(){
    if(jaFoi || introEl.classList.contains('fade-out')) return;
    jaFoi = true;
    introEl.classList.add('fade-out');
    setTimeout(()=>{
      introEl.classList.add('hidden');
      if(loginScreen) loginScreen.classList.remove('hidden');
    }, 500);
  }
  if(video){
    video.addEventListener('ended', ()=> setTimeout(goToLogin, 2000), { once:true });
    // segurança: se o navegador bloquear o autoplay, não trava o usuário esperando
    setTimeout(goToLogin, 10000);
  } else {
    setTimeout(goToLogin, 10000);
  }
}

(function introSequence(){
  const introEl = document.getElementById('screen-welcome');
  if(!introEl) return;
  let hasSession = false;
  try{ hasSession = !!getSession(); }catch(e){}
  if(hasSession){ introEl.classList.add('hidden'); return; }
  const loginScreen = document.getElementById('screen-login');
  if(!VINHETA_ATIVADA){
    introEl.classList.add('hidden');
    if(loginScreen) loginScreen.classList.remove('hidden');
    return;
  }
  // A vinheta toca toda vez que alguém for logar (sempre que não há sessão ativa) —
  // não fica marcada como "já vista", pra aparecer de novo a cada login.
  irParaLoginQuandoVinhetaTerminar(introEl, loginScreen);
})();

/* ---------------- PWA: registro do service worker ---------------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch((err) => {
      console.warn('Service worker não registrado:', err);
    });
  });
}

/* ---------------- Boot ---------------- */
(function boot(){
  const session = getSession();
  if(!session) return;
  if(session.role === 'cliente'){
    const stillExists = DB.clients.find(c=>c.id===session.clientId);
    if(stillExists) enterApp(session);
  } else {
    const stillExists = DB.users.find(u=>u.id===session.id);
    if(stillExists) enterApp(stillExists);
  }
})();

</script>
