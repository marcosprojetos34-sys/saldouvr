<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SaldouVR">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F6F1E4">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">

<title>SaldouVR — Controle de VR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F6F1E4;
    --paper-light: #FCFAF3;
    --paper-dark: #EDE6D2;
    --ink: #21261F;
    --ink-soft: #565C4E;
    --stamp-green: #1F6F4C;
    --stamp-green-dark: #17553A;
    --stamp-red: #A6362B;
    --mustard: #C68A2C;
    --line: #D9D0B8;
    --shadow: 0 1px 0 rgba(33,38,31,0.06), 0 8px 20px -12px rgba(33,38,31,0.25);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{ min-height:100%; }
  body{
    background: var(--paper);
    background-image:
      radial-gradient(circle at 10% 5%, rgba(0,0,0,0.02) 0%, transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(0,0,0,0.02) 0%, transparent 40%);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  input, select{ font-size: 16px !important; min-width: 0; }
  .app{ width:100%; max-width: 440px; padding: max(18px, env(safe-area-inset-top)) 16px 0; padding-bottom: calc(100px + env(safe-area-inset-bottom)); }
  h1,h2,h3,.display{ font-family:'Space Grotesk', sans-serif; }
  button{ font-family: inherit; }

  /* TOPBAR */
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:2px; }
  .hamburger-btn, .icon-btn{
    width:34px; height:34px; border-radius:9px;
    border:1px solid var(--line); background: var(--paper-light);
    cursor:pointer; font-size:16px; color: var(--ink-soft);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .hamburger-btn:hover, .icon-btn:hover{ color: var(--ink); background: var(--paper-dark); }
  .topbar-title{ font-size:20px; font-weight:700; letter-spacing:-0.01em; }
  .topbar-title span{ color: var(--stamp-green); }
  .role-pill{
    border:1px solid var(--line); background: var(--paper-dark);
    border-radius:999px; padding:7px 12px;
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:11px;
    letter-spacing:0.04em; text-transform:uppercase; color: var(--ink-soft); cursor:pointer;
  }
  .role-pill:hover{ color: var(--ink); }
  .empresa-tag{ font-size:11.5px; color: var(--ink-soft); margin: 8px 2px 18px; }
  .empresa-tag b{ color: var(--ink); }

  /* PAGE HEADER (sub-pages) */
  .page-header{ display:flex; align-items:center; gap:10px; margin: 4px 0 18px; }
  .page-header h2{ font-size:18px; font-weight:700; }
  .page-header .sub{ font-size:11px; color: var(--ink-soft); font-family:'IBM Plex Mono', monospace; font-weight:400; margin-top:2px; }

  /* SECTION TITLES */
  .section-title{
    font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em;
    color: var(--ink-soft); margin: 22px 0 10px 2px;
    display:flex; align-items:center; gap:8px;
  }
  .section-title::after{ content:""; flex:1; border-top:1px dashed var(--line); }
  .section-title:first-child{ margin-top:0; }

  /* USER SELECT (prestador, modo teste) */
  .user-select-wrap{ margin-bottom: 16px; }
  .user-select-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color: var(--ink-soft); margin-bottom:6px; }
  select.user-select{
    width:100%; padding: 11px 14px; border-radius:10px; border:1px solid var(--line);
    background: var(--paper-light); font-family:'Space Grotesk', sans-serif; font-weight:600;
    font-size:14px; color: var(--ink);
  }

  /* CARNE CARD */
  .carne{
    background: var(--paper-light); border-radius: 14px; box-shadow: var(--shadow);
    border: 1px solid var(--line); position:relative; overflow:hidden; margin-bottom: 18px;
  }
  .carne::before{
    content:""; position:absolute; top:0; left:0; right:0; height:6px;
    background-image: radial-gradient(circle, var(--paper) 3px, transparent 3.2px);
    background-size: 16px 100%; background-position: -4px 0;
  }
  .carne-top{ padding: 24px 22px 18px; text-align:center; }
  .carne-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color: var(--ink-soft); margin-bottom:8px; }
  .carne-value{ font-family:'IBM Plex Mono', monospace; font-weight:700; font-size: 42px; letter-spacing:-0.02em; line-height:1; }
  .carne-value.low{ color: var(--mustard); }
  .carne-value.deficit{ color: var(--stamp-red); }
  .carne-sub{ margin-top:10px; font-size:13px; color: var(--ink-soft); }
  .carne-divider{ border-top: 1px dashed var(--line); margin: 0 22px; }
  .carne-bottom{ padding: 16px 22px 18px; display:flex; justify-content:space-between; gap:12px; }
  .stat{ flex:1; text-align:center; }
  .stat-num{ font-size:19px; font-weight:600; }
  .stat-num.deficit{ color: var(--stamp-red); }
  .stat-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; color: var(--ink-soft); margin-top:2px; }

  /* TODAY CARD */
  .today-card{ background: var(--paper-light); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 6px; }
  .today-date{ font-size:12px; color:var(--ink-soft); margin-bottom:12px; }
  .today-actions{ display:flex; gap:10px; }
  .stamp-btn{
    flex:1; border-radius:10px; padding: 14px 8px; font-family:'Space Grotesk', sans-serif;
    font-weight:600; font-size:14px; cursor:pointer; border:2px solid; background:transparent;
    transition: transform 0.12s ease; position:relative;
  }
  .stamp-btn:active{ transform: scale(0.96); }
  .stamp-btn.used{ border-color: var(--stamp-green); color: var(--stamp-green-dark); }
  .stamp-btn.used:hover{ background: rgba(31,111,76,0.08); }
  .stamp-btn.notused{ border-color: var(--stamp-red); color: var(--stamp-red); }
  .stamp-btn.notused:hover{ background: rgba(166,54,43,0.06); }
  .stamp-btn.selected.used{ background: var(--stamp-green); color:#fff; }
  .stamp-btn.selected.notused{ background: var(--stamp-red); color:#fff; }
  .today-hint{ text-align:center; font-size:11px; color: var(--ink-soft); margin-top:10px; }

  .stamp-mark{
    position:fixed; top:50%; left:50%; transform: translate(-50%,-50%) scale(2.2) rotate(-12deg);
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:38px; letter-spacing:0.05em;
    padding: 14px 28px; border:5px solid; border-radius:10px; opacity:0; pointer-events:none; z-index:50;
  }
  .stamp-mark.show{ animation: stampDown 0.55s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes stampDown{
    0%{ opacity:0; transform: translate(-50%,-50%) scale(3) rotate(-18deg); }
    55%{ opacity:1; transform: translate(-50%,-50%) scale(0.95) rotate(-8deg); }
    70%{ transform: translate(-50%,-50%) scale(1.05) rotate(-8deg); }
    100%{ opacity:1; transform: translate(-50%,-50%) scale(1) rotate(-8deg); }
  }

  /* ACCORDION MONTH CARDS */
  .month-card{ background: var(--paper-light); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow:hidden; }
  .month-header-btn{
    width:100%; border:none; background:transparent; cursor:pointer;
    padding: 14px 16px; display:flex; justify-content:space-between; align-items:center; text-align:left;
  }
  .month-name{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:13.5px; text-transform:capitalize; }
  .month-header-right{ display:flex; align-items:center; gap:10px; }
  .month-net{ font-size:13px; font-weight:700; }
  .month-net.pos{ color: var(--stamp-green-dark); }
  .month-net.neg{ color: var(--stamp-red); }
  .chevron{ font-size:12px; color: var(--ink-soft); transition: transform 0.2s ease; display:inline-block; }
  .chevron.open{ transform: rotate(180deg); }
  .month-rows{ display:flex; gap:14px; padding: 0 16px 14px; flex-wrap:wrap; }
  .month-row{ flex:1; min-width:70px; }
  .month-row-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em; color: var(--ink-soft); }
  .month-row-val{ font-size:13.5px; font-weight:600; margin-top:2px; }
  .month-detail-list{ border-top: 1px dashed var(--line); padding: 10px 12px 12px; }
  .month-porcontratado{ padding: 0 16px 14px; }

  /* MONTH NAV CAROUSEL */
  .month-nav{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 12px;
  }
  .month-nav-btn{
    width:38px; height:38px; border-radius:10px;
    border:1px solid var(--line); background: var(--paper-light);
    font-size:18px; font-family:'Space Grotesk', sans-serif; font-weight:700;
    color: var(--ink); cursor:pointer; flex-shrink:0;
  }
  .month-nav-btn:hover{ background: var(--paper-dark); }
  .month-nav-label{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px;
    text-transform:capitalize; text-align:center;
  }
  .month-net-line{
    text-align:center; padding: 12px 16px; font-weight:700; font-size:14px;
    border-top: 1px dashed var(--line);
  }
  .month-net-line.pos{ color: var(--stamp-green-dark); }
  .month-net-line.neg{ color: var(--stamp-red); }
  .month-back-link{
    display:block; width:100%; text-align:center; border:none; background:transparent;
    color: var(--stamp-green-dark); font-family:'Space Grotesk', sans-serif; font-weight:600;
    font-size:12px; text-decoration:underline; cursor:pointer; margin-bottom:12px; padding:2px;
  }

  /* HISTORY ITEMS (dentro da sanfona / detalhe) */
  .hist-item{
    display:flex; align-items:center; justify-content:space-between;
    padding: 11px 12px; background: var(--paper); border:1px solid var(--line);
    border-radius:9px; margin-bottom:7px; font-size:12.5px;
  }
  .hist-item:last-child{ margin-bottom:0; }
  .hist-left{ display:flex; align-items:center; gap:9px; }
  .hist-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .hist-dot.green{ background:var(--stamp-green); }
  .hist-dot.red{ background:var(--stamp-red); }
  .hist-dot.mustard{ background:var(--mustard); }
  .hist-date{ color:var(--ink-soft); font-size:10.5px; }
  .hist-val{ font-weight:600; }
  .hist-val.neg{ color: var(--stamp-red); }
  .hist-val.pos{ color: var(--stamp-green-dark); }
  .hist-right{ display:flex; align-items:center; gap:2px; }
  .hist-del, .hist-edit{
    border:none; background:transparent; color: var(--ink-soft); font-size:13px;
    line-height:1; cursor:pointer; padding:5px 6px; border-radius:6px;
  }
  .hist-del:hover{ color: var(--stamp-red); background: rgba(166,54,43,0.08); }
  .hist-edit:hover{ color: var(--stamp-green-dark); background: rgba(31,111,76,0.08); }
  .hist-edit-form{ width:100%; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .hist-edit-form input, .hist-edit-form select{
    border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font-family:'IBM Plex Mono', monospace; font-size:13px; background: var(--paper-light); color: var(--ink);
  }
  .hist-edit-form input.valor{ width:90px; }
  .hist-edit-form input.data{ flex:1; min-width:120px; }
  .hist-edit-form button{ border:none; border-radius:7px; padding: 8px 10px; font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:12px; cursor:pointer; }
  .btn-salvar{ background: var(--stamp-green); color:#fff; }
  .btn-cancelar{ background: var(--paper-dark); color: var(--ink-soft); }

  .empty{ text-align:center; padding: 22px 12px; color: var(--ink-soft); font-size:13px; }

  /* COLABORADORES (lista compacta) */
  .collab-card{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    background: var(--paper-light); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 9px; cursor:pointer; text-align:left;
  }
  .collab-card.alert{ border-color: var(--mustard); background: linear-gradient(180deg, rgba(198,138,44,0.06), var(--paper-light) 45%); }
  .collab-left{ display:flex; align-items:center; gap:11px; }
  .collab-avatar{
    width:36px; height:36px; border-radius:50%; background: var(--paper-dark);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:14px; color: var(--ink-soft); flex-shrink:0;
  }
  .collab-name{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14.5px; }
  .collab-meta{ font-size:11px; color: var(--ink-soft); margin-top:1px; }
  .collab-meta.deficit{ color: var(--stamp-red); font-weight:600; }
  .collab-right{ display:flex; align-items:center; gap:10px; }
  .collab-saldo{ font-weight:700; font-size:15px; }
  .collab-saldo.deficit{ color: var(--stamp-red); }
  .collab-chevron{ color: var(--ink-soft); font-size:16px; }

  /* SITUACAO ATUAL (resumo) */
  .situ-row{
    display:flex; align-items:center; justify-content:space-between;
    padding: 11px 14px; background: var(--paper-light); border:1px solid var(--line);
    border-radius:10px; margin-bottom:7px; font-size:13px;
  }
  .situ-name{ font-weight:600; font-family:'Space Grotesk', sans-serif; font-size:13.5px; }
  .situ-tag{ font-size:11px; color: var(--ink-soft); margin-top:1px; }
  .situ-tag.deficit{ color: var(--stamp-red); font-weight:600; }
  .situ-saldo{ font-weight:700; }
  .situ-saldo.deficit{ color: var(--stamp-red); }

  /* DEPOSIT FORM */
  .deposit-form{ display:flex; gap:8px; }
  .deposit-form input{
    flex:1; border:1px solid var(--line); border-radius:8px; padding:10px 12px;
    font-family:'IBM Plex Mono', monospace; font-size:14px; background: var(--paper); color: var(--ink);
  }
  .deposit-form input:focus{ outline:2px solid var(--stamp-green); outline-offset:1px; }
  .deposit-btn{
    border:none; background: var(--ink); color: var(--paper-light); font-family:'Space Grotesk', sans-serif;
    font-weight:600; font-size:13px; padding: 0 16px; border-radius:8px; cursor:pointer;
  }
  .deposit-btn:hover{ background: var(--stamp-green-dark); }

  /* SETTINGS PAGE */
  .field-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color: var(--ink-soft); margin-bottom:5px; margin-top:16px; }
  .field-label:first-child{ margin-top:0; }
  .field-input{
    width:100%; border:1px solid var(--line); border-radius:9px; padding:11px 13px;
    font-family:'IBM Plex Mono', monospace; font-size:13.5px; background: var(--paper-light); color: var(--ink);
  }
  .field-input:focus{ outline:2px solid var(--stamp-green); outline-offset:1px; }

  /* MODAL DE CONFIRMAÇÃO CUSTOMIZADO */
  .confirm-overlay{
    position:fixed; inset:0; background:rgba(33,38,31,0.55);
    display:flex; align-items:center; justify-content:center;
    z-index:9999; padding:22px; backdrop-filter: blur(2px);
    animation: fadeIn 0.15s ease-out;
  }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  .confirm-card{
    background: var(--paper-light); border:1px solid var(--line);
    border-radius:16px; padding:24px; max-width:380px; width:100%;
    box-shadow: var(--shadow);
    animation: popIn 0.18s ease-out;
  }
  @keyframes popIn{ from{ opacity:0; transform: translateY(6px) scale(0.98); } to{ opacity:1; transform: translateY(0) scale(1); } }
  .confirm-title{ font-family:'Space Grotesk', sans-serif; font-size:18px; font-weight:700; margin-bottom:10px; color: var(--ink); }
  .confirm-text{ font-size:13.5px; color: var(--ink-soft); line-height:1.55; margin-bottom:22px; }
  .confirm-actions{ display:flex; gap:10px; }
  .confirm-btn{
    flex:1; padding:12px 16px; border-radius:10px; border:1px solid var(--line);
    background: var(--paper); color: var(--ink); font-family:'Space Grotesk', sans-serif; font-size:13.5px;
    cursor:pointer; font-weight:600; transition: filter 0.15s;
  }
  .confirm-btn:active{ filter: brightness(0.95); }
  .confirm-btn.confirm-ok.danger{ background: var(--stamp-red); border-color: var(--stamp-red); color:#fff; }
  .confirm-btn.confirm-ok.safe{ background: var(--stamp-green); border-color: var(--stamp-green); color:#fff; }

  /* OLHO MÁGICO DA SENHA */
  .pwd-wrap{ position:relative; }
  .pwd-wrap .field-input{ padding-right:42px; }
  .pwd-toggle{
    position:absolute; right:4px; top:50%; transform: translateY(-50%);
    width:32px; height:32px; border:none; background:transparent; cursor:pointer;
    color: var(--ink-soft); display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .pwd-toggle:hover{ color: var(--ink); }

  /* CARDS DE ESCOLHA DE PAPEL (cadastro) */
  .role-card{
    display:block; width:100%; text-align:left; background: var(--paper-light);
    border:1px solid var(--line); border-radius:14px; padding:18px 18px 16px;
    cursor:pointer; font-family:inherit; transition: border-color 0.15s, transform 0.15s;
  }
  .role-card:hover{ border-color: var(--stamp-green); transform: translateY(-1px); }
  .role-icon{
    width:38px; height:38px; border-radius:10px; background: var(--paper-dark);
    display:flex; align-items:center; justify-content:center; font-size:18px; margin-bottom:12px;
  }
  .role-card h3{ font-family:'Space Grotesk', sans-serif; font-size:16px; font-weight:700; color: var(--ink); margin-bottom:6px; }
  .role-card p{ font-size:13px; color: var(--ink-soft); line-height:1.5; margin-bottom:12px; }
  .role-cta{ font-size:13px; font-weight:600; color: var(--stamp-green-dark); }

  /* CHECKBOX DE TERMOS */
  .field-check{
    display:flex; align-items:flex-start; gap:9px; font-size:12.5px; color: var(--ink-soft);
    line-height:1.5; margin: 14px 0 4px;
  }
  .field-check input{ margin-top:3px; accent-color: var(--stamp-green); flex-shrink:0; }
  .field-check a{ color: var(--stamp-green-dark); text-decoration:underline; }

  .contratado-card{
    background: var(--paper-light); border:1px solid var(--line); border-radius:12px;
    padding: 13px 15px; margin-bottom: 9px;
  }
  .contratado-card-view{ display:flex; align-items:center; justify-content:space-between; }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://cefrtcvlfvqsrlshomqc.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_ZG9dmwrjxf4-qhSKBi6f0A__agTy2Rv';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>
<script>
  const VALOR_PADRAO_DIA = 35;

  let currentUserId = null;
  let currentRole = 'prestador';
  let currentPage = 'auth-carregando';
  let selectedColaboradorId = null;
  let editingDepositId = null;
  let editingMarcacaoId = null;
  let editingContratadoId = null;
  let expandedMonths = {};
  let viewingMonth = {};
  let registroData = null;
  let meuUsuario = null;   // linha da tabela "usuarios" da pessoa logada
  let meuEmail = null;     // email de autenticação da pessoa logada
  let mostrandoBloqueioBiometria = false;
  let authErro = '';
  let authCarregando = false;
  let senhaRedefinidaComSucesso = false;

  let state = {
    config: { empresa: '', responsavel: '' },
    contratados: [],
    depositos: [],
    marcacoes: []
  };

  let modoRecuperacaoSenha = /type=recovery/.test(window.location.hash);

  sb.auth.onAuthStateChange((event) => {
    if(event === 'PASSWORD_RECOVERY'){
      modoRecuperacaoSenha = true;
      currentPage = 'auth-nova-senha';
      renderApp();
    }
  });

  // ---- AUTENTICAÇÃO ----
  async function initApp(){
    if(modoRecuperacaoSenha){
      // Veio de um link de "esqueci a senha" — espera o evento PASSWORD_RECOVERY
      // do Supabase decidir a tela, em vez de seguir o fluxo normal de login.
      currentPage = 'auth-carregando';
      renderApp();
      return;
    }
    const { data: { session } } = await sb.auth.getSession();
    if(modoRecuperacaoSenha) return; // a tela de nova senha já foi mostrada pelo listener acima
    if(!session){
      currentPage = 'auth-login';
      renderApp();
      return;
    }
    if(biometriaEstaAtivaAqui()){
      mostrandoBloqueioBiometria = true;
      currentPage = 'biometria-bloqueio';
      renderApp();
      await desbloquearComBiometria(); // já pede a digital/rosto direto, sem precisar tocar em nada antes
      return;
    }
    await carregarAposLogin();
  }

  async function carregarAposLogin(){
    if(modoRecuperacaoSenha) return; // não deixa nenhum fluxo normal de login sobrescrever a tela de nova senha
    const { data: { user } } = await sb.auth.getUser();
    if(!user){ currentPage = 'auth-login'; renderApp(); return; }
    meuEmail = user.email;

    const { data: perfil, error } = await sb.from('usuarios').select('*').eq('id', user.id).maybeSingle();
    if(error || !perfil){
      // usuário autenticado mas ainda sem perfil (empresa/contratado) — manda pro cadastro
      currentPage = 'auth-escolher-papel';
      renderApp();
      return;
    }
    meuUsuario = perfil;
    currentRole = perfil.papel;
    currentUserId = perfil.papel === 'prestador' ? perfil.id : null;
    currentPage = paginaInicialDoRole();
    await carregarDadosDaEmpresa();
  }

  async function carregarDadosDaEmpresa(){
    if(!meuUsuario) return;

    const { data: empresa } = await sb.from('empresas').select('*').eq('id', meuUsuario.empresa_id).maybeSingle();
    const { data: usuarios } = await sb.from('usuarios').select('*').eq('empresa_id', meuUsuario.empresa_id);
    const { data: depositos } = await sb.from('depositos').select('*').order('data', { ascending: true });
    const { data: marcacoes } = await sb.from('marcacoes').select('*').order('data', { ascending: true });

    const responsavelRow = (usuarios || []).find(u => u.papel === 'responsavel');

    state.config.empresa = empresa ? empresa.nome : '';
    state.config.responsavel = responsavelRow ? responsavelRow.nome : '';
    state.contratados = (usuarios || []).filter(u => u.papel === 'prestador').map(u => ({
      id: u.id, nome: u.nome, valorDiaPadrao: Number(u.valor_dia_padrao)
    }));
    state.depositos = (depositos || []).map(d => ({
      id: d.id, contratadoId: d.contratado_id, valor: Number(d.valor), data: d.data
    }));
    state.marcacoes = (marcacoes || []).map(m => ({
      id: m.id, contratadoId: m.contratado_id, data: m.data, usou: m.usou, valorDia: Number(m.valor_dia)
    }));

    renderApp();
  }

  async function fazerLogin(){
    senhaRedefinidaComSucesso = false;
    const email = document.getElementById('authEmail').value.trim();
    const senha = document.getElementById('authSenha').value;
    if(!email || !senha){ authErro = 'Preenche email e senha.'; renderApp(); return; }
    authCarregando = true; authErro = ''; renderApp();
    const { error } = await sb.auth.signInWithPassword({ email, password: senha });
    authCarregando = false;
    if(error){ authErro = error.message; renderApp(); return; }
    posthog.identify(email);
    posthog.capture('login_realizado');
    currentPage = 'auth-carregando';
    renderApp();
    await carregarAposLogin();
  }

  async function fazerCadastro(){
    const email = document.getElementById('authEmailCad').value.trim();
    const senha = document.getElementById('authSenhaCad').value;
    if(!email || !senha || senha.length < 6){ authErro = 'Email válido e senha com 6+ caracteres.'; renderApp(); return; }
    authCarregando = true; authErro = ''; renderApp();
    const { error } = await sb.auth.signUp({ email, password: senha });
    authCarregando = false;
    if(error){ authErro = error.message; renderApp(); return; }
    posthog.capture('cadastro_realizado', { email: email });
    authErro = '';
    currentPage = 'auth-confirme-email';
    renderApp();
  }

  async function criarEmpresaEEntrar(){
    const nomeEmpresa = document.getElementById('novaEmpresaNome').value.trim();
    const meuNome = document.getElementById('novoResponsavelNome').value.trim();
    if(!nomeEmpresa || !meuNome){ authErro = 'Preenche os dois campos.'; renderApp(); return; }
    if(!document.getElementById('termosResponsavel').checked){ authErro = 'Precisa aceitar os Termos de Uso e a Política de Privacidade pra continuar.'; renderApp(); return; }
    authCarregando = true; authErro = ''; renderApp();

    const { data: { user } } = await sb.auth.getUser();
    const novaEmpresaId = crypto.randomUUID();

    const { error: e1 } = await sb.from('empresas').insert({ id: novaEmpresaId, nome: nomeEmpresa });
    if(e1){ authCarregando = false; authErro = e1.message; renderApp(); return; }

    const { error: e2 } = await sb.from('usuarios').insert({
      id: user.id, empresa_id: novaEmpresaId, papel: 'responsavel', nome: meuNome
    });
    authCarregando = false;
    if(e2){ authErro = e2.message; renderApp(); return; }
    posthog.capture('empresa_criada', { nome_empresa: nomeEmpresa });
    await carregarAposLogin();
  }

  async function entrarComoContratado(){
    const empresaId = document.getElementById('empresaIdInput').value.trim();
    const meuNome = document.getElementById('novoPrestadorNome').value.trim();
    const valorDia = parseFloat((document.getElementById('novoPrestadorValor').value || '35').replace(',', '.')) || 35;
    if(!empresaId || !meuNome){ authErro = 'Preenche o código da empresa e seu nome.'; renderApp(); return; }
    if(!document.getElementById('termosPrestador').checked){ authErro = 'Precisa aceitar os Termos de Uso e a Política de Privacidade pra continuar.'; renderApp(); return; }
    authCarregando = true; authErro = ''; renderApp();

    const { data: { user } } = await sb.auth.getUser();
    const { error } = await sb.from('usuarios').insert({
      id: user.id, empresa_id: empresaId, papel: 'prestador', nome: meuNome, valor_dia_padrao: valorDia
    });
    authCarregando = false;
    if(error){ authErro = 'Código de empresa inválido ou erro: ' + error.message; renderApp(); return; }
    posthog.capture('prestador_entrou_empresa', { empresa_id: empresaId });
    await carregarAposLogin();
  }

  function customConfirm(title, message, confirmLabel, danger){
    danger = danger !== false;
    return new Promise(function(resolve){
      const overlay = document.createElement('div');
      overlay.className = 'confirm-overlay';
      overlay.innerHTML =
        '<div class="confirm-card">' +
          '<div class="confirm-title">' + title + '</div>' +
          '<div class="confirm-text">' + message + '</div>' +
          '<div class="confirm-actions">' +
            '<button class="confirm-btn confirm-cancel">Cancelar</button>' +
            '<button class="confirm-btn confirm-ok ' + (danger ? 'danger' : 'safe') + '">' + (confirmLabel || 'Confirmar') + '</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(overlay);
      function cleanup(result){ overlay.remove(); resolve(result); }
      overlay.querySelector('.confirm-cancel').onclick = function(){ cleanup(false); };
      overlay.querySelector('.confirm-ok').onclick = function(){ cleanup(true); };
      overlay.onclick = function(e){ if(e.target === overlay) cleanup(false); };
    });
  }

  function togglePwd(inputId, btn){
    const input = document.getElementById(inputId);
    if(input.type === 'password'){ input.type = 'text'; btn.textContent = '🙈'; }
    else { input.type = 'password'; btn.textContent = '👁️'; }
  }

  // ---- BIOMETRIA (digital / reconhecimento facial) ----
  // Funciona como um "cadeado local": a sessão do Supabase continua sendo a
  // autenticação de verdade. A biometria só decide se libera o acesso a essa
  // sessão já salva no aparelho, sem precisar digitar a senha de novo.
  function biometriaSuportada(){
    return typeof window.PublicKeyCredential !== 'undefined';
  }
  async function biometriaDisponivelNoAparelho(){
    if(!biometriaSuportada()) return false;
    try { return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }
    catch(e){ return false; }
  }
  function biometriaEstaAtivaAqui(){
    return localStorage.getItem('saldou_biometria_ativa') === '1';
  }
  async function ativarBiometria(){
    const disponivel = await biometriaDisponivelNoAparelho();
    if(!disponivel){
      await customConfirm('Biometria indisponível', 'Esse aparelho ou navegador não tem suporte a digital/reconhecimento facial (ou você está fora do PWA instalado). Tenta abrir o app instalado na tela inicial.', 'Entendi', false);
      return;
    }
    try{
      const challenge = crypto.getRandomValues(new Uint8Array(32));
      const userId = new TextEncoder().encode(meuUsuario.id);
      const credential = await navigator.credentials.create({
        publicKey: {
          challenge,
          rp: { name: 'SaldouVR' },
          user: { id: userId, name: meuEmail || 'usuario', displayName: meuUsuario.nome || 'Usuário' },
          pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
          authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
          timeout: 60000
        }
      });
      if(!credential) return;
      const credentialId = btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
      localStorage.setItem('saldou_biometria_ativa', '1');
      localStorage.setItem('saldou_biometria_credential_id', credentialId);
      posthog.capture('biometria_ativada');
      renderApp();
    } catch(e){
      console.warn('Saldou: falha ao ativar biometria', e);
    }
  }
  function desativarBiometria(){
    localStorage.removeItem('saldou_biometria_ativa');
    localStorage.removeItem('saldou_biometria_credential_id');
    posthog.capture('biometria_desativada');
    renderApp();
  }
  async function desbloquearComBiometria(){
    const credentialIdB64 = localStorage.getItem('saldou_biometria_credential_id');
    if(!credentialIdB64){ mostrandoBloqueioBiometria = false; await carregarAposLogin(); return; }
    try{
      const credentialId = Uint8Array.from(atob(credentialIdB64), c => c.charCodeAt(0));
      const challenge = crypto.getRandomValues(new Uint8Array(32));
      const assertion = await navigator.credentials.get({
        publicKey: { challenge, allowCredentials: [{ id: credentialId, type: 'public-key' }], userVerification: 'required', timeout: 60000 }
      });
      if(!assertion) return;
      mostrandoBloqueioBiometria = false;
      posthog.capture('desbloqueio_biometria_sucesso');
      await carregarAposLogin();
    } catch(e){
      // Cancelou ou falhou a digital — volta sozinho pro login normal, sem travar a pessoa na tela
      console.warn('Saldou: biometria falhou ou foi cancelada', e);
      mostrandoBloqueioBiometria = false;
      await executarLogout();
    }
  }
  function entrarComSenhaEmVezDeBiometria(){
    mostrandoBloqueioBiometria = false;
    executarLogout();
  }

  async function executarLogout(){
    await sb.auth.signOut();
    meuUsuario = null;
    meuEmail = null;
    state = { config:{empresa:'',responsavel:''}, contratados:[], depositos:[], marcacoes:[] };
    currentPage = 'auth-login';
    renderApp();
  }

  // ---- NOTIFICAÇÃO PUSH (lembrete diário, funciona com o app fechado) ----
  const VAPID_PUBLIC_KEY = 'BM4R5sm3bEQAI6y_vLIfJuXSTu4jFH4cgCB9LNg945DhgTd9CqQDepd3jK8TxMzgdTLnO8flYt6EKLaymJX_nfQ';
  function urlBase64ToUint8Array(base64String){
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for(let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }
  async function ativarNotificacoesPush(){
    if(!('serviceWorker' in navigator) || !('PushManager' in window)){
      await customConfirm('Não suportado', 'Esse navegador não suporta notificações push. No iPhone, precisa instalar o app na tela de início primeiro (compartilhar → adicionar à tela de início).', 'Entendi', false);
      return;
    }
    try{
      const permissao = await Notification.requestPermission();
      if(permissao !== 'granted'){
        await customConfirm('Permissão negada', 'Você recusou a permissão de notificação. Pra ativar depois, precisa liberar manualmente nas configurações de notificação do navegador/celular.', 'Entendi', false);
        return;
      }
      const registration = await navigator.serviceWorker.ready;
      let subscription = await registration.pushManager.getSubscription();
      if(!subscription){
        subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });
      }
      const subJson = subscription.toJSON();
      await sb.from('push_subscriptions').upsert({
        user_id: meuUsuario.id,
        endpoint: subJson.endpoint,
        p256dh: subJson.keys.p256dh,
        auth: subJson.keys.auth
      }, { onConflict: 'endpoint' });
      posthog.capture('push_ativado');
      await customConfirm('Notificações ativadas ✓', 'A partir de amanhã, você recebe um lembrete às 11h nos dias em que ainda não tiver registrado o uso do vale. Pode desativar quando quiser, aqui ou nas configurações do celular.', 'Show', false);
      renderApp();
    } catch(e){
      console.warn('Saldou: falha ao ativar push', e);
    }
  }
  async function desativarNotificacoesPush(){
    try{
      const registration = await navigator.serviceWorker.ready;
      const subscription = await registration.pushManager.getSubscription();
      if(subscription){
        await sb.from('push_subscriptions').delete().eq('endpoint', subscription.endpoint);
        await subscription.unsubscribe();
      }
      posthog.capture('push_desativado');
      renderApp();
    } catch(e){ console.warn('Saldou: falha ao desativar push', e); }
  }
  async function statusNotificacoesPush(){
    if(!('serviceWorker' in navigator) || !('PushManager' in window)) return false;
    try{
      const registration = await navigator.serviceWorker.ready;
      const subscription = await registration.pushManager.getSubscription();
      return !!subscription;
    } catch(e){ return false; }
  }

  async function excluirConta(){
    if(meuUsuario.papel === 'responsavel' && state.contratados.length > 0){
      await customConfirm(
        'Não é possível excluir ainda',
        'Antes de excluir sua conta, remove todos os colaboradores cadastrados (menu Configurações → Contratados). Isso evita deixar o histórico deles órfão.',
        'Entendi', false
      );
      return;
    }

    const aviso = meuUsuario.papel === 'responsavel'
      ? 'Isso apaga a empresa e todo o seu histórico de forma permanente. Seu login continua existindo, mas você vai precisar se cadastrar de novo do zero se quiser voltar a usar o SaldouVR. Essa ação não pode ser desfeita.'
      : 'Isso apaga seu vínculo com a empresa e todo o seu histórico de depósitos e marcações de forma permanente. Seu login continua existindo, mas você vai precisar se cadastrar de novo do zero se quiser voltar a usar o SaldouVR. Essa ação não pode ser desfeita.';

    const ok = await customConfirm('Excluir conta', aviso, 'Excluir tudo permanentemente');
    if(!ok) return;

    if(meuUsuario.papel === 'prestador'){
      await sb.from('depositos').delete().eq('contratado_id', meuUsuario.id);
      await sb.from('marcacoes').delete().eq('contratado_id', meuUsuario.id);
      await sb.from('usuarios').delete().eq('id', meuUsuario.id);
    } else {
      await sb.from('usuarios').delete().eq('id', meuUsuario.id);
      await sb.from('empresas').delete().eq('id', meuUsuario.empresa_id);
    }
    posthog.capture('conta_excluida', { papel: meuUsuario.papel });
    await executarLogout();
  }

  async function sair(){
    const ok = await customConfirm('Sair da conta', 'Você vai precisar fazer login novamente da próxima vez. Tem certeza que quer sair?', 'Sair da conta');
    if(!ok) return;
    await executarLogout();
  }

  async function sairDaEmpresa(){
    const ok = await customConfirm('Sair da empresa', 'Isso remove seu vínculo com essa empresa (histórico, saldo, tudo). Seu login continua existindo — na próxima vez você pode entrar numa empresa diferente.', 'Sair da empresa');
    if(!ok) return;
    await sb.from('usuarios').delete().eq('id', meuUsuario.id);
    await executarLogout();
  }

  function isoLocal(d){
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function isoDaysAgo(n){ const d = new Date(); d.setDate(d.getDate() - n); return isoLocal(d); }
  function todayISO(){ return isoLocal(new Date()); }
  function formatBRL(v){ return 'R$ ' + v.toFixed(2).replace('.', ','); }
  function formatDateBR(iso){ const [y,m,d] = iso.split('-'); return `${d}/${m}`; }
  function contratadoNome(id){ const c = state.contratados.find(x => x.id === id); return c ? c.nome : '—'; }
  function iniciais(nome){ return nome.trim().split(/\s+/).slice(0,2).map(p=>p[0]).join('').toUpperCase(); }

  // ---- CALCULOS ----
  function totalDepositos(contratadoId){
    return state.depositos.filter(d => d.contratadoId === contratadoId).reduce((s,d)=> s + d.valor, 0);
  }
  function totalUsado(contratadoId){
    return state.marcacoes.filter(m => m.contratadoId === contratadoId && m.usou).reduce((s,m)=> s + m.valorDia, 0);
  }
  function saldoAtual(contratadoId){ return totalDepositos(contratadoId) - totalUsado(contratadoId); }
  function valorDiaMedio(contratadoId){
    const c = state.contratados.find(x => x.id === contratadoId);
    const padrao = c ? c.valorDiaPadrao : VALOR_PADRAO_DIA;
    const usados = state.marcacoes.filter(m => m.contratadoId === contratadoId && m.usou);
    if(usados.length === 0) return padrao;
    return usados.reduce((s,m)=> s + m.valorDia, 0) / usados.length;
  }
  function marcacaoDeHoje(contratadoId){
    return state.marcacoes.find(m => m.contratadoId === contratadoId && m.data === todayISO());
  }
  function marcacaoDoDia(contratadoId, data){
    return state.marcacoes.find(m => m.contratadoId === contratadoId && m.data === data);
  }
  function diasInfo(contratadoId){
    const saldo = saldoAtual(contratadoId);
    const media = valorDiaMedio(contratadoId);
    if(media <= 0) return { saldo, media, deficit:false, dias:0 };
    if(saldo < 0) return { saldo, media, deficit:true, dias: Math.floor(Math.abs(saldo)/media) };
    return { saldo, media, deficit:false, dias: Math.floor(saldo/media) };
  }

  async function marcarDia(usou){
    if(!currentUserId) return;
    const input = document.getElementById('dataRegistroInput');
    const data = (input && input.value) ? input.value : todayISO();
    registroData = data;
    const existente = marcacaoDoDia(currentUserId, data);

    if(existente && existente.usou === usou){
      await sb.from('marcacoes').delete().eq('id', existente.id);
      await carregarDadosDaEmpresa();
      return;
    }
    if(existente){
      await sb.from('marcacoes').update({ usou, valor_dia: usou ? valorDiaMedio(currentUserId) : 0 }).eq('id', existente.id);
    } else {
      await sb.from('marcacoes').insert({
        empresa_id: meuUsuario.empresa_id, contratado_id: currentUserId, data,
        usou, valor_dia: usou ? valorDiaMedio(currentUserId) : 0
      });
    }
    posthog.capture('dia_marcado', { usou: usou });
    showStamp(usou);
    await carregarDadosDaEmpresa();
  }

  // ---- RESUMO MENSAL / HISTORICO ----
  const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  function monthKey(iso){ return iso.slice(0,7); }
  function monthLabel(key){ const [y,m] = key.split('-'); return `${MESES[parseInt(m,10)-1]} de ${y}`; }

  function resumoMensal(contratadoId){
    const meses = {};
    const deps = contratadoId ? state.depositos.filter(d => d.contratadoId === contratadoId) : state.depositos;
    const marks = contratadoId ? state.marcacoes.filter(m => m.contratadoId === contratadoId) : state.marcacoes;
    deps.forEach(d => {
      const k = monthKey(d.data);
      if(!meses[k]) meses[k] = { depositado:0, usado:0, diasUsados:0, diasNaoUsados:0 };
      meses[k].depositado += d.valor;
    });
    marks.forEach(m => {
      const k = monthKey(m.data);
      if(!meses[k]) meses[k] = { depositado:0, usado:0, diasUsados:0, diasNaoUsados:0 };
      if(m.usou){ meses[k].usado += m.valorDia; meses[k].diasUsados += 1; }
      else { meses[k].diasNaoUsados += 1; }
    });
    return Object.keys(meses).sort((a,b)=> b.localeCompare(a)).map(k => ({ key:k, ...meses[k] }));
  }

  function acumuladoAteMes(contratadoId, mk){
    const meses = resumoMensal(contratadoId).filter(m => m.key <= mk);
    const depositado = meses.reduce((s,m)=> s + m.depositado, 0);
    const usado = meses.reduce((s,m)=> s + m.usado, 0);
    return { depositado, usado, saldo: depositado - usado };
  }

  function resumoPeriodoParaMes(contratadoId, mk){
    const ano = mk.slice(0,4);
    const meses = resumoMensal(contratadoId);
    const doMes = meses.find(m => m.key === mk);
    const recebidoMes = doMes ? doMes.depositado : 0;
    const recebidoAno = meses.filter(m => m.key.startsWith(ano)).reduce((s,m)=> s + m.depositado, 0);
    return { recebidoMes, recebidoAno };
  }

  function resumoPeriodoAtual(contratadoId){
    const hoje = todayISO();
    const mesAtual = hoje.slice(0,7);
    const anoAtual = hoje.slice(0,4);
    const meses = resumoMensal(contratadoId);
    const doMes = meses.find(m => m.key === mesAtual);
    const recebidoMes = doMes ? doMes.depositado : 0;
    const usadoMes = doMes ? doMes.usado : 0;
    const recebidoAno = meses.filter(m => m.key.startsWith(anoAtual)).reduce((s,m)=> s + m.depositado, 0);
    const usadoAno = meses.filter(m => m.key.startsWith(anoAtual)).reduce((s,m)=> s + m.usado, 0);
    return { recebidoMes, usadoMes, recebidoAno, usadoAno };
  }

  function renderPeriodoCard(p, perspectivaEmpresa){
    const rotulo = perspectivaEmpresa ? 'Depositado' : 'Recebido';
    return `
      <div class="today-card" style="margin-bottom:18px;">

            <div class="stat-label">${rotulo} no ano</div>
          </div>
        </div>
      </div>
    `;
  }

  function resumoMensalPorContratado(){
    const meses = {};
    state.depositos.forEach(d => {
      const k = monthKey(d.data);
      if(!meses[k]) meses[k] = { total:0, porContratado:{} };
      meses[k].total += d.valor;
      meses[k].porContratado[d.contratadoId] = (meses[k].porContratado[d.contratadoId] || 0) + d.valor;
    });
    return Object.keys(meses).sort((a,b)=> b.localeCompare(a)).map(k => ({ key:k, ...meses[k] }));
  }

  function historicoAgrupado(contratadoId){
    const deps = (contratadoId ? state.depositos.filter(d => d.contratadoId === contratadoId) : state.depositos)
      .map(d => ({ tipo:'deposito', ...d }));
    const marks = (contratadoId ? state.marcacoes.filter(m => m.contratadoId === contratadoId) : state.marcacoes)
      .map(m => ({ tipo:'marcacao', ...m }));
    const itens = [...deps, ...marks];
    itens.sort((a,b) => {
      if(a.data !== b.data) return a.data.localeCompare(b.data);
      if(a.tipo !== b.tipo) return a.tipo === 'deposito' ? -1 : 1;
      return a.id - b.id;
    });
    return itens;
  }
  function historicoDoMes(contratadoId, mk){
    return historicoAgrupado(contratadoId).filter(item => monthKey(item.data) === mk);
  }

  function renderItemHistorico(item, mostrarNome, perspectivaEmpresa){
    const nomeTag = mostrarNome ? ` · ${contratadoNome(item.contratadoId)}` : '';

            <button class="hist-del" onclick="excluirDeposito('${item.id}')" title="Excluir">✕</button>

      return `

            </select>

            <input class="data" id="editDataM_${item.id}" type="date" value="${item.data}">
            <button class="btn-salvar" onclick="salvarEdicaoMarcacao('${item.id}')">Salvar</button>

    return `
      <div class="hist-item">

          <div class="hist-dot ${item.usou ? 'red' : 'green'}"></div>
          <div><div>${item.usou ? 'Usou VR' : 'Não usou'}${nomeTag}</div><div class="hist-date">${formatDateBR(item.data)}</div></div>
        </div>
        <div class="hist-right">
          <div class="hist-val ${item.usou ? 'neg' : ''}">${item.usou ? '-' + formatBRL(item.valorDia) : 'saldo mantido'}</div>
          <button class="hist-edit" onclick="iniciarEdicaoMarcacao('${item.id}')" title="Editar">✎</button>
          <button class="hist-del" onclick="excluirMarcacao('${item.id}')" title="Excluir">✕</button>
        </div>
      </div>`;
  }

  function toggleMonth(scopeKey, mk){
    expandedMonths[scopeKey] = (expandedMonths[scopeKey] === mk) ? null : mk;
    renderApp();
  }

  function mesAdjacente(key, delta){
    let [y,m] = key.split('-').map(Number);
    m += delta;
    if(m < 1){ m = 12; y -= 1; } else if(m > 12){ m = 1; y += 1; }
    return `${y}-${String(m).padStart(2,'0')}`;
  }

  function navegarMes(scopeKey, delta){
    const atual = viewingMonth[scopeKey] || todayISO().slice(0,7);
    viewingMonth[scopeKey] = mesAdjacente(atual, delta);
    registroData = null;
    renderApp();
  }

  function statsDoMes(contratadoId, mk){
    const encontrado = resumoMensal(contratadoId).find(m => m.key === mk);
    return encontrado || { key:mk, depositado:0, usado:0, diasUsados:0, diasNaoUsados:0 };
  }

  function voltarMesAtual(scopeKey){
    viewingMonth[scopeKey] = todayISO().slice(0,7);
    registroData = null;
    renderApp();
  }

  function resumoAnual(contratadoId, ano){
    const meses = resumoMensal(contratadoId).filter(m => m.key.startsWith(ano));
    return meses.reduce((acc,m) => {
      acc.depositado += m.depositado;
      acc.usado += m.usado;
      acc.diasUsados += m.diasUsados;
      acc.diasNaoUsados += m.diasNaoUsados;
      return acc;
    }, { depositado:0, usado:0, diasUsados:0, diasNaoUsados:0 });
  }

  function renderAcumuladoAno(contratadoId, mk, perspectivaEmpresa){
    const ano = mk.slice(0,4);
    const r = resumoAnual(contratadoId, ano);

          <div class="month-row"><div class="month-row-label">Sem uso</div><div class="month-row-val">${r.diasNaoUsados}</div></div>
          <div class="month-row"><div class="month-row-label">Usado no ano</div><div class="month-row-val">${formatBRL(r.usado)}</div></div>
        </div>
        <div class="month-net-line pos" style="font-size:19px;">${rotulo} no ano: ${formatBRL(r.depositado)}</div>
      </div>
    `;
  }

  function renderMonthCarousel(contratadoId, scopeKey, perspectivaEmpresa){
    const mk = viewingMonth[scopeKey] || todayISO().slice(0,7);
    const mesAtual = todayISO().slice(0,7);
    const stats = statsDoMes(contratadoId, mk);
    const itens = historicoDoMes(contratadoId, mk);

    const futuro = mk > mesAtual;

    if(futuro){
      return `
        <div class="month-nav">

          <div class="month-net-line ${info.deficit ? 'neg' : (info.saldo === 0 ? 'neg' : 'pos')}">${
            info.deficit ? `Sem saldo — déficit de ${formatBRL(Math.abs(info.saldo))}` :
            info.saldo === 0 ? 'Sem saldo disponível' :

          }</div>
        </div>

    }

    return `
      <div class="month-nav">
        <button class="month-nav-btn" onclick="navegarMes('${scopeKey}',-1)">‹</button>
        <div class="month-nav-label">${monthLabel(mk)}</div>
        <button class="month-nav-btn" onclick="navegarMes('${scopeKey}',1)">›</button>
      </div>
      ${!mostrarSaldoAtual ? `<button class="month-back-link" onclick="voltarMesAtual('${scopeKey}')">↺ Voltar para ${monthLabel(mesAtual)}</button>` : ''}
      <div class="month-card">
        <div class="month-rows" style="padding-top:14px;">
          <div class="month-row"><div class="month-row-label">${perspectivaEmpresa ? 'Depositado' : 'Recebido'}</div><div class="month-row-val">${formatBRL(stats.depositado)}</div></div>
          <div class="month-row"><div class="month-row-label">Usado</div><div class="month-row-val">${formatBRL(stats.usado)}</div></div>

        <div class="month-detail-list">${itens.length ? itens.map(i=>renderItemHistorico(i,false,perspectivaEmpresa)).join('') : '<div class="empty">Nenhuma movimentação neste mês.</div>'}</div>
        ${mostrarSaldoAtual ? `<div class="month-net-line ${info.deficit ? 'neg' : (info.saldo === 0 ? 'neg' : 'pos')}">${
          info.deficit ? `Sem saldo — déficit de ${formatBRL(Math.abs(info.saldo))}` :
          info.saldo === 0 ? 'Sem saldo disponível' :
          `Saldo disponível: ${formatBRL(info.saldo)}`
        }</div>` : ''}
      </div>
    `;
  }

  function renderMonthAccordionEmpresa(scopeKey){
    const meses = resumoMensalPorContratado();
    if(meses.length === 0) return '<div class="empty">Sem depósitos registrados ainda.</div>';
    if(!(scopeKey in expandedMonths)) expandedMonths[scopeKey] = meses[0].key;
    const aberto = expandedMonths[scopeKey];
    return meses.map(mes => {
      const isOpen = mes.key === aberto;

  function paginaPrestadorHoje(){
    if(!currentUserId || state.contratados.length === 0){
      return `<div class="empty">Nenhum contratado cadastrado ainda. Peça pro responsável cadastrar você no menu ☰ → Configurações.</div>`;
    }
    const scopeKey = 'prestador-' + currentUserId;
    const mesAtual = todayISO().slice(0,7);
    const mk = viewingMonth[scopeKey] || mesAtual;
    const noMesAtual = mk === mesAtual;

    let cardHtml;
    if(mk >= mesAtual){
      const info = diasInfo(currentUserId);
      const futuro = mk > mesAtual;
      cardHtml = `
        <div class="carne">
          <div class="carne-top">
            <div class="carne-label">Saldo disponível</div>
            <div class="carne-value ${info.deficit ? 'deficit' : (info.saldo < info.media ? 'low' : '')}">${formatBRL(info.saldo)}</div>
            <div class="carne-sub">${
              futuro ? 'esse mês ainda não chegou — saldo atual mantido' :
              info.deficit ? 'Saldo negativo — avise o responsável' :
              info.saldo === 0 ? 'Sem saldo — avise o responsável' :
              info.saldo < info.media ? 'Saldo baixo, acaba logo' :
              `cobre ${info.dias} dia${info.dias===1?'':'s'} no ritmo atual`
            }</div>
          </div>
          <div class="carne-divider"></div>
          <div class="carne-bottom">
            <div class="stat"><div class="stat-num ${info.deficit?'deficit':''}">${futuro ? 0 : info.dias}</div><div class="stat-label">${info.deficit?'dias em déficit':'dias restantes'}</div></div>
            <div class="stat"><div class="stat-num">R$${futuro ? 0 : info.media.toFixed(0)}</div><div class="stat-label">valor/dia médio</div></div>
            <div class="stat"><div class="stat-num">R$${futuro ? 0 : totalUsado(currentUserId).toFixed(0)}</div><div class="stat-label">Total usado</div></div>
          </div>
        </div>`;
    } else {
      const media = valorDiaMedio(currentUserId);
      const acumulado = acumuladoAteMes(currentUserId, mk);
      const deficit = acumulado.saldo < 0;
      const dias = media > 0 ? Math.floor(Math.abs(acumulado.saldo) / media) : 0;
      cardHtml = `
        <div class="carne">
          <div class="carne-top">
            <div class="carne-label">Saldo até ${monthLabel(mk)}</div>
            <div class="carne-value ${deficit ? 'deficit' : ''}">${formatBRL(acumulado.saldo)}</div>
            <div class="carne-sub">valores acumulados até o fim do mês selecionado</div>
          </div>
          <div class="carne-divider"></div>
          <div class="carne-bottom">
            <div class="stat"><div class="stat-num ${deficit?'deficit':''}">${dias}</div><div class="stat-label">${deficit?'dias em déficit':'dias restantes'}</div></div>
            <div class="stat"><div class="stat-num">R$${media.toFixed(0)}</div><div class="stat-label">valor/dia médio</div></div>
            <div class="stat"><div class="stat-num">R$${acumulado.usado.toFixed(0)}</div><div class="stat-label">Total usado</div></div>
          </div>
        </div>`;
    }

    const dataAtual = registroData || (noMesAtual ? todayISO() : mk + '-01');
    const diaSelecionado = marcacaoDoDia(currentUserId, dataAtual);
    const ehHoje = dataAtual === todayISO();
    const labelData = new Date(dataAtual + 'T00:00:00').toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });

    return `
      <div class="month-nav">
        <button class="month-nav-btn" onclick="navegarMes('${scopeKey}',-1)">‹</button>
        <div class="month-nav-label">${monthLabel(mk)}</div>
        <button class="month-nav-btn" onclick="navegarMes('${scopeKey}',1)">›</button>
      </div>
      ${!noMesAtual ? `<button class="month-back-link" onclick="voltarMesAtual('${scopeKey}')">↺ Voltar para ${monthLabel(mesAtual)}</button>` : ''}

      ${cardHtml}

      <div class="today-card">
        <div class="field-label" style="margin-top:0;">Data do registro</div>
        <input type="date" id="dataRegistroInput" class="field-input" value="${dataAtual}" onchange="mudarDataRegistro(this.value)" style="margin-bottom:12px;">
        <div class="today-date">${labelData}</div>
        <div class="today-actions">
          <button class="stamp-btn used ${diaSelecionado && diaSelecionado.usou ? 'selected' : ''}" onclick="marcarDia(true)">✓ ${ehHoje ? 'Usei hoje' : 'Usou nesse dia'}</button>
          <button class="stamp-btn notused ${diaSelecionado && !diaSelecionado.usou ? 'selected' : ''}" onclick="marcarDia(false)">✕ ${ehHoje ? 'Não usei' : 'Não usou'}</button>
        </div>
        <div class="today-hint">Toque de novo no botão marcado pra desfazer</div>
      </div>
    `;
  }

  async function enviarRecuperacaoSenha(){
    const email = document.getElementById('authEmailRecuperar').value.trim();
    if(!email){ authErro = 'Digita seu email.'; renderApp(); return; }
    authCarregando = true; authErro = ''; renderApp();
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname
    });
    authCarregando = false;
    if(error){ authErro = error.message; renderApp(); return; }
    posthog.capture('recuperacao_senha_solicitada');
    currentPage = 'auth-esqueci-senha-enviado';
    renderApp();
  }

          Digita sua nova senha de acesso.
        </div>
        <div class="field-label" style="margin-top:0;">Senha nova (mínimo 6 caracteres)</div>
        <div class="pwd-wrap">
          <input class="field-input" id="authNovaSenha" type="password" placeholder="••••••••">
          <button type="button" class="pwd-toggle" onclick="togglePwd('authNovaSenha', this)">👁️</button>
        </div>
        ${authErro ? `<div style="color:var(--stamp-red); font-size:12.5px; margin-top:12px;">${authErro}</div>` : ''}
        <button class="deposit-btn" style="width:100%; margin-top:16px; padding:14px; font-size:14px;" onclick="salvarNovaSenha()" ${authCarregando ? 'disabled' : ''}>${authCarregando ? 'Salvando…' : 'Salvar senha nova'}</button>
      </div>
    `;
  }

  async function salvarNovaSenha(){
    const novaSenha = document.getElementById('authNovaSenha').value;
    if(!novaSenha || novaSenha.length < 6){ authErro = 'A senha precisa ter no mínimo 6 caracteres.'; renderApp(); return; }
    authCarregando = true; authErro = ''; renderApp();
    const { error } = await sb.auth.updateUser({ password: novaSenha });
    authCarregando = false;
    if(error){ authErro = error.message; renderApp(); return; }
    posthog.capture('senha_redefinida');
    await sb.auth.signOut(); // encerra a sessão temporária de recuperação — a pessoa confirma a senha nova fazendo login manual
    modoRecuperacaoSenha = false;
    authErro = '';
    senhaRedefinidaComSucesso = true;
    currentPage = 'auth-login';
    renderApp();
  }

  function paginaAuthEscolherPapel(){
    return `
      <div class="page-header"><h2>Bem-vindo ao Saldou<span style="color:var(--stamp-green)">VR</span></h2><div class="sub">Como você vai usar o app?</div></div>
      <button class="role-card" onclick="irPara('auth-cadastro-responsavel')" style="margin-bottom:12px;">
        <div class="role-icon">🏢</div>
        <h3>Sou Empresa</h3>
        <p>Quero controlar o vale-refeição da minha equipe e gerar o código de convite pros colaboradores.</p>
        <div class="role-cta">Cadastrar minha empresa →</div>
      </button>
      <button class="role-card" onclick="irPara('auth-cadastro-prestador')">
        <div class="role-icon">🙋</div>
        <h3>Sou Colaborador</h3>
        <p>Já tenho o código da minha empresa e quero controlar meu próprio saldo de almoço e janta.</p>
        <div class="role-cta">Cadastrar minha conta →</div>
      </button>
      <div style="text-align:center; margin-top:18px; font-size:13px; color:var(--ink-soft);">
        Já tem conta? <a href="#" onclick="irParaLogin(); return false;" style="color:var(--stamp-green-dark); font-weight:600; text-decoration:underline;">Fazer login</a>
      </div>
    `;
  }

  function paginaTermosPrivacidade(){
    return `
      <div class="page-header">
        <button class="icon-btn" onclick="history.back ? window.history.back() : irParaLogin()">←</button>
        <div><h2>Termos e Privacidade</h2></div>
      </div>
      <div class="today-card">
        <div style="font-size:13.5px; line-height:1.6; color:var(--ink-soft);">
          Os Termos de Uso e a Política de Privacidade do SaldouVR ainda estão sendo redigidos e serão publicados aqui em breve.
        </div>
      </div>
    `;
  }

  function paginaAuthCadastroResponsavel(){
    return `
      <div class="page-header">
        <button class="icon-btn" onclick="irPara('auth-escolher-papel')">←</button>
        <div><h2>Criar empresa</h2></div>
      </div>
      <div class="today-card">
        <div class="field-label" style="margin-top:0;">Nome da empresa</div>
        <input class="field-input" id="novaEmpresaNome" placeholder="Ex: Agasense">
        <div class="field-label">Seu nome</div>
        <input class="field-input" id="novoResponsavelNome" placeholder="Seu nome completo">
        <label class="field-check">
          <input type="checkbox" id="termosResponsavel">
          <span>Li e concordo com os <a href="#" onclick="irPara('termos-privacidade'); return false;">Termos de Uso</a> e a <a href="#" onclick="irPara('termos-privacidade'); return false;">Política de Privacidade</a>.</span>
        </label>
        ${authErro ? `<div style="color:var(--stamp-red); font-size:12.5px; margin-top:12px;">${authErro}</div>` : ''}
        <button class="deposit-btn" style="width:100%; margin-top:16px; padding:14px; font-size:14px;" onclick="criarEmpresaEEntrar()" ${authCarregando ? 'disabled' : ''}>${authCarregando ? 'Criando…' : 'Criar empresa e entrar'}</button>
      </div>
    `;
  }

  function paginaAuthCadastroPrestador(){
    return `
      <div class="page-header">
        <button class="icon-btn" onclick="irPara('auth-escolher-papel')">←</button>
        <div><h2>Entrar numa empresa</h2></div>
      </div>
      <div class="today-card">
        <div class="field-label" style="margin-top:0;">Código da empresa</div>
        <input class="field-input" id="empresaIdInput" placeholder="Cole o código que o responsável te mandou">
        <div class="field-label">Seu nome</div>
        <input class="field-input" id="novoPrestadorNome" placeholder="Seu nome completo">
        <div class="field-label">Valor padrão do dia (R$)</div>
        <input class="field-input" id="novoPrestadorValor" placeholder="35" inputmode="decimal">
        <label class="field-check">
          <input type="checkbox" id="termosPrestador">
          <span>Li e concordo com os <a href="#" onclick="irPara('termos-privacidade'); return false;">Termos de Uso</a> e a <a href="#" onclick="irPara('termos-privacidade'); return false;">Política de Privacidade</a>.</span>
        </label>
        ${authErro ? `<div style="color:var(--stamp-red); font-size:12.5px; margin-top:12px;">${authErro}</div>` : ''}
        <button class="deposit-btn" style="width:100%; margin-top:16px; padding:14px; font-size:14px;" onclick="entrarComoContratado()" ${authCarregando ? 'disabled' : ''}>${authCarregando ? 'Entrando…' : 'Entrar'}</button>
      </div>
    `;
  }

  // ---- BOTTOM NAV ----
  function renderBottomNav(){
    const el = document.getElementById('bottomNav');
    if(currentPage === 'settings'){ el.innerHTML = ''; return; }
    let itens;
    if(currentRole === 'prestador'){
      itens = [
        { page:'prestador-hoje', icon:'🏠', label:'Meu VR' },
        { page:'prestador-historico', icon:'📊', label:'Histórico' }
      ];
    } else {
      itens = [
        { page:'responsavel-colaboradores', icon:'👥', label:'Colaboradores' },
        { page:'responsavel-resumo', icon:'📈', label:'Resumo' }
      ];
    }
    const ativoBase = currentPage === 'responsavel-detalhe' ? 'responsavel-colaboradores' : currentPage;
    el.innerHTML = itens.map(it => `
      <button class="nav-btn ${it.page===ativoBase?'active':''}" onclick="irPara('${it.page}')">
        <span class="icon">${it.icon}</span><span>${it.label}</span>
      </button>`).join('');
  }

  // ---- RENDER GERAL ----
  function renderApp(){
    const telaDeAuth = currentPage.startsWith('auth-') || currentPage === 'biometria-bloqueio';
    const topbarEl = document.querySelector('.topbar');
    const empresaTagEl = document.getElementById('empresaTag');

    topbarEl.style.display = telaDeAuth ? 'none' : 'flex';
    empresaTagEl.style.display = telaDeAuth ? 'none' : 'block';

    if(!telaDeAuth){
      document.getElementById('rolePill').textContent = currentRole === 'prestador' ? 'Prestador' : 'Responsável';
      empresaTagEl.innerHTML = `<b>${state.config.empresa}</b> · responsável: ${state.config.responsavel}`;
    }

    let html = '';
    switch(currentPage){
      case 'auth-carregando': html = paginaAuthCarregando(); break;
      case 'biometria-bloqueio': html = paginaBiometriaBloqueio(); break;
      case 'auth-login': html = paginaAuthLogin(); break;
      case 'auth-cadastro': html = paginaAuthCadastro(); break;
      case 'auth-confirme-email': html = paginaAuthConfirmeEmail(); break;
      case 'auth-esqueci-senha': html = paginaAuthEsqueciSenha(); break;
      case 'auth-esqueci-senha-enviado': html = paginaAuthEsqueciSenhaEnviado(); break;
      case 'auth-nova-senha': html = paginaAuthNovaSenha(); break;
      case 'auth-escolher-papel': html = paginaAuthEscolherPapel(); break;
      case 'termos-privacidade': html = paginaTermosPrivacidade(); break;
      case 'auth-cadastro-responsavel': html = paginaAuthCadastroResponsavel(); break;
      case 'auth-cadastro-prestador': html = paginaAuthCadastroPrestador(); break;
      case 'prestador-hoje': html = paginaPrestadorHoje(); break;
      case 'prestador-historico': html = paginaPrestadorHistorico(); break;
      case 'responsavel-colaboradores': html = paginaResponsavelColaboradores(); break;
      case 'responsavel-detalhe': html = paginaResponsavelDetalhe(); break;
      case 'responsavel-resumo': html = paginaResponsavelResumo(); break;
      case 'settings': html = paginaSettings(); break;
      default: html = paginaPrestadorHoje();
    }
    document.getElementById('pageContent').innerHTML = html;
    if(telaDeAuth){ document.getElementById('bottomNav').innerHTML = ''; }
    else { renderBottomNav(); }
  }

  initApp();

  // Registra o service worker (funciona offline + instalável como PWA de verdade)
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => {
        console.warn('Saldou: falha ao registrar service worker', err);
      });
    });
  }
</script>

</body>
</html>
